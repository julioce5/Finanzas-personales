  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

transform:scale(1.08);}\n  .fab-menu{position:fixed;bottom:86px;right:20px;z-index:50;display:none;flex-direction:column;gap:8px;align-items:flex-end;}\n  .fab-menu.open{display:flex;}\n  .fab-item{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border2);border-radius:20px;padding:7px 14px 7px 10px;font-size:13px;cursor:pointer;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.3);}\n  .fab-item:hover{border-color:var(--green);}\n  /* NOTAS */\n  .nota-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:8px;cursor:pointer;}\n  .nota-item:hover{border-color:var(--border2);}\n  .nota-text{font-size:13px;color:var(--text);white-space:pre-wrap;word-break:break-word;}\n  .nota-date{font-size:10px;color:var(--text3);margin-top:6px;}\n  /* RACHA */\n  .racha-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:14px;display:flex;align-items:center;gap:12px;}\n  /* BARRAS MENSUALES */\n  .barras-wrap{margin-bottom:16px;overflow-x:auto;}\n  .barras-inner{display:flex;gap:6px;min-width:320px;align-items:flex-end;height:80px;padding:0 2px;}\n  .barra-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:18px;}\n  .barra-pair{width:100%;display:flex;gap:2px;align-items:flex-end;height:64px;}\n  .barra-ing{flex:1;border-radius:3px 3px 0 0;background:var(--green);min-height:2px;transition:height .3s;}\n  .barra-egr{flex:1;border-radius:3px 3px 0 0;background:var(--red);min-height:2px;transition:height .3s;}\n  .barra-label{font-size:9px;color:var(--text3);}\n  /* CAT CUSTOM */\n  .cat-tag{display:inline-flex;align-items:center;gap:4px;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:3px 8px;font-size:11px;color:var(--text2);margin:2px;}\n  .cat-tag button{background:none;border:none;color:var(--text3);cursor:pointer;font-size:13px;padding:0;line-height:1;}\n  *{box-sizing:border-box;margin:0;padding:0;}\n  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;}\n\n  header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:54px;position:sticky;top:0;z-index:20;gap:10px;}\n  .logo{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--text);}\n  .logo svg{color:var(--green);}\n  .header-right{display:flex;gap:6px;}\n\n  .backup-panel{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 16px;display:none;gap:8px;flex-wrap:wrap;align-items:center;}\n  .backup-panel.open{display:flex;}\n  .backup-panel span{font-size:12px;color:var(--text2);flex:1;min-width:160px;}\n\n  .year-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:8px 16px;display:flex;align-items:center;gap:10px;}\n  .year-bar label{font-size:12px;color:var(--text2);}\n  .year-bar select{background:var(--surface2);border:1px solid var(--border2);color:var(--text);border-radius:var(--radius-sm);padding:4px 10px;font-size:13px;font-weight:600;}\n  .year-bar select option{background:#1a1a1a;}\n\n  .tabs{display:flex;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:54px;z-index:19;}\n  .tab{flex:1;padding:8px 2px;font-size:11px;font-weight:500;color:var(--text2);cursor:pointer;text-align:center;border-bottom:2px solid transparent;}\n  .tab:hover{color:var(--text);}\n  .tab.active{color:var(--text);border-bottom-color:var(--green);}\n  .tab-icon{display:flex;align-items:center;justify-content:center;margin-bottom:3px;}\n\n  .section{display:none;padding:14px 16px;}\n  .section.active{display:block;}\n\n  /* SUMMARY */\n  .summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px;}\n  @media(min-width:480px){.summary-grid{grid-template-columns:repeat(3,1fr);}}\n  @media(min-width:700px){.summary-grid{grid-template-columns:repeat(5,1fr);}}\n  .sum-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;}\n  .sum-label{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}\n  .sum-value{font-size:19px;font-weight:700;}\n  .sum-value.green{color:var(--green);}\n  .sum-value.red{color:var(--red);}\n  .sum-value.yellow{color:var(--yellow);}\n\n  .month-table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border);}\n  table{width:100%;border-collapse:collapse;font-size:12px;min-width:580px;}\n  thead th{background:var(--surface2);color:var(--text2);font-size:10px;text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap;}\n  thead th:first-child{text-align:left;}\n  tbody tr{border-bottom:1px solid var(--border);}\n  tbody tr:last-child{border-bottom:none;}\n  tbody tr:hover{background:var(--surface2);}\n  tbody tr.total-row{background:var(--surface2);font-weight:700;}\n  td{padding:8px 10px;text-align:right;color:var(--text);}\n  td:first-child{text-align:left;color:var(--text2);font-weight:500;}\n  td.g{color:var(--green);}td.r{color:var(--red);}td.p{color:var(--purple);}td.y{color:var(--yellow);}\n  td.pos{color:var(--green);font-weight:700;}td.neg{color:var(--red);font-weight:700;}\n\n  /* TX */\n  .sec-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px;}\n  .sec-header h3{font-size:15px;font-weight:600;}\n  .tx-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}\n  .tx-filter select,.tx-filter input{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-sm);padding:0 10px;height:32px;font-size:12px;}\n  .tx-filter input{flex:1;min-width:120px;}\n  .tx-filter select option{background:#1a1a1a;}\n  .tx- und:var(--surface);border:1px solid var(--border2);border-radius:var(--radius) var(--radius) 0 0;width:100%;max-width:440px;max-height:92vh;overflow-y:auto;display:flex;flex-direction:column;}\n  @media(min-width:560px){.modal{border-radius:var(--radius);}}\n  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:1;}\n  .modal-head h3{font-size:15px;font-weight:600;}\n  .modal-body{padding:14px 16px;display:flex;flex-direction:column;gap:11px;flex:1;}\n  .modal-foot{padding:11px 16px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:var(--surface);}\n  .field{display:flex;flex-direction:column;gap:4px;}\n  .field label{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;}\n  .field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--border2);color:var(--text);border-radius:var(--radius-sm);padding:7px 10px;font-size:13px;}\n  .field input:focus,.field select:focus{outline:none;border-color:var(--green);}\n  .field select option{background:#1a1a1a;}\n  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}\n  .type-toggle{display:grid;grid-template-columns:1fr 1fr;gap:6px;}\n  .type-btn{padding:8px;border-radius:var(--radius-sm);border:1px solid var(--border2);cursor:pointer;text-align:center;font-size:13px;font-weight:600;background:var(--surface2);color:var(--text2);}\n  .type-btn.sel-ing{background:var(--green-bg);border-color:var(--green-dim);color:var(--green);}\n  .type-btn.sel-egr{background:var(--red-bg);border-color:var(--red-dim);color:var(--red);}\n  .type-btn.sel-dep{background:var(--hapi-bg);border-color:var(--hapi-dim);color:var(--hapi);}\n  .type-btn.sel-ret{background:var(--red-bg);border-color:var(--red-dim);color:var(--red);}\n\n  /* PROGRESS BAR */\n  .prog-wrap{margin-bottom:14px;}\n  .prog-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}\n  .prog-label{font-size:11px;color:var(--text2);width:60px;flex-shrink:0;}\n  .prog-bar-bg{flex:1;height:7px;background:var(--surface2);border-radius:4px;overflow:hidden;}\n  .prog-bar-fill{height:100%;border-radius:4px;transition:width .4s ease;}\n  .prog-val{font-size:11px;font-weight:600;width:70px;text-align:right;flex-shrink:0;}\n\n  /* MES ACTUAL BANNER */\n  .mes-banner{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap;}\n  .mes-banner-item{flex:1;min-width:80px;}\n  .mes-banner-label{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;}\n  .mes-banner-val{font-size:17px;font-weight:700;}\n\n  /* ALERTA */\n  .drop-alert summary::-webkit-details-marker{display:none}\n  @keyframes confCae{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--dx),105vh) rotate(var(--rot))}}\n  @keyframes metaPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}\n  @keyframes metaFuera{to{opacity:0;transform:translate(-50%,-50%) scale(.9)}}\n  @keyframes metaBrillo{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}50%{box-shadow:0 0 18px 2px rgba(34,197,94,.35)}}\n  .meta-card.meta-ok{border-color:var(--green);animation:metaBrillo 2.4s ease-in-out infinite}\n  .drop-alert[open] .drop-chev{transform:rotate(180deg)}\n  @keyframes mmChispa{0%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) scale(.3)}}\n  @keyframes mmFlota{0%{opacity:0;transform:translate(-50%,0) scale(.7)}15%{opacity:1;transform:translate(-50%,-14px) scale(1.08)}75%{opacity:1;transform:translate(-50%,-38px) scale(1)}100%{opacity:0;transform:translate(-50%,-56px) scale(.95)}}\n  @keyframes mmCheckPop{0%{transform:scale(1)}35%{transform:scale(1.45)} fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path d=\"M18 6L6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg>\n      <\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"modal-body\">\n      <div class=\"field\">\n        <label>Nota<\u002Flabel>\n        <textarea id=\"notaTexto\" rows=\"5\" placeholder=\"Escribe aquí...\" style=\"background:var(--bg);border:1px solid var(--border2);color:var(--text);border-radius:var(--radius-sm);padding:8px 10px;font-size:13px;resize:vertical;min-height:100px\"><\u002Ftextarea>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"modal-foot\">\n      <button class=\"btn btn-red\" id=\"notaBtnDelete\" onclick=\"deleteNota()\" style=\"display:none;margin-right:auto\">\n        <svg width=\"13\" height=\"13\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path d=\"M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6\"><\u002Fpath><\u002Fsvg>\n        Eliminar\n      <\u002Fbutton>\n      <button class=\"btn\" onclick=\"closeNotaModal()\">Cancelar<\u002Fbutton>\n      <button class=\"btn\" style=\"background:var(--blue-bg);border-color:var(--blue);color:var(--blue)\" onclick=\"saveNota()\">Guardar<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- MODAL CATEGORÍAS PERSONALIZADAS -->\n<div class=\"modal-bg\" id=\"catModalBg\" onclick=\"if(event.target===this)closeCatModal()\">\n  <div class=\"modal\">\n    <div class=\"modal-head\">\n      <h3>Categorías personalizadas<\u002Fh3>\n      <button class=\"btn\" style=\"width:32px;height:32px;padding:0;justify-content:center\" onclick=\"closeCatModal()\">\n        <svg width=\"15\" height=\"15\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path d=\"M18 6L6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg>\n      <\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"modal-body\">\n      <div style=\"font-size:12px;color:var(--text2);margin-bottom:10px\">Agrega tus propias categorías de egresos.<\u002Fdiv>\n      <div id=\"catTagsList\" style=\"margin-bottom:12px;min-height:32px\"><\u002Fdiv>\n      <div style=\"display:flex;gap:8px\">\n        <input type=\"text\" id=\"catNueva\" placeholder=\"Nueva categoría...\" maxlength=\"30\" style=\"flex:1;background:var(--bg);border:1px solid var(--border2);color:var(--text);border-radius:var(--radius-sm);padding:7px 10px;font-size:13px\" onkeydown=\"if(event.key==='Enter')addCatCustom()\">\n        <button class=\"btn btn-green\" onclick=\"addCatCustom()\">Agregar<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"modal-foot\">\n      <button class=\"btn\" onclick=\"closeCatModal()\">Cerrar<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"toast\" id=\"toast\"><\u002Fdiv>\n\n<script>\nconst MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];\nconst ING_CATS=['Trabajo España','Trabajo La Unión'];\nconst EGR_CATS=['Comidas','Pasajes','Fiestas','Spotify'];\nconst CAT_DOTS={'Trabajo España':'#60a5fa','Trabajo La Unión':'#22c55e','Venta de productos':'#c084fc','Comidas':'#f87171','Pasajes':'#fbbf24','Fiestas':'#fb923c','Spotify':'#1db954','Otros':'#999'};\n\nlet data={years:[],transactions:[],hapi:[],productos:[]};\nlet activeYear=new Date().getFullYear();\nlet editTxId=null;\nlet editInvId=null;\nlet editInvSrc=null;\nlet txType='ingreso';\nlet invType='deposito';\nlet invSrc='hapi';\n\nfunction renderProdChart(){\n  const el=document.getElementById('prodChart'); if(!el) return;\n  const vs=(data.ventasProd||[]).filter(v=>(v.fecha||'').slice(0,4)===String(activeYear));\n  if(!vs.length){ el.innerHTML='<div class=\"empty-tx\" style=\"padding:1.2rem\">Sin ventas registradas en '+activeYear+'.<\u002Fdiv>'; return; }\n  const meses=MESES.map((m,i)=>{\n    const mv=vs.filter(v=>parseInt((v.fecha||'').slice(5,7))-1===i);\n    const tot=mv.reduce((a,v)=>a+(parseFloat(v.total)||0),0);\n    const gan=mv.reduce((a,v)=>a+(v.items||[]).reduce((x,i2)=>x+((parseFloat(i2.precio)||0)-(parseFloat(i2.costo)||0))*i2.qty,0),0);\n    return {m:m.slice(0,3), tot, gan};\n  });\n  const max=Math.max(1,...meses.map(x=>x.tot));\n  const totY=meses.reduce((a,x)=>a+x.tot,0), ganY=meses.reduce((a,x)=>a+x.gan,0);\n  el.innerHTML=\n    '<div class=\"cmp-legend\" style=\"display:flex;gap:14px;font-size:11px;color:var(--text2);margin-bottom:8px\">'+\n      '<span><span style=\"display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--prod);margin-right:5px\"><\u002Fspan>Vendido<\u002Fspan>'+\n      '<span><span style=\"display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--green);margin-right:5px\"><\u002Fspan>Ganancia<\u002Fspan>'+\n    '<\u002Fdiv>'+\n    meses.filter(x=>x.tot>0).map(x=>\n      '<div style=\"display:flex;align-items:center;gap:8px;margin-bottom:7px\">'+\n        '<div style=\"width:34px;font-size:11px;color:var(--text2)\">'+x.m+'<\u002Fdiv>'+\n        '<div style=\"flex:1;display:flex;flex-direction:column;gap:3px\">'+\n          '<div style=\"height:8px;border-radius:4px;background:var(--prod);width:'+(x.tot/max*100).toFixed(1)+'%;min-width:2px\"><\u002Fdiv>'+\n          '<div style=\"height:8px;border-radius:4px;background:var(--green);width:'+(Math.max(0,x.gan)/max*100).toFixed(1)+'%;min-width:2px\"><\u002Fdiv>'+\n        '<\u002Fdiv>'+\n        '<div style=\"width:96px;text-align:right;font-size:11px\"><div style=\"color:var(--prod);font-weight:600\">S/ '+f(x.tot)+'<\u002Fdiv><div style=\"color:var(--green)\">S/ '+f(x.gan)+'<\u002Fdiv><\u002Fdiv>'+\n      '<\u002Fdiv>'\n    ).join('')+\n    '<div style=\"display:flex;justify-content:space-between;margin-top:10px;padding-top:9px;border-top:1px solid var(--border);font-size:12px\">'+\n      '<span style=\"color:var(--text2)\">Total '+activeYear+'<\u002Fspan>'+\n      '<span><b style=\"color:var(--prod)\">S/ '+f(totY)+'<\u002Fb> · ganancia <b style=\"color:var(--green)\">S/ '+f(ganY)+'<\u002Fb><\u002Fspan>'+\n    '<\u002Fdiv>';\n}\n\nfunction renderGrafico(){\n  const txs=data.transactions.filter(t=>getTxYear(t)===activeYear);\n  const canalTx={}; (data.ventasProd||[]).forEach(v=>{ if(v&&v.txId) canalTx[v.txId]=v.canal==='online'?'online':'tienda'; });\n  try{ ventasList().forEach(v=>{ if(v&&v.txId) canalTx[v.txId]=v.canal==='online'?'online':'tienda'; }); }catch(e){}\n  const pal=['#60a5fa','#22c55e','#c084fc','#e879f9','#f472b6','#2dd4bf','#a3e635','#38bdf8','#facc15','#fb7185','#818cf8','#34d399'];\n  const colorDe=(cat,i)=>CAT_DOTS[cat]||pal[i%pal.length];\n  const ing={}, egr={};\n  txs.forEach(t=>{\n    const m=parseFloat(t.monto)||0; if(m<=0) return;\n    if(t.tipo==='ingreso'){\n      if(t.vaAHapi) return;\n      let c=t.cat||'Otros';\n      if(c==='Venta de productos') c=canalTx[t.id]==='online'?'Venta online':'Venta tienda';\n      ing[c]=(ing[c]||0)+m;\n    } else if(t.tipo==='egreso'){\n      const c=t.cat||'Otros'; egr[c]=(egr[c]||0)+m;\n    }\n  });\n  const toSlices=(o,fix)=>Object.keys(o).map((c,i)=>({label:c==='Otros'&&o===egr?'Otros egresos':c,val:o[c],color:fix[c]||colorDe(c,i)})).sort((x,y)=>y.val-x.val);\n  const sIng=toSlices(ing,{'Venta tienda':'#c084fc','Venta online':'#e879f9'});\n  const sEgr=toSlices(egr,{});\n  const tIng=sIng.reduce((a,s)=>a+s.val,0), tEgr=sEgr.reduce((a,s)=>a+s.val,0), saldo=tIng-tEgr;\n  document.getElementById('grafYear').textContent=activeYear;\n  const set=(id,v)=>{const e=document.getElementById(id); if(e) e.textContent=v;};\n  set('grafIngTot','S/ '+f(tIng)); set('grafEgrTot','S/ '+f(tEgr));\n  const se=document.getElementById('grafSaldoTot'); if(se){ se.textContent=(saldo<0?'- ':'')+'S/ '+f(Math.abs(saldo)); se.style.color=saldo<0?'var(--red)':'var(--green)'; }\n  drawDonut('Ing',sIng,tIng,'Sin ingresos este año');\n  drawDonut('Egr',sEgr,tEgr,'Sin gastos este año');\n}\nfunction drawDonut(k,slices,total,vacio){\n  const canvas=document.getElementById('donut'+k); if(!canvas) return;\n  const lab=document.getElementById('donut'+k+'Label'), val=document.getElementById('donut'+k+'Value');\n  const reset=()=>{ lab.textContent='Total'; val.textContent='S/ '+f(total); };\n  reset();\n  const ctx=canvas.getContext('2d'); const W=220,H=220,cx=W/2,cy=H/2,R=96,r=56;\n  ctx.clearRect(0,0,W,H);\n  const leg=document.getElementById('donut'+k+'Legend');\n  if(!slices.length){\n    ctx.fillStyle='#333'; ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.arc(cx,cy,r,0,Math.PI*2,true); ctx.fill();\n    if(leg) leg.innerHTML='<div class=\"empty-tx\">'+vacio+'<\u002Fdiv>';\n    canvas.onmousemove=canvas.onmouseleave=null; return;\n  }\n  const gap=slices.length>1?0.018:0;\n  let ang=-Math.PI/2;\n  slices.forEach(s=>{ const sw=(s.val/total)*Math.PI*2-gap; ctx.beginPath(); ctx.arc(cx,cy,R,ang,ang+sw); ctx.arc(cx,cy,r,ang+sw,ang,true); ctx.closePath(); ctx.fillStyle=s.color; ctx.fill(); ang+=sw+gap; });\n  const pick=e=>{\n    const rc=canvas.getBoundingClientRect(); const pt=e.touches?e.touches[0]:e;\n    const mx=pt.clientX-rc.left-cx, my=pt.clientY-rc.top-cy, d=Math.hypot(mx,my);\n    if(d<r||d>R){ reset(); return; }\n    let a=Math.atan2(my,mx)+Math.PI/2; if(a<0) a+=Math.PI*2;\n    let acc=0; for(const s of slices){ const sw=(s.val/total)*Math.PI*2; if(a<=acc+sw){ lab.textContent=s.label; val.textContent='S/ '+f(s.val); return; } acc+=sw; }\n    reset();\n  };\n  canvas.onmousemove=pick; canvas.ontouchstart=pick; canvas.onmouseleave=reset;\n  if(leg) leg.innerHTML=slices.map(s=>{\n    const pct=((s.val/total)*100).toFixed(1);\n    return '<div style=\"display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 12px\"><div style=\"width:12px;height:12px;border-radius:3px;background:'+s.color+';flex-shrink:0\"><\u002Fdiv><span style=\"flex:1;font-size:13px;color:var(--text)\">'+escH(s.label)+'<\u002Fspan><span style=\"font-size:12px;color:var(--text2)\">'+pct+'%<\u002Fspan><span style=\"font-size:13px;font-weight:700;color:'+s.color+'\">S/ '+f(s.val)+'<\u002Fspan><\u002Fdiv>';\n  }).join('');\n}\n\nfunction getTc(){\n  const v=parseFloat(document.getElementById('tcInput')&&document.getElementById('tcInput').value)||3.70;\n  return v;\n}\nfunction saveTc(){\n  const v=getTc();\n  localStorage.setItem('fin_tc',v);\n  updateUsdPreview();\n  \n  renderAll();\n}\nfunction loadTc(){\n  const saved=localStorage.getItem('fin_tc');\n  const el=document.getElementById('tcInput');\n  if(el&&saved) el.value=parseFloat(saved);\n  tcFuenteLabel();\n}\nfunction tcFuenteLabel(){\n  const el=document.getElementById('tcFuente'); if(!el) return;\n  const d=localStorage.getItem('fin_tc_fecha');\n  el.textContent=d?'del '+new Date(d+'T12:00:00').toLocaleDateString('es-PE',{day:'numeric',month:'short'}):'';\n}\nasync function fetchTcHoy(manual){\n  const hoy=new Date().toISOString().slice(0,10);\n  if(!manual && localStorage.getItem('fin_tc_fecha')===hoy) return;\n  try{\n    const r=await fetch('https://open.er-api.com/v6/latest/USD');\n    const j=await r.json();\n    const v=j&&j.rates&&j.rates.PEN;\n    if(!v) throw new Error();\n    document.getElementById('tcInput').value=v.toFixed(3);\n    localStorage.setItem('fin_tc_fecha',hoy);\n    saveTc(); tcFuenteLabel();\n    if(manual) toast('Dólar hoy: S/ '+v.toFixed(3),'ok');\n  }catch(e){ if(manual) toast('No se pudo traer la cotización (sin internet?)','err'); }\n}\nfunction onCatChange(){\n  const cat=document.getElementById('txCat').value;\n  const isUsd=cat==='Trabajo España';\n  const label=document.getElementById('txMontoLabel');\n  const preview=document.getElementById('usdPreview');\n  if(label) label.textContent=isUsd?'Monto (USD) *':'Monto (S/) *';\n  if(preview) preview.style.display=isUsd?'block':'none';\n  // Show \"va a Hapi\" checkbox only for España ingreso\n  const hapiWrap=document.getElementById('txVaAHapiWrap');\n  const puedeHapi=(cat==='Trabajo España'||cat==='Trabajo La Unión')&&txType==='ingreso';\n  if(hapiWrap) hapiWrap.style.display=puedeHapi?'flex':'none';\n  if(!puedeHapi){ const c=document.getElementById('txVaAHapi'); if(c) c.checked=false; }\n  onVaAHapiChange();\n  updateUsdPreview();\n}\nfunction onRecurrenteChange(){\n  const checked=document.getElementById('txRecurrente').checked;\n  if(checked && txType==='egreso'){\n    const cat=document.getElementById('txCat');\n    if(cat) cat.value='Spotify';\n    onCatChange();\n  }\n}\nfunction updateUsdPreview(){\n  const cat=document.getElementById('txCat')?document.getElementById('txCat').value:'';\n  const preview=document.getElementById('usdPreview');\n  if(!preview) return;\n  if(cat!=='Trabajo España'){preview.style.display='none';return;}\n  const usd=parseFloat(document.getElementById('txMonto').value)||0;\n  const soles=usd*getTc();\n  preview.style.display='block';\n  preview.textContent=usd>0?'= S/ '+f(soles)+' (al tipo de cambio actual)':'Ingresa el monto en USD';\n}\ndocument.addEventListener('input',e=>{ if(e.target&&e.target.id==='txMonto'&&typeof updateHapiPreview==='function') updateHapiPreview(); });\n\nfunction getCapitalInicialYear(year){\n  // Multi-year: use capitalesIniciales object; fallback to legacy data.capitalInicial for first year\n  if(!data.capitalesIniciales) data.capitalesIniciales={};\n  const firstYear=Math.min(...data.years);\n  if(year===firstYear){\n    // First year: use stored value or legacy capitalInicial\n    return data.capitalesIniciales[year]!=null ? data.capitalesIniciales[year] : (data.capitalInicial||0);\n  }\n  // Subsequent years: auto-calculate from previous year\n  const prevYear=year-1;\n  if(!data.years.includes(prevYear)){\n    // If prev year not in list, use stored value or 0\n    return data.capitalesIniciales[year]||0;\n  }\n  const prevCap=getCapitalInicialYear(prevYear);\n  const prevTxs=data.transactions.filter(t=>getTxYear(t)===prevYear);\n  const prevIng=prevTxs.filter(t=>t.tipo==='ingreso'&&!t.vaAHapi).reduce((a,t)=>a+t.monto,0);\n  const prevEgr=prevTxs.filter(t=>t.tipo==='egreso').reduce((a,t)=>a+t.monto,0);\n  return parseFloat((prevCap+(prevIng-prevEgr)).toFixed(2));\n}\nfunction saveCapitalInicial(){\n  if(!data.capitalesIniciales) data.capitalesIniciales={};\n  const firstYear=Math.min(...data.years);\n  if(activeYear!==firstYear) return; // only editable for first year\n  const v=parseFloat(document.getElementById('capitalInicialInput').value)||0;\n  data.capitalesIniciales[activeYear]=v;\n  data.capitalInicial=v; // keep legacy in sync\n  saveData();\n  renderResumen();\n}\nfunction loadCapitalInicial(){\n  const el=document.getElementById('capitalInicialInput');\n  const hint=document.getElementById('capitalInicialHint');\n  if(!el) return;\n  const firstYear=Math.min(...data.years);\n  const val=getCapitalInicialYear(activeYear);\n  el.value=val>0?val:'';\n  if(activeYear===firstYear){\n    el.readOnly=false;\n    el.style.opacity='';\n    el.style.cursor='';\n    if(hint) hint.textContent='Con cuánto empezaste este año';\n  } else {\n    el.readOnly=true;\n    el.style.opacity='0.7';\n    el.style.cursor='not-allowed';\n    const prevYear=activeYear-1;\n    if(hint) hint.textContent=`Calculado automáticamente del ${prevYear}`;\n  }\n}\nfunction getCapitalHapiYear(year){\n  // For the first year: use stored capitalHapiUsd (manually entered)\n  // For subsequent years: use \"monto actual\" of the last recorded month of prevYear\n  // monto actual = balance inicio de mes + depositos/retiros netos de ese mes\n  const firstYear=Math.min(...data.years);\n  if(year===firstYear){\n    return data.capitalHapiUsd||data.capitalHapi||0;\n  }\n  const prevYear=year-1;\n  const balances=data.hapiBalances||{};\n  // Build depsByMonth for prevYear (net USD movements)\n  const depsByMonth={};\n  (data.hapi||[]).forEach(m=>{\n    if(!m.fecha) return;\n    const ym=m.fecha.slice(0,7);\n    if(parseInt(m.fecha.slice(0,4))!==prevYear) return;\n    const val=(m.montoUsd||0)*(m.tipo==='deposito'?1:-1);\n    depsByMonth[ym]=(depsByMonth[ym]||0)+val;\n  });\n  // Find the last month of prevYear that has a balance inicio recorded\n  for(let mo=12;mo>=1;mo--){\n    const ym=prevYear+'-'+String(mo).padStart(2,'0');\n    if(balances[ym]!=null){\n      const montoActual=balances[ym]+(depsByMonth[ym]||0);\n      return parseFloat(montoActual.toFixed(2));\n    }\n  }\n  // Fallback\n  return data.capitalHapiUsd||data.capitalHapi||0;\n}\n\nfunction loadData(){\n  try{\n    const d=localStorage.getItem('fin_personal_v1');\n    if(d){\n      const parsed=JSON.parse(d);\n      // Validate structure — if corrupted, reset\n      if(parsed && typeof parsed==='object'){\n        data=parsed;\n      }\n    }\n  }catch(e){data={years:[],transactions:[],hapi:[],productos:[]};}\n  if(!data.years||!Array.isArray(data.years)||!data.years.length)data.years=[new Date().getFullYear()];\n  if(!Array.isArray(data.transactions))data.transactions=[];\n  if(!Array.isArray(data.hapi))data.hapi=[];\n  if(!Array.isArray(data.productos))data.productos=[];\n  if(!Array.isArray(data.catalogo))data.catalogo=[];\n  if(!Array.isArray(data.ventasProd))data.ventasProd=[];\n  data.catalogo=data.catalogo.map(p=>({...p,costo:parseFloat(p.costo)||0}));\n  if(!Array.isArray(data.ingCatsCustom))data.ingCatsCustom=[];\n  if(!Array.isArray(data.vouchers))data.vouchers=[];\n  data.vouchers=data.vouchers.filter(v=>v&&v.img);\n  data.vouchers.forEach(v=>{ if(!v.moneda) v.moneda='PEN'; if(typeof v.cat!=='string') v.cat=''; if(!v.tipo) v.tipo=(typeof v.img==='string'&&v.img.startsWith('data:application/pdf'))?'pdf':'img'; });\n  if(!Array.isArray(data.vchCats)) data.vchCats=[];\n  if(!Array.isArray(data.proveedores)||!data.proveedores.length)data.proveedores=['Sumbex','Temu','Ala','Roma','Red Car'];\n  data.proveedores=[...new Set(data.proveedores.filter(p=>typeof p==='string'&&p.trim()).map(p=>p.trim()))];\n  if(!Array.isArray(data.hapiSnaps))data.hapiSnaps=[];\n  if(!data.hapiBalances||typeof data.hapiBalances!=='object')data.hapiBalances={};\n  if(typeof data.metaAhorro!=='number')data.metaAhorro=0;\n  if(!data.metasMes||typeof data.metasMes!=='object'||Array.isArray(data.metasMes))data.metasMes={};\n  if(typeof data.capitalInicial !== 'number') data.capitalInicial = 0;\n  if(typeof data.capitalHapi !== 'number') data.capitalHapi = 0;\n  if(!data.capitalesIniciales||typeof data.capitalesIniciales!=='object') data.capitalesIniciales={};\n  // Migrate legacy capitalInicial to per-year if not done yet\n  const firstYear=Math.min(...data.years);\n  if(data.capitalInicial>0 && data.capitalesIniciales[firstYear]==null){\n    data.capitalesIniciales[firstYear]=data.capitalInicial;\n  }\n  if(!Array.isArray(data.notas))data.notas=[];\n  if(!Array.isArray(data.catsCustom))data.catsCustom=[];\n  // Sanitize: remove nulls but keep valid entries, normalize monto to number\n  data.hapi=data.hapi.filter(m=>m&&typeof m==='object'&&m.id).map(m=>({...m,monto:parseFloat(m.monto)||0}));\n  data.productos=data.productos.filter(m=>m&&typeof m==='object'&&m.id).map(m=>({...m,monto:parseFloat(m.monto)||0}));\n  data.transactions=data.transactions.filter(m=>m&&typeof m==='object'&&m.id).map(m=>({...m,monto:parseFloat(m.monto)||0}));\n  activeYear=data.years[data.years.length-1];\n  buildYearSel();updateLastBackupLabel();loadTc();loadCapitalInicial();loadMeta();updateEgrCats();updateIngCatsFilter();renderAll();\n}\nfunction saveData(){\n  data._ts=Date.now();\n  try{ localStorage.setItem('fin_personal_v1',JSON.stringify(data)); updateStorageLabel(); }\n  catch(e){ toast('Sin espacio para guardar — exporta un respaldo y borra fotos que no uses','err'); }\n  scheduleCloudPush();\n}\n// ── SINCRONIZACIÓN GOOGLE SHEETS ─────────────────────────────────────────────\nlet _cloudTimer=null, _cloudBusy=false;\nfunction cloudUrl(){ return (localStorage.getItem('fin_cloud_url')||'').trim(); }\nfunction cloudStatus(t,c){ const el=document.getElementById('cloudStatus'); if(el){ el.textContent=t; el.style.color=c||'var(--text3)'; } }\nfunction setCloudUrl(v){\n  v=(v||'').trim();\n  if(v && !/^https:\\/\\/script\\.google\\.com\\/.+\\/exec/.test(v)){ toast('La URL debe terminar en /exec','err'); return; }\n  if(v!==cloudUrl()) localStorage.removeItem('fin_cloud_synced');\n  localStorage.setItem('fin_cloud_url',v);\n  if(v){ cloudStatus('Conectando…'); cloudPull(false,true); } else cloudStatus('Sin conectar');\n}\nfunction scheduleCloudPush(){\n  if(!cloudUrl()||!localStorage.getItem('fin_cloud_synced')) return;\n  clearTimeout(_cloudTimer);\n  cloudStatus('Cambios sin subir…','var(--yellow)');\n  _cloudTimer=setTimeout(()=>{ _cloudTimer=null; cloudPush(false); },2000);\n}\nasync function cloudPush(manual){\n  const url=cloudUrl(); if(!url){ if(manual) toast('Primero pega la URL del Apps Script','err'); return; }\n  if(_cloudBusy){ scheduleCloudPush(); return; }\n  _cloudBusy=true; cloudStatus('Subiendo…');\n  if(!data._ts) data._ts=Date.now();\n  // Si la hoja cambió desde otro dispositivo, unir antes de subir para no borrar nada\n  try{\n    const base=+localStorage.getItem('fin_cloud_base')||0;\n    const g=await fetch(url+(url.includes('?')?'&':'?')+'action=get&t='+Date.now());\n    const gj=await g.json(); const rem=gj&&gj.ok&&gj.data;\n    if(rem && (rem._ts||0)>base && (rem._ts||0)!==data._ts){\n      data=mergeData(data,rem); data._ts=Date.now();\n      localStorage.setItem('fin_personal_v1',JSON.stringify(data));\n      loadData(); try{ aplicarFijosAuto(); }catch(e){} if(typeof renderReponer==='function') renderReponer(); if(typeof renderAcciones==='function') renderAcciones();\n    }\n  }catch(e){}\n  try{\n    const body=JSON.stringify({action:'save',data});\n    let j;\n    try{\n      const r=await fetch(url,{method:'POST',redirect:'follow',body});\n      const txt=await r.text();\n      try{ j=JSON.parse(txt); }catch(_){ throw new Error(/<html/i.test(txt)?'Google pidió iniciar sesión: el acceso debe ser \"Cualquier persona\"':'Respuesta inválida ('+r.status+')'); }\n    }catch(e){\n      if(!(e instanceof TypeError)) throw e;\n      // Plan B: enviar sin leer la respuesta y confirmar leyendo la hoja\n      await fetch(url,{method:'POST',mode:'no-cors',body});\n      const g=await fetch(url+(url.includes('?')?'&':'?')+'action=get&t='+Date.now());\n      const gj=await g.json();\n      if(!gj.ok||!gj.data||gj.data._ts!==data._ts) throw new Error('la hoja no recibió los datos');\n      j={ok:true};\n    }\n    if(!j.ok) throw new Error(j.error||'Error');\n    localStorage.setItem('fin_cloud_last',new Date().toLocaleString('es-PE'));\n    localStorage.setItem('fin_cloud_synced','1');\n    localStorage.setItem('fin_cloud_base',String(data._ts));\n    cloudStatus('Guardado en la hoja · '+new Date().toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'}),'var(--green)');\n    if(manual) toast('Datos subidos a Google Sheets','ok');\n  }catch(e){ console.error('cloudPush',e); cloudStatus('No se pudo subir: '+(e.message||e),'var(--red)'); if(manual) toast('No se pudo subir: '+(e.message||e),'err'); }\n  _cloudBusy=false;\n}\nasync function cloudPull(manual,first){\n  const url=cloudUrl(); if(!url){ if(manual) toast('Primero pega la URL del Apps Script','err'); return; }\n  cloudStatus('Revisando la hoja…');\n  try{\n    const r=await fetch(url+(url.includes('?')?'&':'?')+'action=get&t='+Date.now());\n    const j=await r.json();\n    if(!j.ok) throw new Error(j.error||'Error');\n    const remote=j.data;\n    if(!remote){ cloudStatus('Hoja vacía — subiendo tus datos…'); await cloudPush(manual); return; }\n    const lt=data._ts||0, rt=remote._ts||0;\n    const synced=!!localStorage.getItem('fin_cloud_synced');\n    if(!synced && !manual){\n      // Primera conexión de este dispositivo: siempre se trae lo de la hoja\n    } else if(manual){\n      if(!confirm('¿Reemplazar los datos de este dispositivo por los de la hoja?')) { cloudStatus(''); return; }\n    } else if(rt<=lt){\n      if(rt<lt) await cloudPush(false); else { localStorage.setItem('fin_cloud_base',String(rt)); cloudStatus('Al día con la hoja','var(--green)'); }\n      return;\n    }\n    localStorage.setItem('fin_personal_v1',JSON.stringify(remote));\n    localStorage.setItem('fin_cloud_synced','1');\n    localStorage.setItem('fin_cloud_base',String(remote._ts||0));\n    loadData(); if(typeof renderReponer==='function') renderReponer(); if(typeof renderAcciones==='function') renderAcciones();\n    cloudStatus('Datos traídos de la hoja','var(--green)');\n    toast(first?'Conectado — datos cargados desde Google Sheets':'Datos actualizados desde la hoja','ok');\n  }catch(e){ cloudStatus('No se pudo conectar con la hoja','var(--red)'); if(manual||first) toast('No se pudo conectar. Revisa la URL y que el acceso sea \"Cualquier persona\"','err'); }\n}\nfunction mergeData(loc,rem){\n  const out={...rem,...loc};\n  Object.keys(rem).forEach(k=>{\n    const a=loc[k], b=rem[k];\n    if(Array.isArray(a)&&Array.isArray(b)){\n      if(a.concat(b).every(x=>x&&typeof x==='object'&&x.id!=null)){\n        const ids=new Set(a.map(x=>x.id));\n        out[k]=a.concat(b.filter(x=>!ids.has(x.id)));\n      } else if(a.concat(b).every(x=>typeof x!=='object')) out[k]=[...new Set(a.concat(b))];\n    } else if(a&&b&&typeof a==='object'&&typeof b==='object'&&!Array.isArray(a)&&!Array.isArray(b)) out[k]={...b,...a};\n  });\n  const del=new Set([...(Array.isArray(loc.borrados)?loc.borrados:[]),...(Array.isArray(rem.borrados)?rem.borrados:[])]);\n  if(del.size){\n    out.borrados=[...del];\n    Object.keys(out).forEach(k=>{ if(k!=='borrados'&&Array.isArray(out[k])) out[k]=out[k].filter(x=>!(x&&typeof x==='object'&&x.id!=null&&del.has(String(x.id)))); });\n  }\n  return out;\n}\ndocument.addEventListener('visibilitychange',()=>{\n  if(document.visibilityState==='visible' && cloudUrl() && !_cloudTimer && !_cloudBusy) cloudPull(false);\n});\nfunction initCloud(){\n  const u=cloudUrl(), el=document.getElementById('cloudUrl');\n  if(el) el.value=u;\n  if(u) cloudPull(false); else cloudStatus('Sin conectar');\n}\n\nfunction buildYearSel(){\n  const s=document.getElementById('yearSel');\n  s.innerHTML=data.years.map(y=>`<option value=\"${y}\"${y===activeYear?' selected':''}>${y}<\u002Foption>`).join('');\n}\nfunction changeYear(){activeYear=parseInt(document.getElementById('yearSel').value);loadCapitalInicial();renderAll();}\nfunction addYear(){\n  const ny=Math.max(...data.years)+1;\n  data.years.push(ny);activeYear=ny;\n  saveData();buildYearSel();document.getElementById('yearSel').value=ny;\n  loadCapitalInicial();\n  renderAll();toast('Año '+ny+' agregado — capital inicial calculado automáticamente','ok');\n}\n\nfunction switchTab(tab){\n  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',['resumen','ingresos','egresos','hapi','productos','grafico','notas'][i]===tab));\n  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));\n  document.getElementById('sec-'+tab).classList.add('active');\n  if(tab==='ingresos'){updateIngCatsFilter();}\n  if(tab==='ingresos'||tab==='egresos'){renderTx();if(tab==='egresos')renderGastosFijos();}\n  if(tab==='hapi'){renderAcciones();fetchPrecios(false);buildMonthFilters();renderInvSection('hapi');renderHapiRent();buildVchMesFilter();renderVchFolders();renderVouchers();}\n  if(tab==='productos'){renderReponer();buildMonthFilters();renderProductosSection();renderCatalogo();buildVentaMesFilter();renderVentasProd();}\n  if(tab==='grafico'){renderGrafico();renderProdChart();setTimeout(renderPortChart,50);}\n  if(tab==='notas')renderNotas();\n}\n\nfunction renderAll(){\n  renderResumen();renderTx();renderInv();renderHapiRent();\n  renderMesBanner();renderProgreso();renderMeta();try{renderMetasMes();}catch(e){}checkAlerta();renderGastosFijos();\n  renderRacha();renderBarrasMensuales();\n  if(document.getElementById('sec-grafico')&&document.getElementById('sec-grafico').classList.contains('active'))renderGrafico();\n}\n\n// ── META DE AHORRO ─────────────────────────────────────────────────────────────\nfunction saveMeta(){\n  const v=parseFloat(document.getElementById('metaInput').value)||0;\n  data.metaAhorro=v; saveData(); renderMeta();\n}\nfunction loadMeta(){\n  const el=document.getElementById('metaInput');\n  if(el&&data.metaAhorro>0) el.value=data.metaAhorro;\n}\nfunction renderMeta(){\n  const meta=data.metaAhorro||0;\n  const ahorrado=balanceReal();\n  const pct=meta>0?Math.min(100,(ahorrado/meta)*100):0;\n  const fill=document.getElementById('metaBarFill');\n  const actual=document.getElementById('metaActual');\n  const pctEl=document.getElementById('metaPct');\n  if(fill){ fill.style.transition='width .6s ease'; fill.style.width=Math.max(0,pct)+'%'; }\n  if(fill) fill.style.background=pct>=100?'var(--green)':pct>60?'var(--yellow)':'var(--green)';\n  if(actual) actual.textContent='S/ '+f(ahorrado)+' · balance real';\n  if(pctEl) pctEl.textContent=meta>0?(pct>=100?'¡Meta cumplida! 🎉':pct.toFixed(1)+'%'):'—';\n  const card=fill&&fill.closest('.meta-card');\n  const ok=meta>0&&pct>=100;\n  if(card){ card.classList.toggle('meta-ok',ok); card.style.cursor=ok?'pointer':''; card.title=ok?'Toca para celebrar otra vez':''; card.onclick=ok?(e=>{ if(e.target.closest('input,button,select')) return; celebrarMeta(meta); }):null; }\n  if(!data.metaCelebrada) data.metaCelebrada={};\n  const key=activeYear+':'+meta;\n  if(ok&&data.metaCelebrada[activeYear]!==key){ data.metaCelebrada[activeYear]=key; saveData(); celebrarMeta(meta); }\n  else if(!ok&&data.metaCelebrada[activeYear]){ delete data.metaCelebrada[activeYear]; saveData(); }\n}\nfunction celebrarMeta(meta){\n  if(window._celebrando) return; window._celebrando=true; setTimeout(()=>{ window._celebrando=false; },4500);\n  const cols=['#22c55e','#fbbf24','#60a5fa','#f472b6','#c084fc','#34d399'];\n  const wrap=document.createElement('div');\n  wrap.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden';\n  for(let i=0;i<120;i++){\n    const p=document.createElement('i'); const sz=6+Math.random()*7;\n    p.style.cssText='position:absolute;top:-20px;left:'+(Math.random()*100)+'%;width:'+sz+'px;height:'+(sz*0.45)+'px;background:'+cols[i%cols.length]+';border-radius:2px;opacity:.95;animation:confCae '+(2.2+Math.random()*1.8)+'s cubic-bezier(.25,.6,.4,1) '+(Math.random()*0.6)+'s forwards;--dx:'+((Math.random()-0.5)*160)+'px;--rot:'+(360+Math.random()*720)+'deg';\n    wrap.appendChild(p);\n  }\n  const msg=document.createElement('div');\n  msg.style.cssText='position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);background:var(--surface);border:1px solid var(--green);border-radius:16px;padding:20px 26px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.5);animation:metaPop .5s cubic-bezier(.2,1.4,.4,1) both, metaFuera .4s ease 3.6s forwards;max-width:86vw';\n  msg.innerHTML='<div style=\"font-size:40px;line-height:1\">🏆<\u002Fdiv><div style=\"font-size:18px;font-weight:800;color:var(--green);margin-top:8px\">¡Meta de ahorro cumplida!<\u002Fdiv><div style=\"font-size:13px;color:var(--text2);margin-top:4px\">Llegaste a S/ '+f(meta)+' en '+activeYear+'<\u002Fdiv>';\n  wrap.appendChild(msg);\n  document.body.appendChild(wrap);\n  if(navigator.vibrate) try{navigator.vibrate([80,60,120]);}catch(e){}\n  setTimeout(()=>wrap.remove(),4400);\n}\n\n// ── METAS DEL MES ─────────────────────────────────────────────────────────────\nlet mmOff=0;\nconst MM_FRASES=['¡Una menos! 💪','¡Bien hecho!','¡Sigue así! 🔥','¡Imparable!','¡Vas con todo! 🚀','¡Eso es! ⭐','¡Crack! 👏'];\nfunction mmFecha(){ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()+mmOff); return d; }\nfunction mmKey(){ const d=mmFecha(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }\nfunction mmGet(){ if(!data.metasMes||typeof data.metasMes!=='object') data.metasMes={}; return data.metasMes[mmKey()]||[]; }\nfunction mmSet(list){ const k=mmKey(); if(list.length) data.metasMes[k]=list; else delete data.metasMes[k]; saveData(); }\nfunction mmNav(n){ mmOff+=n; renderMetas );\n  mmSet(list); inp.value=''; renderMetasMes();\n}\nfunction mmBorrar(id){\n  const list=mmGet(); const m=list.find(x=>x.id===id); if(!m) return;\n  if(!confirm('¿Eliminar la meta \"'+m.t+'\"?')) return;\n  mmSet(list.filter(x=>x.id!==id)); renderMetasMes();\n}\nfunction mmToggle(id,btn){\n  const list=mmGet().map(x=>({...x})); const m=list.find(x=>x.id===id); if(!m) return;\n  m.ok=!m.ok; m.okAt=m.ok?Date.now():null;\n  const r=btn&&btn.getBoundingClientRect();\n  mmSet(list); renderMetasMes();\n  if(!m.ok) return;\n  const nb=document.querySelector('.mm-row[data-id=\"'+id+'\"] .mm-check');\n  if(nb) nb.style.animation='mmCheckPop .5s cubic-bezier(.2,1.4,.4,1)';\n  const all=list.every(x=>x.ok);\n  if(r) mmChispas(r.left+r.width/2,r.top+r.height/2,all?'':MM_FRASES[Math.floor(Math.random()*MM_FRASES.length)]);\n  if(navigator.vibrate) try{navigator.vibrate(30);}catch(e){}\n  if(all) setTimeout(()=>mmCelebrarTodas(list.length),450);\n}\nfunction mmChispas(x,y,frase){\n  const cols=['#22c55e','#fbbf24','#60a5fa','#f472b6','#c084fc','#34d399'];\n  const w=document.createElement('div'); w.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:9998';\n  const o=document.createElement('i'); o.style.cssText='position:absolute;left:'+x+'px;top:'+y+'px;width:30px;height:30px;border-radius:50%;border:2px solid var(--green);animation:mmOnda .6s ease-out forwards'; w.appendChild(o);\n  for(let i=0;i<18;i++){ const a=(i/18)*Math.PI*2+Math.random()*.3, dist=34+Math.random()*30, s=4+Math.random()*4;\n    const p=document.createElement('i'); p.style.cssText='position:absolute;left:'+x+'px;top:'+y+'px;width:'+s+'px;height:'+s+'px;border-radius:'+(i%2?'50%':'2px')+';background:'+cols[i%cols.length]+';--tx:'+(Math.cos(a)*dist)+'px;--ty:'+(Math.sin(a)*dist)+'px;animation:mmChispa '+(.55+Math.random()*.3)+'s cubic-bezier(.1,.8,.3,1) forwards';\n    w.appendChild(p); }\n  if(frase){ const tx=document.createElement('div'); const cx=Math.min(Math.max(x+60,80),innerWidth-80);\ brate([80,60,120]);}catch(e){}\n  setTimeout(()=>wrap.remove(),4400);\n}\n\nfunction stockMin(){ return typeof data.stockMin==='number'?data.stockMin:3; }\nfunction setStockMin(v){ const n=Math.max(0,parseInt(v)||0); data.stockMin=n; saveData(); renderStockResumen(); try{renderCatalogo();}catch(e){} }\nfunction renderStockResumen(){\n  const el=document.getElementById('stockResumen'); if(!el) return;\n  const list=data.catalogo||[], mn=stockMin();\n  const items=[];\n  list.forEach(p=>{\n    if(Array.isArray(p.colores)&&p.colores.length){\n      p.colores.forEach(c=>{ const s=parseInt(c.stock)||0; if(s<=mn) items.push({n:p.nombre+' · '+c.color,s}); });\n    } else { const s=parseInt(p.stock)||0; if(s<=mn) items.push({n:p.nombre,s}); }\n  });\n  if(!items.length){ el.innerHTML=''; return; }\n  items.sort((a,b)=>a.s-b.s);\n  const sin=items.filter(i=>i.s===0).length;\n  el.innerHTML=dropAlert('resumen',sin?'red':'yellow','Hay que comprar: '+items.length+' producto'+(items.length>1?'s':'')+(sin?' · '+sin+' sin stock':''),\n    '<label style=\"font-size:11px;color:var(--text2);display:flex;align-items:center;gap:5px;margin-bottom:8px\">Avisar con ≤ <input type=\"number\" min=\"0\" step=\"1\" value=\"'+mn+'\" onchange=\"setStockMin(this.value)\" style=\"width:52px;padding:3px 6px;font-size:12px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px\"> und.<\u002Flabel>'+\n    '<div style=\"display:flex;flex-wrap:wrap;gap:5px\">'+items.map(i=>'<span style=\"font-size:11px;padding:3px 8px;border-radius:12px;background:var(--surface);border:1px solid var(--border);color:'+(i.s===0?'var(--red)':'var(--text)')+'\">'+escH(i.n)+' <b>'+(i.s===0?'sin stock':i.s)+'<\u002Fb><\u002Fspan>').join('')+'<\u002Fdiv>');\n}\n\nwindow.__dropOpen=window.__dropOpen||{};\nfunction dropAlert(key,tone,title,body){\n  const c=tone==='red'?{bg:'var(--red-bg)',bd:'var(--red-dim)',tx:'var(--red)'}:{bg:'var(--yellow-bg)',bd:'var(--yellow-dim)',tx:'var(--yellow)'};\n
