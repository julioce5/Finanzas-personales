--text3)\">'+fmt(s[k].d)+'<\u002Fspan>';\n    tip.style.left=Math.min(Math.max(0,a-tip.offsetWidth/2),W-tip.offsetWidth)+'px';\n  };\n  const out=()=>{ x.putImageData(snap,0,0); tip.style.display='none'; };\n  cv.onmousemove=move; cv.ontouchstart=move; cv.ontouchmove=e=>{e.preventDefault();move(e);}; cv.onmouseleave=out; cv.ontouchend=out;\n}\nwindow.addEventListener('resize',()=>{ const s=document.getElementById('sec-grafico'); if(s&&s.classList.contains('active')) renderPortChart(); });\n// ── GASTOS FIJOS AUTOMÁTICOS ────────────────────────────────────────────────────\nfunction aplicarFijosAuto(){\n  if(!Array.isArray(data.fijosAuto)){\n    data.fijosAuto=[{id:'spotify',desc:'Spotify',cat:'Spotify',monto:11.90,dia:10,desde:new Date().toISOString().slice(0,7)}];\n  }\n  const hoy=new Date(); let n=0;\n  const borr=new Set(Array.isArray(data.borrados)?data.borrados:[]);\n  data.fijosAuto.forEach(fx=>{\n    if(borr.has('fijooff_'+fx.id)) return;\n    let [y,m]=fx.desde.split('-').map(Number);\n    while(y<hoy.getFullYear()||(y===hoy.getFullYear()&&m<=hoy.getMonth()+1)){\n      const ym=y+'-'+String(m).padStart(2,'0');\n      const venc=new Date(y,m-1,fx.dia);\n      if(venc<=hoy){\n        const id='fijo_'+fx.id+'_'+ym;\n        const ya=borr.has(id)||borr.has('fijoskip_'+fx.id+'_'+ym)||data.transactions.some(t=>t.id===id||(t.tipo==='egreso'&&t.cat===fx.cat&&String(t.fecha||'').slice(0,7)===ym));\n        if(!ya){\n          if(!data.years.includes(y)){ data.years.push(y); data.years.sort(); }\n          data.transactions.push({id,tipo:'egreso',desc:fx.desc,monto:fx.monto,fecha:ym+'-'+String(fx.dia).padStart(2,'0'),cat:fx.cat,nota:'Automático cada día '+fx.dia,montoOrig:null,montoOrigCur:null,recurrente:true,vaAHapi:false});\n          n++;\n        }\n      }\n      m++; if(m>12){ m=1; y++; }\n    }\n  });\n  if(n){ saveData(); try{ renderAll(); }catch(e){} toast(n===1?'Spotify S/ 11.90 descontado automáticamente':n+' gastos fijos registrados automáticamente','ok'); }\n}\n// ── BANNER MES ACTUAL ──────────────────────────────────────────────────────────\nfunction hapiUsdHoy(){ return hapiValorSoles()/getTc(); }\nfunction snapHapiMes(){\n  if(!Array.isArray(data.acciones)||!data.acciones.length) return;\n  const k=new Date().toISOString().slice(0,7);\n  if(!data.hapiSnap) data.hapiSnap={};\n  if(data.hapiSnap[k]==null){ data.hapiSnap[k]=parseFloat(hapiUsdHoy().toFixed(2)); saveData(); }\n}\nfunction renderMesBanner(){\n  const el=document.getElementById('mesBanner');\n  if(!el)return;\n  const now=new Date();\n  const mi=now.getMonth();\n  const yr=now.getFullYear();\n  const mesNombre=now.toLocaleDateString('es-PE',{month:'long',year:'numeric'});\n  const txs=data.transactions.filter(t=>{\n    if(getTxYear(t)!==yr)return false;\n    return getTxMonth(t)===mi;\n  });\n  const ing=txs.filter(t=>t.tipo==='ingreso'&&!t.vaAHapi).reduce((a,t)=>a+t.monto,0);\n  const egr=txs.filter(t=>t.tipo==='egreso').reduce((a,t)=>a+t.monto,0);\n  const bal=ing-egr;\n  const cap=data.capitalInicial||0;\n  const mk=now.toISOString().slice(0,7);\n  const depUsd=(data.hapi||[]).filter(m=>m.tipo==='deposito'&&String(m.fecha||'').slice(0,7)===mk).reduce((a,m)=>a+(m.montoUsd||0),0);\n  const snap=data.hapiSnap&&data.hapiSnap[mk];\n  const ganMes=snap!=null?hapiUsdHoy()-snap-depUsd:null;\n  const extraMes=(depUsd>0||ganMes!=null)?`\n    <div class=\"mes-banner-item\">\n      <div class=\"mes-banner-label\">Invertido en Hapi<\u002Fdiv>\n      <div class=\"mes-banner-val\" style=\"color:var(--hapi)\">$ ${f(depUsd)}<\u002Fdiv>\n    <\u002Fdiv>`+(ganMes!=null?`\n    <div class=\"mes-banner-item\">\n      <div class=\"mes-banner-label\">Ganaron tus acciones<\u002Fdiv>\n      <div class=\"mes-banner-val\" style=\"color:${ganMes>=0?'var(--green)':'var(--red)'}\">${ganMes>=0?'+':'-'}$ ${f(ganMes)}<\u002Fdiv>\n    <\u002Fdiv>`:''):'';\n  el.innerHTML=`\n    <div style=\"width:100%;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:4px\">\n      <span style=\"font-size:12px;font-weight:600;color:var(--text2);text-transform:capitalize\">${mesNombre}<\u002Fspan>\n      <span style=\"font-size:10px;color:var(--text3)\">Mes en curso<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"mes-banner-item\">\n      <div class=\"mes-banner-label\">Ingresos<\u002Fdiv>\n      <div class=\"mes-banner-val\" style=\"color:var(--green)\">S/ ${f(ing)}<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"mes-banner-item\">\n      <div class=\"mes-banner-label\">Egresos<\u002Fdiv>\n      <div class=\"mes-banner-val\" style=\"color:var(--red)\">S/ ${f(egr)}<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"mes-banner-item\">\n      <div class=\"mes-banner-label\">Balance<\u002Fdiv>\n      <div class=\"mes-banner-val\" style=\"color:${bal>=0?'var(--green)':'var(--red)'}\">S/ ${f(bal)}<\u002Fdiv>\n    <\u002Fdiv>${extraMes}`;\n}\n\n// ── BARRAS DE PROGRESO ─────────────────────────────────────────────────────────\nfunction renderProgreso(){\n  const el=document.getElementById('progWrap');\n  if(!el)return;\n  const txs=data.transactions.filter(t=>getTxYear(t)===activeYear);\n  const ing=txs.filter(t=>t.tipo==='ingreso'&&!t.vaAHapi).reduce((a,t)=>a+t.monto,0);\n  const egr=txs.filter(t=>t.tipo==='egreso').reduce((a,t)=>a+t.monto,0);\n  const max=Math.max(ing,egr,1);\n  el.innerHTML=`\n    <div class=\"prog-row\">\n      <span class=\"prog-label\" style=\"color:var(--green)\">Ingresos<\u002Fspan>\n      <div class=\"prog-bar-bg\"><div class=\"prog-bar-fill\" style=\"width:${(ing/max*100).toFixed(1)}%;background:var(--green)\"><\u002Fdiv><\u002Fdiv>\n      <span class=\"prog-val\" style=\"color:var(--green)\">S/ ${f(ing)}<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"prog-row\">\n      <span class=\"prog-label\" style=\"color:var(--red)\">Egresos<\u002Fspan>\n      <div class=\"prog-bar-bg\"><div class=\"prog-bar-fill\" style=\"width:${(egr/max*100).toFixed(1)}%;background:var(--red)\"><\u002Fdiv><\u002Fdiv>\n      <span class=\"prog-val\" style=\"color:var(--red)\">S/ ${f(egr)}<\u002Fspan>\n    <\u002Fdiv>`;\n}\n\n// ── ALERTA INACTIVIDAD ─────────────────────────────────────────────────────────\nfunction checkAlerta(){\n  const el=document.getElementById('alertaBanner');\n  const msg=document.getElementById('alertaMsg');\n  if(!el)return;\n  const txs=data.transactions;\n  if(!txs.length){ el.style.display='none'; return; }\n  const last=txs.reduce((a,t)=>t.fecha>a?t.fecha:a,'');\n  if(!last){ el.style.display='none'; return; }\n  const dias=Math.floor((Date.now()-new Date(last+'T12:00:00'))/(1000*60*60*24));\n  if(dias>=5){\n    el.style.display='flex';\n    msg.textContent=`Llevas ${dias} días sin registrar movimientos.`;\n  } else {\n    el.style.display='none';\n  }\n}\n\n// ── GRÁFICO DE LÍNEA HAPI ─────────────────────────────────────────────────────\n\n\nfunction f(n){return Math.abs(n).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});}\nfunction getTxYear(t){return t.fecha?parseInt(t.fecha.slice(0,4)):null;}\nfunction getTxMonth(t){return t.fecha?parseInt(t.fecha.slice(5,7))-1:null;}\nfunction sum(arr,tipo,cat){return arr.filter(t=>t.tipo===tipo&&t.cat===cat).reduce((a,t)=>a+t.monto,0);}\n\nfunction renderNotasResumen(){\n  const el=document.getElementById('notasResumen'); if(!el) return;\n  const notas=[...(data.notas||[])].filter(x=>!x.hecha).sort((a,b)=>b.fecha.localeCompare(a.fecha));\n  if(!notas.length){ el.innerHTML=''; return; }\n  const n=notas.length;\n  el.innerHTML='<details class=\"drop-alert\" '+(window.__dropOpen&&window.__dropOpen.notas?'open ':'')+'ontoggle=\"window.__dropOpen=window.__dropOpen||{};window.__dropOpen.notas=this.open\" style=\"margin-bottom:10px;border-radius:var(--radius-sm);background:var(--blue-bg);border:1px solid var(--blue);color:var(--blue)\">'+\n    '<summary style=\"display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;cursor:pointer;font-size:13px;font-weight:700;list-style:none\">'+\n      '<span>Tienes '+n+' nota'+(n>1?'s':'')+' pendiente'+(n>1?'s':'')+'<\u002Fspan><span class=\"drop-chev\" style=\"font-size:11px;font-weight:400;opacity:.8;transition:transform .15s\">▾<\u002Fspan><\u002Fsummary>'+\n    '<div style=\"padding:0 12px 10px;display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow:auto\">'+\n      notas.map(x=>'<div style=\"display:flex;gap:9px;align-items:flex-start\">'+notaCheck(x)+'<div onclick=\"openNotaModal(\\''+x.id+'\\')\" style=\"flex:1;min-width:0;cursor:pointer;padding:7px 9px;border-radius:6px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:12px;font-weight:400;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden\">'+escH(x.texto)+'<\u002Fdiv><\u002Fdiv>').join('')+\n      '<button class=\"btn btn-sm\" style=\"align-self:flex-start\" onclick=\"switchTab(\\'notas\\')\">Ir a Notas<\u002Fbutton>'+\n    '<\u002Fdiv><\u002Fdetails>';\n}\nfunction balanceReal(){\n  const txs=data.transactions.filter(t=>getTxYear(t)===activeYear);\n  const ing=txs.filter(t=>t.tipo==='ingreso'&&!t.vaAHapi).reduce((a,t)=>a+(parseFloat(t.monto)||0),0);\n  const egr=txs.filter(t=>t.tipo==='egreso').reduce((a,t)=>a+(parseFloat(t.monto)||0),0);\n  const prodNet=(data.productos||[]).reduce((a,m)=>a+(m.tipo==='deposito'?(parseFloat(m.monto)||0):-(parseFloat(m.monto)||0)),0);\n  return getCapitalInicialYear(activeYear)+(ing-egr)+hapiValorSoles()-prodNet;\n}\nfunction renderResumen(){\n  try{ renderNotasResumen(); }catch(e){}\n  try{ renderStockResumen(); }catch(e){}\n  const txs=data.transactions.filter(t=>getTxYear(t)===activeYear);\n  const totalIng=txs.filter(t=>t.tipo==='ingreso'&&!t.vaAHapi).reduce((a,t)=>a+t.monto,0);\n  const totalEgr=txs.filter(t=>t.tipo==='egreso').reduce((a,t)=>a+t.monto,0);\n  const prodNet=(data.productos||[]).reduce((a,m)=>a+(m.tipo==='deposito'?m.monto:-m.monto),0);\n  const capital=getCapitalInicialYear(activeYear);\n  const tc=getTc();\n  const hapiTotal=hapiValorSoles();\n  const hapiTotalUsd=hapiTotal/tc;\n  // Balance real: capital inicial + ingresos - egresos + hapi total - productos\n  const bal=balanceReal();\n  setTimeout(()=>{ try{ renderMeta(); }catch(e){} },0);\n\n  // Update hapi card in resumen\n  const hapiVal=document.getElementById('hapiResumenVal');\n  if(hapiVal) hapiVal.textContent='S/ '+f(hapiTotal);\n  const hapiUsdEl=document.getElementById('hapiResumenUsd');\n  if(hapiUsdEl) hapiUsdEl.textContent='$ '+f(hapiTotalUsd);\n\n  const cap=getCapitalInicialYear(activeYear);\n  document.getElementById('annualCards').innerHTML=[\n    ['Capital inicial','S/ '+f(cap),''],\n    ['Total ingresos','S/ '+f(totalIng),'green'],\n    ['Total egresos','S/ '+f(totalEgr),'red'],\n    ['En Hapi','S/ '+f(hapiTotal),'yellow'],\n    ['Balance real','S/ '+f(bal),bal>=0?'green':'red'],\n  ].map(([l,v,c])=>`<div class=\"sum-card\"><div class=\"sum-label\">${l}<\u002Fdiv><div class=\"sum-value ${c}\">${v}<\u002Fdiv><\u002Fdiv>`).join('');\n\n  // Tarjetas de productos (catálogo + ventas del año activo)\n  const pc=document.getElementById('prodCards');\n  if(pc){\n    const vsY=(data.ventasProd||[]).filter(v=>(v.fecha||'').slice(0,4)===String(activeYear));\n    const vend=vsY.reduce((a,v)=>a+(parseFloat(v.total)||0),0);\n    const ganP=vsY.reduce((a,v)=>a+(v.items||[]).reduce((x,i)=>x+((parseFloat(i.precio)||0)-(parseFloat(i.costo)||0))*i.qty,0),0);\n    const invY=(data.productos||[]).filter(m=>(m.fecha||'').slice(0,4)===String(activeYear))\n      .reduce((a,m)=>a+(m.tipo==='deposito'?(parseFloat(m.monto)||0):-(parseFloat(m.monto)||0)),0);\n    const stockCosto=(data.catalogo||[]).reduce((a,p)=>a+(parseFloat(p.costo)||0)*(parseInt(p.stock)||0),0);\n    pc.innerHTML=[\n      ['Invertido','S/ '+f(invY),''],\n      ['Vendido','S/ '+f(vend),'green'],\n      ['Ganancia','S/ '+f(ganP),ganP>=0?'green':'red'],\n      ['Stock a costo','S/ '+f(stockCosto),'yellow'],\n    ].map(a=>'<div class=\"sum-card\"><div class=\"sum-label\">'+a[0]+'<\u002Fdiv><div class=\"sum-value '+a[2]+'\">'+a[1]+'<\u002Fdiv><\u002Fdiv>').join('');\n  }\n\n  // Hapi and productos movements indexed by month\n  function movesForMonth(arr, mi){\n    return (arr||[]).filter(m=>m.fecha&&parseInt(m.fecha.slice(5,7))-1===mi);\n  }\n  function netForMonth(arr, mi){\n    return movesForMonth(arr,mi).reduce((a,m)=>a+(m.tipo==='deposito'?m.monto:-m.monto),0);\n  }\n\n  const egrPal=['#f472b6','#2dd4bf','#a3e635','#38bdf8','#facc15','#fb7185','#818cf8','#34d399'];\n  const egrBase=['Comidas','Pasajes','Fiestas','Spotify'];\n  const egrUsadas=[...new Set(txs.filter(t=>t.tipo==='egreso').map(t=>t.cat||'Otros'))];\n  const egrCols=[...egrBase,...[...new Set([...getEgrCats(),...egrUsadas])].filter(c=>!egrBase.includes(c)&&egrUsadas.includes(c)).sort((x,y)=>(x==='Otros')-(y==='Otros')||x.localeCompare(y))];\n  const egrColor=(c,i)=>({Comidas:'var(--red)',Pasajes:'var(--yellow)',Fiestas:'var(--red)',Spotify:'#1db954'})[c]||CAT_DOTS[c]||egrPal[i%egrPal.length];\n  const egrSum=(mt,c)=>mt.filter(t=>t.tipo==='egreso'&&(t.cat||'Otros')===c).reduce((a,t)=>a+t.monto,0);\n  const escC=s=>String(s).replace(/[&<>\"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'})[ch]);\n  const head=document.getElementById('monthTableHead');\n  if(head) head.innerHTML='<th>Mes<\u002Fth><th style=\"color:var(--green)\">España<\u002Fth><th style=\"color:var(--green)\">La Unión<\u002Fth><th style=\"color:var(--purple)\">Ventas<\u002Fth><th style=\"color:var(--green)\">Tot. Ing.<\u002Fth>'+\n    egrCols.map((c,i)=>'<th style=\"color:'+egrColor(c,i)+'\">'+escC(c==='Otros'?'Otros egr.':c)+'<\u002Fth>').join('')+\n    '<th style=\"color:var(--red)\">Tot. Egr.<\u002Fth><th style=\"color:var(--hapi)\">Hapi<\u002Fth><th style=\"color:var(--red)\">Productos<\u002Fth><th>Balance<\u002Fth>';\n\n  let rows='';\n  let tots={esp:0,uni:0,ven:0,ing:0,egr:0,hapi:0,prod:0,bal:0};\n  const totCat=egrCols.map(()=>0);\n  MESES.forEach((mes,mi)=>{\n    const mt=txs.filter(t=>getTxMonth(t)===mi);\n    const espAll=mt.filter(t=>t.tipo==='ingreso'&&!t.vaAHapi&&t.cat==='Trabajo España');\n    const esp=espAll.filter(t=>!t.vaAHapi).reduce((a,t)=>a+t.monto,0);\n    const uni=sum(mt,'ingreso','Trabajo La Unión');\n    const ven=sum(mt,'ingreso','Venta de productos');\n    const ing=esp+uni+ven;\n    const cats=egrCols.map(c=>egrSum(mt,c));\n    const egr=mt.filter(t=>t.tipo==='egreso').reduce((a,t)=>a+t.monto,0);\n    const hapi=netForMonth(data.hapi,mi);\n    const prod=netForMonth(data.productos,mi);\n    const b=ing-egr+hapi-prod;\n    tots.esp+=esp;tots.uni+=uni;tots.ven+=ven;tots.ing+=ing;tots.egr+=egr;\n    cats.forEach((v,i)=>totCat[i]+=v);\n    tots.hapi+=hapi;tots.prod+=prod;tots.bal+=b;\n    rows+=`<tr>\n      <td>${mes}<\u002Ftd>\n      <td class=\"g\">${esp?'S/'+f(esp):'-'}<\u002Ftd>\n      <td class=\"g\">${uni?'S/'+f(uni):'-'}<\u002Ftd>\n      <td class=\"p\">${ven?'S/'+f(ven):'-'}<\u002Ftd>\n      <td class=\"g\">${ing?'S/'+f(ing):'-'}<\u002Ftd>\n      ${cats.map((v,i)=>'<td style=\"color:'+egrColor(egrCols[i],i)+'\">'+(v?'S/'+f(v):'-')+'<\u002Ftd>').join('')}\n      <td class=\"r\">${egr?'S/'+f(egr):'-'}<\u002Ftd>\n      <td style=\"color:var(--hapi)\">${hapi?'S/'+f(hapi):'-'}<\u002Ftd>\n      <td class=\"r\">${prod?'S/'+f(prod):'-'}<\u002Ftd>\n      <td class=\"${b>=0?'pos':'neg'}\">${b?'S/'+f(b):'-'}<\u002Ftd>\n    <\u002Ftr>`;\n  });\n  tots.bal=tots.ing-tots.egr+tots.hapi-tots.prod;\n  rows+=`<tr class=\"total-row\">\n    <td>TOTAL<\u002Ftd>\n    <td class=\"g\">S/${f(tots.esp)}<\u002Ftd>\n    <td class=\"g\">S/${f(tots.uni)}<\u002Ftd>\n    <td class=\"p\">S/${f(tots.ven)}<\u002Ftd>\n    <td class=\"g\">S/${f(tots.ing)}<\u002Ftd>\n    ${totCat.map((v,i)=>'<td style=\"color:'+egrColor(egrCols[i],i)+'\">S/'+f(v)+'<\u002Ftd>').join('')}\n    <td class=\"r\">S/${f(tots.egr)}<\u002Ftd>\n    <td style=\"color:var(--hapi)\">S/${f(tots.hapi)}<\u002Ftd>\n    <td class=\"r\">S/${f(tots.prod)}<\u002Ftd>\n    <td class=\"${tots.bal>=0?'pos':'neg'}\">S/${f(tots.bal)}<\u002Ftd>\n  <\u002Ftr>`;\n  document.getElementById('monthTableBody').innerHTML=rows;\n}\n\nfunction renderTx(){\n  buildMonthFilters();\n  const yTxs=data.transactions.filter(t=>getTxYear(t)===activeYear);\n\n  const ingMesEl=document.getElementById('ingMes');\n  const ingCatEl=document.getElementById('ingCat');\n  const ingMes=ingMesEl?ingMesEl.value:'';\n  const ingCat=ingCatEl?ingCatEl.value:'';\n  let ings=yTxs.filter(t=>t.tipo==='ingreso');\n  if(ingMes!=='')ings=ings.filter(t=>getTxMonth(t)===parseInt(ingMes));\n  if(ingCat)ings=ings.filter(t=>t.cat===ingCat);\n  ings.sort((a,b)=>b.fecha.localeCompare(a.fecha));\n  const ingEl=document.getElementById('ingresosList');\n  if(ingEl)ingEl.innerHTML=ings.length?ings.map(txCard).join(''):`<div class=\"empty-tx\">Sin ingresos para este filtro<\u002Fdiv>`;\n\n  const egrMesEl=document.getElementById('egrMes');\n  const egrCatEl=document.getElementById('egrCat');\n  const egrMes=egrMesEl?egrMesEl.value:'';\n  const egrCat=egrCatEl?egrCatEl.value:'';\n  let egrs=yTxs.filter(t=>t.tipo==='egreso');\n  if(egrMes!=='')egrs=egrs.filter(t=>getTxMonth(t)===parseInt(egrMes));\n  if(egrCat)egrs=egrs.filter(t=>t.cat===egrCat);\n  egrs.sort((a,b)=>b.fecha.localeCompare(a.fecha));\n  const egrEl=document.getElementById('egresosList');\n  if(egrEl)egrEl.innerHTML=egrs.length?egrs.map(txCard).join(''):`<div class=\"empty-tx\">Sin egresos para este filtro<\u002Fdiv>`;\n}\n\nfunction buildMonthFilters(){\n  ['ingMes','egrMes','hapiMes','productosMes'].forEach(id=>{\n    const s=document.getElementById(id);\n    if(!s)return;\n    const cur=s.value;\n    s.innerHTML=`<option value=\"\">Todos los meses<\u002Foption>`+MESES.map((m,i)=>`<option value=\"${i}\"${cur===String(i)?' selected':''}>${m}<\u002Foption>`).join('');\n  });\n}\n\nfunction txCard(t){\n  const dot=CAT_DOTS[t.cat]||'#999';\n  const ds=t.fecha?new Date(t.fecha+'T12:00:00').toLocaleDateString('es-PE',{day:'2-digit',month:'short'}):'';\n  const origTag=t.montoOrig?` · $${f(t.montoOrig)} USD`:'';\n  const recTag=t.recurrente?`<svg width=\"10\" height=\"10\" fill=\"none\" stroke=\"var(--yellow)\" stroke-width=\"2\" viewBox=\"0 0 24 24\" style=\"flex-shrink:0;pointer-events:none\"><path d=\"M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8\"/><path d=\"M3 3v5h5\"/><\u002Fsvg>`:'';\n  const hapiTag=t.vaAHapi?`<svg width=\"10\" height=\"10\" fill=\"none\" stroke=\"var(--hapi)\" stroke-width=\"2\" viewBox=\"0 0 24 24\" style=\"flex-shrink:0\" title=\"Va a Hapi\"><path d=\"M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z\"/><path d=\"M12 6v6l4 2\"/><\u002Fsvg>`:'';\n  return `<div class=\"tx-item\" onclick=\"openTxModal('${t.tipo}','${t.id}')\">\n    <div class=\"tx-dot\" style=\"background:${dot}\"><\u002Fdiv>\n    <div class=\"tx-info\"><div class=\"tx-name\" style=\"display:flex;align-items:center;gap:5px\">${recTag}${hapiTag}${escH(t.desc)}<\u002Fdiv><div class=\"tx-meta\">${escH(t.cat||'')}${t.vaAHapi?' · → Hapi':''}${ds?' · '+ds:''}${origTag}${t.nota?' · '+escH(t.nota):''}<\u002Fdiv><\u002Fdiv>\n    ${t.vaAHapi?`<div class=\"tx-amount\" style=\"color:var(--hapi)\">→ Hapi ${t.montoOrig?'$'+f(t.montoOrig):'S/'+f(t.monto)}<\u002Fdiv>`:`<div class=\"tx-amount ${t.tipo==='ingreso'?'g':'r'}\">${t.tipo==='ingreso'?'+':'-'} S/${f(t.monto)}<\u002Fdiv>`}\n  <\u002Fdiv>`;\n}\n\nfunction renderGastosFijos(){\n  const el=document.getElementById('gastosFijosBanner');\n  if(!el)return;\n  const now=new Date();\n  const mi=now.getMonth();\n  const yr=now.getFullYear();\n\n  // Find all unique recurrentes (latest instance of each desc+cat)\n  const recurrentes=[];\n  const seen=new Set();\n  [...data.transactions].reverse().forEach(t=>{\n    if(!t.recurrente)return;\n    { const fx=fijoDeTx(t); if(fx&&!fijosActivos().includes(fx)) return; }\n    const key=t.tipo+'|'+t.desc+'|'+t.cat;\n    if(seen.has(key))return;\n    seen.add(key);\n    recurrentes.push(t);\n  });\n\n  const autoTxt=fijosActivos().map(fx=>fx.desc+' S/ '+f(fx.monto)+' (día '+fx.dia+')').join(', ');\n  const autoNote=autoTxt?'<div style=\"font-size:11px;color:var(--text3);margin:-4px 0 10px\">Automáticos: '+autoTxt+'<\u002Fdiv>':'';\n  setTimeout(()=>{ if(autoNote&&!el.querySelector('[data-auto]')) el.insertAdjacentHTML('beforeend',autoNote.replace('<div ','<div data-auto ')); },0);\n  if(!recurrentes.length){el.innerHTML='';return;}\n\n  // Check which are missing this month\n  const pendientes=recurrentes.filter(r=>{\n    return !data.transactions.some(t=>\n      t.desc===r.desc&&t.cat===r.cat&&t.tipo===r.tipo&&\n      t.fecha&&parseInt(t.fecha.slice(5,7))-1===mi&&parseInt(t.fecha.slice(0,4))===yr\n    );\n  });\n\n  if(!pendientes.length){\n    el.innerHTML=`<div style=\"display:flex;align-items:center;gap:7px;background:var(--green-bg);border:1px solid var(--green-dim);border-radius:var(--radius);padding:10px 12px;margin-bottom:10px;font-size:12px;color:var(--green)\">\n      <svg width=\"13\" height=\"13\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><polyline points=\"20 6 9 17 4 12\"/><\u002Fsvg>\n      Todos los gastos fijos registrados este mes\n    <\u002Fdiv>`;\n    return;\n  }\n\n  el.innerHTML=`<div style=\"background:var(--yellow-bg);border:1px solid var(--yellow-dim);border-radius:var(--radius);padding:10px 12px;margin-bottom:10px\">\n    <div style=\"font-size:11px;font-weight:600;color:var(--yellow);display:flex;align-items:center;gap:5px;margin-bottom:8px\">\n      <svg width=\"12\" height=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path d=\"M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8\"/><path d=\"M3 3v5h5\"/><\u002Fsvg>\n      ${pendientes.length} gasto${pendientes.length>1?'s':''} fijo${pendientes.length>1?'s':''} pendiente${pendientes.length>1?'s':''} este mes\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:5px\">\n      ${pendientes.map(r=>`\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px\">\n          <span style=\"font-size:12px;color:var(--text)\">${r.desc} <span style=\"color:var(--text3)\">· ${r.cat}<\u002Fspan><\u002Fspan>\n          <span style=\"font-size:12px;font-weight:600;color:var(--red)\">S/ ${f(r.monto)}<\u002Fspan>\n        <\u002Fdiv>`).join('')}\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n}\n\nfunction setTxType(type){\n  txType=type;\n  document.getElementById('typeIng').className='type-btn'+(type==='ingreso'?' sel-ing':'');\n  document.getElementById('typeEgr').className='type-btn'+(type==='egreso'?' sel-egr':'');\n  document.getElementById('txBtnSave').className=type==='ingreso'?'btn btn-green':'btn btn-red';\n  fillTxCats(type);\n  const d=document.getElementById('txDesc');\n  if(d) d.placeholder=type==='ingreso'?'Ej: Sueldo junio':'Ej: Almuerzo, pasaje, recarga';\n}\n\nfunction openTxModal(tipo,id){\n  editTxId=id||null;txType=tipo||'ingreso';\n  const tx=id?data.transactions.find(t=>t.id===id):null;\n  if(tx)txType=tx.tipo;\n  document.getElementById('txModalTitle').textContent=tx?'Editar movimiento':(txType==='ingreso'?'Nuevo ingreso':'Nuevo egreso');\n  document.getElementById('txBtnDelete').style.display=tx?'':'none';\n  document.getElementById('txTypeField').style.display=tx?'':'none';\n  setTxType(txType);\n  document.getElementById('txDesc').value=tx?tx.desc:'';\n  document.getElementById('txMonto').value=tx?tx.monto:'';\n  document.getElementById('txFecha').value=tx?tx.fecha:new Date().toISOString().slice(0,10);\n  document.getElementById('txNota').value=tx?tx.nota:'';\n  document.getElementById('txRecurrente').checked=tx?!!tx.recurrente:false;\n  document.getElementById('txVaAHapi').checked=tx?!!tx.vaAHapi:false;\n  window._hapiComision=0.0045;\n  const lm=tx&&tx.vaAHapi&&(data.hapi||[]).find(m=>m.linkedTxId===tx.id);\n  setHapiComision(lm&&lm.montoUsdBruto?(+(lm.comisionUsd/lm.montoUsdBruto).toFixed(4)):0.0045);\n  document.getElementById('txHapiTc').value=lm&&lm.tcCambio?lm.tcCambio:'';\n  const comWrap=document.getElementById('txHapiComisionWrap');\n  if(comWrap) comWrap.style.display=(tx&&tx.vaAHapi)?'flex':'none';\n  // Only show recurrente for egresos\n  const wrap=document.getElementById('txRecurrenteWrap');\n  if(wrap) wrap.style.display=txType==='egreso'?'flex':'none';\n  if(tx)document.getElementById('txCat').value=tx.cat;\n  setTimeout(()=>onCatChange(),50);\n  document.getElementById('txModalBg').classList.add('open');\n  setTimeout(()=>document.getElementById('txDesc').focus(),100);\n}\nfunction closeTxModal(){document.getElementById('txModalBg').classList.remove('open');}\nfunction bgClickTx(e){if(e.target===document.getElementById('txModalBg'))closeTxModal();}\n\nwindow._hapiComision=0.0045;\nfunction setHapiComision(val){\n  window._hapiComision=val;\n  setTimeout(()=>{ if(typeof updateHapiPreview==='function') updateHapiPreview(); },0);\n  const btns={'0.0045':'comBtn045','0.009':'comBtn099','0':'comBtnNone'};\n  Object.entries(btns).forEach(([k,id])=>{\n    const el=document.getElementById(id);\n    if(!el)return;\n    const active=parseFloat(k)===val;\n    el.style.background=active?'var(--hapi-bg)':'var(--surface2)';\n    el.style.color=active?'var(--hapi)':'var(--text2)';\n    el.style.borderColor=active?'var(--hapi-dim)':'var(--border2)';\n  });\n}\nfunction onVaAHapiChange(){\n  const checked=document.getElementById('txVaAHapi').checked;\n  const wrap=document.getElementById('txHapiComisionWrap');\n  if(wrap) wrap.style.display=checked?'flex':'none';\n  const cat=document.getElementById('txCat').value;\n  const tw=document.getElementById('txHapiTcWrap');\n  if(tw) tw.style.display=(checked&&cat==='Trabajo La Unión')?'flex':'none';\n  const ti=document.getElementById('txHapiTc');\n  if(ti&&!ti.value) ti.value=localStorage.getItem('fin_hapi_tc')||getTc().toFixed(3);\n  updateHapiPreview();\n}\nfunction updateHapiPreview(){\n  const el=document.getElementById('txHapiPreview'); if(!el) return;\n  if(!document.getElementById('txVaAHapi').checked){ el.textContent=''; return; }\n  const cat=document.getElementById('txCat').value, m=parseFloat(document.getElementById('txMonto').value)||0;\n  let usd=m;\n  if(cat==='Trabajo La Unión'){ const tc=parseFloat(document.getElementById('txHapiTc').value)||0; usd=tc>0?m/tc:0; }\n  if(!(usd>0)){ el.textContent=''; return; }\n  const com=usd*(window._hapiComision||0);\n  el.textContent='Llega a Hapi: $ '+f(usd-com)+(com?' (comisión −$'+f(com)+')':'')+(cat==='Trabajo La Unión'?' · de S/ '+f(m):'');\n}\nfunction saveTx(){\n  const desc=document.getElementById('txDesc').value.trim();\n  const monto=parseFloat(document.getElementById('txMonto').value);\n  const fecha=document.getElementById('txFecha').value;\n  if(!desc){toast('Agrega una descripción','err');return;}\n  if(!monto||monto<=0){toast('Agrega un monto válido','err');return;}\n  if(!fecha){toast('Selecciona una fecha','err');return;}\n  const cat=document.getElementById('txCat').value;\n  const isEsp=cat==='Trabajo España';\n  const montoFinal=isEsp?parseFloat((monto*getTc()).toFixed(2)):monto;\n  const recurrente=document.getElementById('txRecurrente').checked;\n  const isUni=cat==='Trabajo La Unión';\n  const vaAHapi=(isEsp||isUni)&&txType==='ingreso'&&document.getElementById('txVaAHapi').checked;\n  let tcCambio=null;\n  if(vaAHapi&&isUni){\n    tcCambio=parseFloat(document.getElementById('txHapiTc').value);\n    if(!tcCambio||tcCambio<=0){toast('Pon el tipo de cambio que te cobran','err');return;}\n    localStorage.setItem('fin_hapi_tc',String(tcCambio));\n  }\n  const txId=editTxId||Date.now().toString();\n  const tx={id:txId,tipo:txType,desc,monto:montoFinal,fecha,cat,nota:document.getElementById('txNota').value.trim(),montoOrig:isEsp?monto:null,montoOrigCur:isEsp?'USD':null,recurrente,vaAHapi};\n  if(editTxId){const i=data.transactions.findIndex(t=>t.id===editTxId);data.transactions[i]=tx;}\n  else{data.transactions.push(tx);}\n  // If \"va a Hapi\": auto-create or update the linked Hapi deposit\n  if(vaAHapi){\n    const HAPI_COMISION=window._hapiComision||0;\n    const brutoUsd=isUni?monto/tcCambio:monto;\n    const comisionUsd=brutoUsd*HAPI_COMISION;\n    const montoNetoUsd=brutoUsd-comisionUsd;\n    const tc=getTc();\n    const hapiMove={\n      id:'hapi_linked_'+txId,\n      tipo:'deposito',\n      desc:'Depósito desde '+(isUni?'La Unión':'España')+' — '+desc,\n      monto:parseFloat((montoNetoUsd*tc).toFixed(2)),\n      montoUsd:parseFloat(montoNetoUsd.toFixed(4)),\n      montoUsdBruto:parseFloat(brutoUsd.toFixed(4)),\n      comisionUsd:parseFloat(comisionUsd.toFixed(4)),\n      tcCambio:tcCambio,\n      montoSoles:isUni?monto:null,\n      fecha,\n      nota:isUni?'Auto desde La Unión · TC '+tcCambio:'Auto desde ingreso España',\n      linkedTxId:txId\n    };\n    (data.hapi||[]).filter(m=>m.linkedTxId===txId&&m.enEfectivo).forEach(m=>addEfectivo(-(m.montoUsd||0)));\n    data.hapi=data.hapi.filter(m=>m.linkedTxId!==txId);\n    hapiMove.enEfectivo=true; addEfectivo(hapiMove.montoUsd);\n    data.hapi.push(hapiMove);\n    toast('Ingreso registrado y depósito creado en Hapi (−$'+f(comisionUsd)+' comisión)','ok');\n  } else {\n    (data.hapi||[]).filter(m=>m.linkedTxId===txId&&m.enEfectivo).forEach(m=>addEfectivo(-(m.montoUsd||0)));\n    data.hapi=data.hapi.filter(m=>m.linkedTxId!==txId);\n  }\n  saveData();closeTxModal();renderAll();\n}\nfunction fijoDeTx(tx){\n  if(!tx||tx.tipo!=='egreso') return null;\n  return (data.fijosAuto||[]).find(fx=>String(tx.id).startsWith('fijo_'+fx.id+'_')||(tx.cat===fx.cat&&String(tx.nota||'').startsWith('Automático')))||null;\n}\nfunction fijosActivos(){ const b=new Set(data.borrados||[]); return (data.fijosAuto||[]).filter(fx=>!b.has('fijooff_'+fx.id)); }\nfunction deleteTx(){\n  if(!confirm('¿Eliminar este movimiento?'))return;\n  const tx=data.transactions.find(t=>t.id===editTxId);\n  if(!Array.isArray(data.borrados)) data.borrados=[];\n  data.borrados.push(String(editTxId));\n  const fx=fijoDeTx(tx);\n  if(fx){\n    data.borrados.push('fijoskip_'+fx.id+'_'+String(tx.fecha||'').slice(0,7));\n    if(confirm('¿Dejar de descontar '+fx.desc+' automáticamente los próximos meses?\\n\\nAceptar = ya no lo descuentes.\\nCancelar = solo borrar este mes.')){\n      data.borrados.push('fijooff_'+fx.id);\n      toast(fx.desc+' ya no se descontará automáticamente','ok');\n    }\n  }\n  data.borrados=[...new Set(data.borrados)];\n  data.transactions=data.transactions.filter(t=>t.id!==editTxId);\n  (data.hapi||[]).filter(m=>m.linkedTxId===editTxId&&m.enEfectivo).forEach(m=>addEfectivo(-(m.montoUsd||0)));\n  data.hapi=(data.hapi||[]).filter(m=>m.linkedTxId!==editTxId);\n  saveData();closeTxModal();renderAll();\n}\n\n// ── INVERSIONES ───────────────────────────────────────────────────────────────\nfunction hapiValorSoles(){\n  const acc=Array.isArray(data.acciones)?data.acciones:[];\n  const tc=getTc();\n  const efe=typeof data.hapiEfectivo==='number'?data.hapiEfectivo:0;\n  if(!acc.length&&!efe) return getCapitalHapiYear(activeYear)*tc+calcNet(data.hapi||[]);\n  let usd=0;\n  acc.forEach(a=>{ const q=parseFloat(a.qty)||0, pr=(typeof _precios!=='undefined'&&_precios[a.ticker])||null;\n    usd+=(pr&&typeof pr.p==='number'?pr.p:(parseFloat(a.costo)||0))*q; });\n  return (usd+efe)*tc;\n}\nfunction calcNet(moves){return moves.reduce((a,m)=>a+(m.tipo==='deposito'?m.monto:-m.monto),0);}\nfunction calcDeposits(moves){return moves.filter(m=>m.tipo==='deposito').reduce((a,m)=>a+m.monto,0);}\nfunction calcRetiros(moves){return moves.filter(m=>m.tipo==='retiro').reduce((a,m)=>a+m.monto,0);}\n\nfunction renderInvSection(src){\n  const moves=data[src]||[];\n  const net=calcNet(moves);\n  const deps=calcDeposits(moves);\n  const rets=calcRetiros(moves);\n  const color=src==='hapi'?'var(--hapi)':'var(--prod)';\n  const colorBg=src==='hapi'?'var(--hapi-bg)':'var(--prod-bg)';\n  const colorDim=src==='hapi'?'var(--hapi-dim)':'var(--prod-dim)';\n\n  const totalEl=document.getElementById(src+'Total');\n  if(totalEl){\n    if(src==='hapi'){\n      const tc=getTc(); const netUsd=net/tc;\n      totalEl.textContent='$ '+f(netUsd)+' · S/ '+f(net);\n    } else {\n      totalEl.textContent='S/ '+f(net);\n    }\n  }\n\n  const movesEl=document.getElementById(src+'Moves');\n  if(!movesEl)return;\n\n  // Apply filters\n  const mesEl=document.getElementById(src+'Mes');\n  const tipoEl=document.getElementById(src+'Tipo');\n  const mesFil=mesEl?mesEl.value:'';\n  const tipoFil=tipoEl?tipoEl.value:'';\n  let filtered=[...moves].sort((a,b)=>b.fecha.localeCompare(a.fecha));\n  if(mesFil!=='') filtered=filtered.filter(m=>{\n    const mo=m.fecha?parseInt(m.fecha.slice(5,7))-1:-1;\n    return mo===parseInt(mesFil);\n  });\n  if(tipoFil) filtered=filtered.filter(m=>m.tipo===tipoFil);\n\n  if(!filtered.length){\n    movesEl.innerHTML=`<div class=\"empty-tx\">Sin movimientos para este filtro.<\u002Fdiv>`;\n    return;\n  }\n  movesEl.innerHTML=filtered.map(m=>{\n    const ds=m.fecha?new Date(m.fecha+'T12:00:00').toLocaleDateString('es-PE',{day:'2-digit',month:'short'}):'';\n    const isIn=m.tipo==='deposito';\n    const dotColor=isIn?color:'var(--red)';\n    const openFn=`openInvModal2('${src}','${m.id}')`;\n    const amtLine=src==='hapi'&&m.montoUsd\n      ? `<div class=\"tx-amount ${isIn?'g':'r'}\">${isIn?'+':'-'} $${f(m.montoUsd)}<\u002Fdiv>\n         <div style=\"font-size:10px;color:var(--text3);text-align:right\">S/ ${f(m.monto)}${isIn&&m.comisionUsd?' · −$'+f(m.comisionUsd)+' com.':''}<\u002Fdiv>`\n      : `<div class=\"tx-amount ${isIn?'g':'r'}\">${isIn?'+':'-'} S/${f(m.monto)}<\u002Fdiv>`;\n    return `<div class=\"tx-item\" ${src==='hapi'?'style=\"align-items:flex-start;cursor:default\"':`onclick=\"${openFn}\" style=\"align-items:flex-start\"`}>\n      <div class=\"tx-dot\" style=\"background:${dotColor};margin-top:5px\"><\u002Fdiv>\n      <div class=\"tx-info\">\n        <div class=\"tx-name\">${escH(m.desc)}<\u002Fdiv>\n        <div class=\"tx-meta\">${isIn?'Depósito':'Retiro'}${m.proveedor?' · '+escH(m.proveedor):''}${ds?' · '+ds:''}${m.nota?' · '+escH(m.nota):''}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"text-align:right\">${amtLine}<\u002Fdiv>\n    <\u002Fdiv>`;\n  }).join('');\n}\n\nfunction renderInv(){\n  buildMonthFilters();\n  renderInvSection('hapi');\n  renderProductosSection();\n}\n\n\n// ── VOUCHERS DE PAGO (HAPI) ──────────────────────────────────────────────────\nconst VCH_DESDE='2000-01';\nlet _vchId=null, _vchCarpeta='';\nfunction vchList(){\n  if(!Array.isArray(data.vouchers)) data.vouchers=[];\n  data.vouchers.forEach(v=>{ if(!v.moneda) v.moneda='PEN'; if(typeof v.cat!=='string') v.cat=''; if(!v.tipo) v.tipo=(typeof v.img==='string'&&v.img.startsWith('data:application/pdf'))?'pdf':'img'; });\n  return data.vouchers;\n}\nfunction vchCats(){ if(!Array.isArray(data.vchCats)) data.vchCats=[]; return data.vchCats; }\nfunction vchAllCats(){\n  return [...new Set([...vchCats(), ...vchList().map(v=>v.cat).filter(Boolean)])].sort((a,b)=>a.localeCompare(b));\n}\nfunction vchSym(v){ return (v&&v.moneda==='USD')?'$ ':'S/ '; }\nfunction vchSoles(v){ const m=parseFloat(v.monto)||0; return v.moneda==='USD'?m*getTc():m; }\nfunction nuevaCarpetaVch(){\n  const n=prompt('Nombre de la carpeta:'); if(n===null) return;\n  const nom=n.trim(); if(!nom) return;\n  if(vchAllCats().some(c=>c.toLowerCase()===nom.toLowerCase())){ toast('Esa carpeta ya existe','err'); return; }\n  vchCats().push(nom); _vchCarpeta=nom;\n  saveData(); renderVchFolders(); renderVouchers();\n  toast('Carpeta \"'+nom+'\" creada','ok');\n}\nfunction setVchCarpeta(c){ _vchCarpeta=c; renderVchFolders(); renderVouchers(); }\nfunction renameCarpetaVch(c){\n  const n=prompt('Nuevo nombre de la carpeta:',c); if(n===null) return;\n  const nom=n.trim(); if(!nom||nom===c) return;\n  data.vchCats=vchCats().map(x=>x===c?nom:x);\n  vchList().forEach(v=>{ if(v.cat===c) v.cat=nom; });\n  if(_vchCarpeta===c) _vchCarpeta=nom;\n  saveData(); renderVchFolders(); renderVouchers();\n  toast('Carpeta renombrada','ok');\n}\nfunction delCarpetaVch(c){\n  const n=vchList().filter(v=>v.cat===c).length;\n  if(!confirm('¿Eliminar la carpeta \"'+c+'\"?'+(n?' Sus '+n+' vouchers pasarán a \"Sin carpeta\" (no se borran).':''))) return;\n  data.vchCats=vchCats().filter(x=>x!==c);\n  vchList().forEach(v=>{ if(v.cat===c) v.cat=''; });\n  if(_vchCarpeta===c) _vchCarpeta='';\n  saveData(); renderVchFolders(); renderVouchers();\n  toast('Carpeta eliminada','ok');\n}\nfunction renderVchFolders(){\n  const bar=document.getElementById('vchFolderBar'); if(!bar) return;\n  const all=vchList().filter(v=>(v.fecha||'')>=VCH_DESDE+'-01');\n  const cats=vchAllCats();\n  const sinN=all.filter(v=>!v.cat).length;\n  let html='<div class=\"vch-folder'+(_vchCarpeta===''?' on':'')+'\" onclick=\"setVchCarpeta(\\'\\')\">Todos <span style=\"opacity:.65;font-weight:500\">'+all.length+'<\u002Fspan><\u002Fdiv>';\n  cats.forEach(c=>{\n    const n=all.filter(v=>v.cat===c).length;\n    html+='<div class=\"vch-folder'+(_vchCarpeta===c?' on':'')+'\" onclick=\"setVchCarpeta('+JSON.stringify(c).replace(/\"/g,'&quot;')+')\">'+\n      '<svg width=\"12\" height=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path d=\"M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z\"/><\u002Fsvg>'+\n      escH(c)+' <span style=\"opacity:.65;font-weight:500\">'+n+'<\u002Fspan>'+\n      (_vchCarpeta===c?'<span onclick=\"event.stopPropagation();renameCarpetaVch('+JSON.stringify(c).replace(/\"/g,'&quot;')+')\" title=\"Renombrar\" style=\"margin-left:3px;opacity:.7\">✎<\u002Fspan>'+\n        '<span onclick=\"event.stopPropagation();delCarpetaVch('+JSON.stringify(c).replace(/\"/g,'&quot;')+')\" title=\"Eliminar carpeta\" style=\"margin-left:1px;color:var(--red);opacity:.85\">×<\u002Fspan>':'')+\n    '<\u002Fdiv>';\n  });\n  if(sinN) html+='<div class=\"vch-folder'+(_vchCarpeta==='__sin'?' on':'')+'\" onclick=\"setVchCarpeta(\\'__sin\\')\">Sin carpeta <span style=\"opacity:.65;font-weight:500\">'+sinN+'<\u002Fspan><\u002Fdiv>';\n  html+='<div class=\"vch-folder\" style=\"border-style:dashed\" onclick=\"nuevaCarpetaVch()\">+ Carpeta<\u002Fdiv>';\n  bar.innerHTML=html;\n  const dl=document.getElementById('vchCatsList');\n  if(dl) dl.innerHTML=cats.map(c=>'<option value=\"'+escH(c)+'\"><\u002Foption>').join('');\n}\nfunction updateVchMonedaHint(){\n  const el=document.getElementById('vchMonedaHint'); if(!el) return;\n  const mon=document.getElementById('vchMoneda').value;\n  const m=parseFloat(document.getElementById('vchMonto').value)||0;\n  if(mon==='USD'&&m>0){ el.style.display='block'; el.textContent='= S/ '+f(m*getTc())+' (al tipo de cambio actual)'; }\n  else el.style.display='none';\n}\nfunction nuevoVch(file, dataUrl, tipo){\n  const fecha=file.lastModified?new Date(file.lastModified).toISOString().slice(0,10):new Date().toISOString().slice(0,10);\n  return {\n    id:'vch_'+Date.now().toString()+'_'+Math.round(Math.random()*999),\n    img:dataUrl,\n    tipo:tipo||'img',\n    nombre:tipo==='pdf'?(file.name||'documento.pdf'):'',\n    fecha: fecha.slice(0,7)<VCH_DESDE ? VCH_DESDE+'-01' : fecha,\n    monto:0, nota:'', moneda:'PEN',\n    cat:(_vchCarpeta&&_vchCarpeta!=='__sin')?_vchCarpeta:''\n  };\n}\nfunction onVoucherFiles(inp){\n  const files=[...(inp.files||[])];\n  if(!files.length) return;\n  let hechos=0;\n  const fin=()=>{\n    if(hechos!==files.length) return;\n    saveData(); buildVchMesFilter(); renderVchFolders(); renderVouchers();\n    const dest=(_vchCarpeta&&_vchCarpeta!=='__sin')?' en \"'+_vchCarpeta+'\"':'';\n    toast(hechos+(hechos===1?' archivo guardado':' archivos guardados')+dest,'ok');\n  };\n  files.forEach(file=>{\n    const esPdf = file.type==='application/pdf' || /\\.pdf$/i.test(file.name||'');\n    if(esPdf){\n      const rp=new FileReader();\n      rp.onload=ev=>{\n        if(String(ev.target.result).length>4.2e6){ hechos++; toast('“'+(file.name||'PDF')+'” es muy grande (máx ~3 MB)','err'); fin(); return; }\n        vchList().push(nuevoVch(file, ev.target.result, 'pdf'));\n        hechos++; fin();\n      };\n      rp.onerror=()=>{ hechos++; toast('No se pudo leer el PDF','err'); fin(); };\n      rp.readAsDataURL(file);\n      return;\n    }\n    const r=new FileReader();\n    r.onload=e=>{\n      const img=new Image();\n      img.onload=()=>{\n        const max=1100, s=Math.min(1,max/Math.max(img.width,img.height));\n        const c=document.createElement('canvas');\n        c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);\n        c.getContext('2d').drawImage(img,0,0,c.width,c.height);\n        vchList().push(nuevoVch(file, c.toDataURL('image/jpeg',0.7), 'img'));\n        hechos++; fin();\n      };\n      img.onerror=()=>{ hechos++; toast('No se pudo leer una imagen','err'); fin(); };\n      img.src=e.target.result;\n    };\n    r.readAsDataURL(file);\n  });\n  inp.value='';\n}\nfunction buildVchMesFilter(){\n  const s=document.getElementById('vchMes'); if(!s) return;\n  const cur=s.value;\n  const ms=[...new Set(vchList().map(v=>(v.fecha||'').slice(0,7)).filter(m=>m&&m>=VCH_DESDE))].sort().reverse();\n  s.innerHTML='<option value=\"\">Todos los meses<\u002Foption>'+ms.map(m=>{\n    const p=m.split('-');\n    return '<option value=\"'+m+'\"'+(cur===m?' selected':'')+'>'+MESES[parseInt(p[1])-1]+' '+p[0]+'<\u002Foption>';\n  }).join('');\n}\nfunction renderVouchers(){\n  const el=document.getElementById('vchList'); if(!el) return;\n  const mes=((document.getElementById('vchMes')||{}).value)||'';\n  const all=vchList().filter(v=>(v.fecha||'')>=VCH_DESDE+'-01');\n  const cnt=document.getElementById('vchCount');\n  if(cnt) cnt.textContent=String(all.length);\n  const vs=all.filter(v=>(!mes||(v.fecha||'').slice(0,7)===mes)&&\n                (_vchCarpeta===''||(_vchCarpeta==='__sin'?!v.cat:v.cat===_vchCarpeta)))\n              .slice().sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));\n  if(!vs.length){\n    const d=_vchCarpeta&&_vchCarpeta!=='__sin'?' en “'+escH(_vchCarpeta)+'”':(_vchCarpeta==='__sin'?' sin carpeta':'');\n    el.innerHTML='<div class=\"empty-tx\">Sin vouchers'+d+(mes?' en este mes':'')+'. Toca “Subir vouchers / PDF” (fotos o PDFs, varios a la vez).<\u002Fdiv>'; return;\n  }\n  const groups={};\n  vs.forEach(v=>{ const k=(v.fecha||'').slice(0,7); (groups[k]=groups[k]||[]).push(v); });\n  el.innerHTML=Object.keys(groups).sort().reverse().map(k=>{\n    const g=groups[k], p=k.split('-');\n    const totPen=g.filter(v=>v.moneda!=='USD').reduce((a,v)=>a+(parseFloat(v.monto)||0),0);\n    const totUsd=g.filter(v=>v.moneda==='USD').reduce((a,v)=>a+(parseFloat(v.monto)||0),0);\n    const totTxt=[totPen>0?'S/ '+f(totPen):'',totUsd>0?'$ '+f(totUsd):''].filter(Boolean).join(' + ');\n    return '<div class=\"vch-month\"><div class=\"vch-month-head\">'+\n      '<div class=\"vch-month-label\">'+MESES[parseInt(p[1])-1]+' '+p[0]+'<\u002Fdiv><div class=\"vch-month-line\"><\u002Fdiv>'+\n      '<div class=\"vch-month-sum\">'+g.length+' vouchers'+(totTxt?' · '+totTxt:'')+'<\u002Fdiv><\u002Fdiv>'+\n      '<div class=\"vch-grid\">'+g.map(v=>\n        '<div class=\"vch-card\" onclick=\"openVoucher(\\''+v.id+'\\')\">'+\n        (v.tipo==='pdf'\n          ? '<div style=\"height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;background:var(--surface2);padding:6px;text-align:center\">'+\n              '<svg width=\"26\" height=\"26\" fill=\"none\" stroke=\"var(--red)\" stroke-width=\"1.8\" viewBox=\"0 0 24 24\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"/><polyline points=\"14 2 14 8 20 8\"/><\u002Fsvg>'+\n              '<div style=\"font-size:9px;font-weight:700;color:var(--red);letter-spacing:.06em\">PDF<\u002Fdiv>'+\n              '<div style=\"font-size:8px;color:var(--text3);line-height:1.25;max-height:20px;overflow:hidden;word-break:break-word\">'+escH(v.nombre||'documento.pdf')+'<\u002Fdiv>'+\n            '<\u002Fdiv>'\n          : '<img src=\"'+v.img+'\" alt=\"Voucher '+escH(v.fecha)+'\" loading=\"lazy\">')+\n        '<div class=\"vch-cap\"><span>'+escH((v.fecha||'').slice(8)+'/'+(v.fecha||'').slice(5,7))+'<\u002Fspan>'+((parseFloat(v.monto)||0)>0?'<b'+(v.moneda==='USD'?' style=\"color:var(--yellow)\"':'')+'>'+vchSym(v)+f(v.monto)+'<\u002Fb>':'')+'<\u002Fdiv>'+\n        (_vchCarpeta===''&&v.cat?'<div style=\"padding:0 6px 5px;font-size:9px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">'+escH(v.cat)+'<\u002Fdiv>':'')+\n        '<\u002Fdiv>'\n      ).join('')+'<\u002Fdiv><\u002Fdiv>';\n  }).join('');\n}\nfunction openVoucher(id){\n  const v=vchList().find(x=>x.id===id); if(!v) return;\n  _vchId=id;\n  const im=document.getElementById('vchBigImg'), pw=document.getElementById('vchBigPdf');\n  if(v.tipo==='pdf'){\n    im.style.display='none';\n    im.removeAttribute('src');\n    pw.style.display='flex';\n    document.getElementById('vchPdfFrame').src=v.img;\n    const a=document.getElementById('vchPdfOpen');\n    a.href=v.img;\n    a.setAttribute('download', v.nombre||'voucher.pdf');\n  } else {\n    pw.style.display='none';\n    document.getElementById('vchPdfFrame').removeAttribute('src');\n    im.style.display='';\n    im.src=v.img;\n  }\n  document.getElementById('vchFecha').value=v.fecha||'';\n  document.getElementById('vchMonto').value=(parseFloat(v.monto)||0)||'';\n  document.getElementById('vchMoneda').value=v.moneda==='USD'?'USD':'PEN';\n  document.getElementById('vchCat').value=v.cat||'';\n  updateVchMonedaHint();\n  document.getElementById('vchNota').value=v.nota||'';\n  document.getElementById('vchLightbox').classList.add('open');\n}\nfunction closeVoucher(){\n  document.getElementById('vchLightbox').classList.remove('open');\n  const fr=document.getElementById('vchPdfFrame'); if(fr) fr.removeAttribute('src');\n}\nfunction saveVoucherInfo(){\n  const v=vchList().find(x=>x.id===_vchId); if(!v) return;\n  const fecha=document.getElementById('vchFecha').value;\n  v.fecha=fecha||v.fecha;\n  v.monto=parseFloat(document.getElementById('vchMonto').value)||0;\n  v.moneda=document.getElementById('vchMoneda').value==='USD'?'USD':'PEN';\n  const nc=document.getElementById('vchCat').value.trim();\n  v.cat=nc;\n  if(nc&&!vchAllCats().includes(nc)) vchCats().push(nc);\n  v.nota=document.getElementById('vchNota').value.trim();\n  saveData(); closeVoucher(); buildVchMesFilter(); renderVchFolders(); renderVouchers();\n  toast('Voucher actualizado','ok');\n}\nfunction deleteVoucher(){\n  if(!confirm('¿Eliminar este voucher?')) return;\n  data.vouchers=vchList().filter(x=>x.id!==_vchId);\n  saveData(); closeVoucher(); buildVchMesFilter(); renderVchFolders(); renderVouchers();\n  toast('Voucher eliminado','ok');\n}\n\n// ── CATÁLOGO Y VENTAS DE PRODUCTOS ───────────────────────────────────────────\nlet _prodTab='inversion', _catEditId=null, _catImg='', _ventaCart={}, _catStockPrev=0, _catColores=[];\n\nfunction catList(){\n  if(!Array.isArray(data.catalogo)) data.catalogo=[];\n  data.catalogo.forEach(p=>{\n    if(!Array.isArray(p.colores)){\n      p.colores = p.color ? [{color:p.color, stock:Math.max(0,parseInt(p.stock)||0)}] : [];\n    }\n    if(p.colores.length) p.stock=sumColores(p.colores);\n  });\n  let cambio=false;\n  if(!data.codigosV2){\n    data.codigosV2=true; cambio=true;\n    const auto=data.catalogo.filter(p=>!p.codigo||/^P-\\d{3}$/.test(p.codigo));\n    auto.forEach(p=>{ p.codigo=''; (p.colores||[]).forEach(c=>{ if(!c.man) c.codigo=''; }); });\n    auto.sort((a,b)=>(a.cat||'').localeCompare(b.cat||'')||(a.nombre||'').localeCompare(b.nombre||''))\n      .forEach(p=>{ p.codigo=nextProdCode(p.cat); });\n  }\n  data.catalogo.forEach(p=>{\n    if(!p.codigo){ p.codigo=nextProdCode(p.cat); cambio=true; }\n    const usados=[];\n    (p.colores||[]).forEach(c=>{\n      if(!c.codigo){ c.codigo=autoColorCode(p.codigo,c.color,usados); c.man=false; cambio=true; }\n      usados.push(c.codigo);\n    });\n  });\n  if(cambio) saveData();\n  return data.catalogo;\n}\nfunction normCod(s){ return String(s||'').trim().toUpperCase().replace(/\\s+/g,'-'); }\nfunction colorAbbr(color){\n  const s=String(color||'').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9 ]/g,'').trim();\n  if(!s) return 'COL';\n  const w=s.split(/\\s+/);\n  return w.length>1 ? (w[0].slice(0,3)+w[1].slice(0,1)) : w[0].slice(0,3);\n}\nfunction autoColorCode(base,color,usados){\n  const b=normCod(base)||'P';\n  let c=b+'-'+colorAbbr(color), n=2;\n  while((usados||[]).includes(c)) c=b+'-'+colorAbbr(color)+n++;\n  return c;\n}\nfunction catPrefix(cat){\n  const s=String(cat||'').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toUpperCase().replace(/[^A-Z]/g,'');\n  return s.charAt(0)||'P';\n}\nfunction nextProdCode(cat,exceptId){\n  const pre=catPrefix(cat);\n  const re=new RegExp('^'+pre+'-(\\\\d+)$');\n  let max=0;\n  (data.catalogo||[]).forEach(p=>{ if(p.id===exceptId) return; const m=re.exec(p.codigo||''); if(m) max=Math.max(max,parseInt(m[1])); });\n  return pre+'-'+String(max+1).padStart(3,'0');\n}\nfunction cmpCod(a,b){ return String(a.codigo||'').localeCompare(String(b.codigo||''),'es',{numeric:true})||(a.nombre||'').localeCompare(b.nombre||''); }\nlet _catCodMan=false;\nfunction onCatCategoria(v){\n  if(_catCodMan) return;\n  document.getElementById('catCodigo').value=nextProdCode(v,_catEditId);\n  refreshColorCodes();\n}\nfunction codigosTxt(p){ return [p.codigo||''].concat((p.colores||[]).map(c=>c.codigo||'')).join(' '); }\nfunction sumColores(cols){ return (cols||[]).reduce((a,c)=>a+Math.max(0,parseInt(c.stock)||0),0); }\nfunction tieneColores(p){ return Array.isArray(p.colores)&&p.colores.length>0; }\nfunction coloresTxt(p){ return tieneColores(p)?p.colores.map(c=>c.color).join(', '):(p.color||''); }\nfunction cartKey(id,color){ return color?id+'|'+color:id; }\nfunction parseKey(k){ const i=String(k).indexO )=>a==='__none__'?1:b==='__none__'?-1:a.localeCompare(b));\n    grid.innerHTML=canalHead+keys.map(k=>{\n      const ps=grupos[k];\n      const img=grpFoto('cat:'+k)||(ps.find(p=>p.img)||{}).img;\n      const und=ps.reduce((a,p)=>a+(parseInt(p.stock)||0),0);\n      const agot=ps.filter(p=>tieneColores(p)?p.colores.some(c=>(parseInt(c.stock)||0)===0):(parseInt(p.stock)||0)===0).length;\n      const nom=k==='__none__'?'Sin categoría':k;\n      return '<div class=\"cat-card\" style=\"cursor:pointer\" onclick=\"abrirCategoria(\\''+escH(k).replace(/'/g,'&#39;')+'\\')\">'+\n        '<div class=\"cat-photo\" style=\"position:relative\">'+(img?'<img src=\"'+img+'\" alt=\"'+escH(nom)+'\">':escH(nom))+fotoBtns('cat:'+k)+'<\u002Fdiv>'+\n        '<div class=\"cat-body\">'+\n          '<div class=\"cat-name\" style=\"font-size:15px\">'+escH(nom)+'<\u002Fdiv>'+\n          '<div style=\"font-size:11px;color:var(--text2)\">'+ps.length+' producto'+(ps.length>1?'s':'')+' · '+und+' und.<\u002Fdiv>'+\n          (agot?'<span class=\"cat-chip\" style=\"background:var(--red-bg);border-color:var(--red-dim);color:var(--red)\">'+agot+' con agotados<\u002Fspan>':'')+\n        '<\u002Fdiv><\u002Fdiv>';\n    }).join('');\n    return;\n  }\n  let vis=list.filter(p=>(!cur||(cur==='__none__'?!p.cat:p.cat===cur))&&(!q||(p.nombre||'').toLowerCase().includes(q)||(p.cat||'').toLowerCase().includes(q)||coloresTxt(p).toLowerCase().includes(q)||codigosTxt(p).toLowerCase().includes(q)));\n  const vend=vendidosMap();\n  vis.sort(cmpCod);\n  if(!vis.length){\n    grid.innerHTML='<div class=\"empty-inv\" style=\"grid-column:1/-1\">'+(list.length?'Sin resultados.':'Aún no tienes productos en '+(canalVista()==='online'?'Online':'Tienda')+'. Toca “Agregar producto” para registrar el primero con su foto.')+'<\u002Fdiv>';\n    return;\n  }\n  grid.innerHTML=vis.map(p=>{\n    const st=parseInt(p.stock)||0;\n    const v=vend[p.id]||0;\n    const cst=parseFloat(p.costo)||0;\n    const gan=(parseFloat(p.precio)||0)-cs t(\\''+p.id+'\\')\">+ Stock<\u002Fbutton>'+\n          '<button class=\"btn btn-sm\" onclick=\"openProdModal(\\''+p.id+'\\')\">Editar<\u002Fbutton>'+\n        '<\u002Fdiv>'+\n      '<\u002Fdiv><\u002Fdiv>';\n  }).join('');\n  if(cur&&!q){\n    const nom=cur==='__none__'?'Sin categoría':cur;\n    grid.insertAdjacentHTML('afterbegin','<div style=\"grid-column:1/-1;display:flex;align-items:center;gap:10px;margin-bottom:2px\"><button class=\"btn btn-sm\" onclick=\"abrirCategoria(\\'\\')\">← Categorías<\u002Fbutton><span style=\"font-size:15px;font-weight:700\"><span style=\"color:var(--prod)\">'+(canalVista()==='online'?'Online':'Tienda')+'<\u002Fspan> › '+escH(nom)+'<\u002Fspan><span style=\"font-size:12px;color:var(--text2)\">'+vis.length+' producto'+(vis.length>1?'s':'')+'<\u002Fspan><\u002Fdiv>');\n  }\n}\n\nfunction openProdModal(id){\n  _catEditId=id||null;\n  const p=id?catList().find(x=>x.id===id):null;\n  document.getElementById('prodModalTitle').textContent=p?'Editar producto':'Nuevo producto';\n  document.getElementById('catBtnDelete').style.display=p?'':'none';\n  document.getElementById('catNombre').value=p?(p.nombre||''):'';\n  document.getElementById('catCodigo').value=p?(p.codigo||''):nextProdCode('');\n  _catCodMan=!!p;\n  document.getElementById('catCategoria').value=p?(p.cat||''):'';\n  document.getElementById('catCanal').value=p?canalDe(p):canalVista();\n  _catColores=p&&Array.isArray(p.colores)?p.colores.map(c=>({color:c.color||'',codigo:c.codigo||'',man:!!c.man,stock:Math.max(0,parseInt(c.stock)||0)})):[];\n  renderCatColores();\n  document.getElementById('catPrecio').value=p?(p.precio||''):'';\n  document.getElementById('catCosto').value=p?(p.costo||''):'';\n  document.getElementById('catStock').value=p?(p.stock||0):'';\n  document.getElementById('catNota').value=p?(p.nota||''):'';\n  fillProveedores('catProveedor', p?(p.proveedor||''):'');\n  _catImg=p?(p.img||''):'';\n  document.getElementById('catFotoInput').value='';\n  _catStockPrev=p?(parseInt(p.stock)||0):0;\n  document.getElementById('catInvCheck').checked=true;\n  paintCatFoto();\n  updateCatGanancia();\n  document.getElementById('prodModalBg').classList.add('open');\n}\nfunction closeProdModal(){ document.getElementById('prodModalBg').classList.remove('open'); }\nfunction renderCatColores(){\n  const box=document.getElementById('catColoresBox'); if(!box) return;\n  box.innerHTML=_catColores.map((c,i)=>\n    '<div style=\"display:flex;gap:6px;align-items:center\">'+\n      '<input type=\"text\" list=\"catColoresList\" value=\"'+escH(c.color)+'\" placeholder=\"Color\" style=\"flex:1;min-width:0\" oninput=\"setCatColor('+i+',this.value)\">'+\n      '<input type=\"text\" id=\"catColCod'+i+'\" value=\"'+escH(c.codigo||'')+'\" placeholder=\"Código\" style=\"width:112px;font-family:ui-monospace,Menlo,monospace;font-size:12px;text-transform:uppercase\" oninput=\"setCatColorCode('+i+',this.value)\" title=\"Código de este color\">'+\n      '<input type=\"number\" min=\"0\" step=\"1\" value=\"'+(c.stock||0)+'\" placeholder=\"Stock\" style=\"width:84px\" oninput=\"setCatColorStock('+i+',this.value)\" title=\"Stock de este color\">'+\n      '<button class=\"btn btn-red btn-sm\" style=\"padding:0 10px\" onclick=\"delCatColor('+i+')\" title=\"Quitar color\">×<\u002Fbutton>'+\n    '<\u002Fdiv>').join('')||'<div style=\"font-size:12px;color:var(--text3)\">Sin colores — se usa el stock general.<\u002Fdiv>';\n  syncCatStockField();\n}\nfunction addCatColor(){ _catColores.push({color:'',codigo:'',man:false,stock:0}); renderCatColores(); }\nfunction delCatColor(i){ _catColores.splice(i,1); renderCatColores(); }\nfunction setCatColor(i,v){ if(_catColores[i]){ _catColores[i].color=v; if(!_catColores[i].man) refreshColorCodes(); } syncCatStockField(); }\nfunction setCatColorCode(i,v){ if(_catColores[i]){ _catColores[i].codigo=normCod(v); _catColores[i].man=!!normCod(v); if(!_catColores[i].man) refreshColorCodes(); } }\nfunction onCatCodigo(){ refreshColorCodes(); }\nfunction refreshColorCodes(){\n  const base=normCod(document.getElementById('catCodigo').value);\n  const usados=_catColores.filter(c=>c.man).map(c=>c.codigo);\n  _catColores.forEach((c,i)=>{\n    if(c.man) return;\n    c.codigo=c.color.trim()?autoColorCode(base,c.color,usados):'';\n    usados.push(c.codigo);\n    const el=document.getElementById('catColCod'+i); if(el) el.value=c.codigo;\n  });\n}\nfunction setCatColorStock(i,v){ if(_catColores[i]) _catColores[i].stock=Math.max(0,parseInt(v)||0); syncCatStockField(); }\nfunction syncCatStockField(){\n  const inp=document.getElementById('catStock'), lab=document.getElementById('catStockLabel');\n  if(!inp) return;\n  if(_catColores.length){\n    inp.value=sumColores(_catColores);\n    inp.readOnly=true; inp.style.opacity='.6';\n    if(lab) lab.textContent='Stock total (suma de colores)';\n  } else {\n    inp.readOnly=false; inp.style.opacity='1';\n    if(lab) lab.textContent='Stock (0 = sin control)';\n  }\n  updateCatGanancia();\n}\nfunction paintCatFoto(){\n  const w=document.getElementById('catFotoWrap');\n  if(_catImg){ document.getElementById('catFotoPreview').src=_catImg; w.style.display='flex'; }\n  else w.style.display='none';\n}\nfunction quitarCatFoto(){ _catImg=''; document.getElementById('catFotoInput').value=''; paintCatFoto(); }\nfunction onCatFoto(inp){\n  const file=inp.files&&inp.files[0]; if(!file) return;\n  const r=new FileReader();\n  r.onload=e=>{\n    const img=new Image();\n    img.onload=()=>{\n      const max=560, s=Math.min(1,max/Math.max(img.width,img.height));\n      const c=document.createElement('canvas');\n      c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);\n      c.getContext('2d').drawImage(img,0,0,c.width,c.height);\n      _catImg=c.toDataURL('image/jpeg',0.72);\n      paintCatFoto();\n    };\n    img.onerror=()=>toast('No se pudo leer la imagen','err');\n    img.src=e.target.result;\n  };\n  r.readAsDataURL(file);\n}\nfunction revertirInversionEstimado(prodId, quitadas, costoRef){\n  if(!Array.isArray(data.productos)) return 0;\n  const compras=data.productos\n    .filter(t=>t.catalogoId===prodId && t.tipo==='deposito' && (parseFloat(t.monto)||0)>0)\n    .sort((a,b)=>String(b.fecha||'').localeCompare(String(a.fecha||''))||String(b.id||'').localeCompare(String(a.id||'')));\n  let falta=quitadas, tot=0;\n  for(const t of compras){\n    if(falta<=0) break;\n    const unit=(parseFloat(t.unitCosto)||0) || costoRef || 0;\n    const unds=Math.max(1, parseInt(t.unds)||(unit>0?Math.round((parseFloat(t.monto)||0)/unit):1));\n    if(unds<=falta){ tot+=parseFloat(t.monto)||0; falta-=unds; }\n    else { tot+=unit*falta; falta=0; }\n  }\n  return parseFloat(tot.toFixed(2));\n}\nfunction revertirInversion(prodId, quitadas, costoRef){\n  if(!Array.isArray(data.productos)) return 0;\n  const compras=data.productos\n    .filter(t=>t.catalogoId===prodId && t.tipo==='deposito' && (parseFloat(t.monto)||0)>0)\n    .sort((a,b)=>String(b.fecha||'').localeCompare(String(a.fecha||''))||String(b.id||'').localeCompare(String(a.id||'')));\n  if(!compras.length) return 0;\n  let falta=quitadas, devuelto=0;\n  const borrar=[];\n  for(const t of compras){\n    if(falta<=0) break;\n    const unit=(parseFloat(t.unitCosto)||0) || costoRef || 0;\n    const unds=Math.max(1, parseInt(t.unds)||(unit>0?Math.round((parseFloat(t.monto)||0)/unit):1));\n    if(unds<=falta){\n      devuelto+=parseFloat(t.monto)||0; falta-=unds; borrar.push(t.id);\n    } else {\n      const quitar=parseFloat((unit*falta).toFixed(2));\n      t.unds=unds-falta;\n      t.monto=parseFloat(Math.max(0,(parseFloat(t.monto)||0)-quitar).toFixed(2));\n      t.desc='Compra: '+t.unds+'× '+String(t.desc||'').replace(/^Compra: \\d+× /,'');\n      devuelto+=quitar; falta=0;\n    }\n  }\n  if(borrar.length) data.productos=data.productos.filter(t=>!borrar.includes(t.id));\n  return parseFloat(devuelto.toFixed(2));\n}\nfunction openLimpiarInv(){\n  renderLimpiarInv();\n  document.getElementById('limpiarInvBg').classList.add('open');\n}\nfunction closeLimpiarInv(){ document.getElementById('limpiarInvBg').classList.remove('open'); }\nfunction renderLimpiarInv(){\n  const el=document.getElementById('limpiarInvList'); if(!el) return;\n  const movs=(data.productos||[]).slice().sort((a,b)=>String(b.fecha||'').localeCompare(String(a.fecha||'')));\n  if(!movs.length){ el.innerHTML='<div class=\"empty-tx\">No hay movimientos de inversión.<\u002Fdiv>'; return; }\n  el.innerHTML=movs.map(m=>{\n    const dep=m.tipo==='deposito';\n    const prod=(data.catalogo||[]).find(p=>p.id===m.catalogoId);\n    const huerf=m.catalogoId&&!prod;\n    return '<div style=\"display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid '+(huerf?'var(--red-dim)':'var(--border2)')+';border-radius:var(--radius-sm);background:var(--surface2)\">'+\n      '<div style=\"flex:1;min-width:0\">'+\n        '<div style=\"font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">'+escH(m.desc||'(sin descripción)')+'<\u002Fdiv>'+\n        '<div style=\"font-size:10px;color:var(--text3)\">'+escH(m.fecha||'')+(m.proveedor?' · '+escH(m.proveedor):'')+(huerf?' · <span style=\"color:var(--red)\">producto eliminado<\u002Fspan>':'')+'<\u002Fdiv>'+\n      '<\u002Fdiv>'+\n      '<div style=\"font-size:12px;font-weight:700;color:'+(dep?'var(--prod)':'var(--green)')+';white-space:nowrap\">'+(dep?'+':'−')+'S/ '+f(parseFloat(m.monto)||0)+'<\u002Fdiv>'+\n      '<button class=\"btn btn-red btn-sm\" style=\"padding:0 9px\" onclick=\"delMovInv('+JSON.stringify(String(m.id)).replace(/\"/g,'&quot;')+')\" title=\"Borrar movimiento\">✕<\u002Fbutton>'+\n    '<\u002Fdiv>';\n  }).join('');\n}\nfunction delMovInv(id){\n  const m=(data.productos||[]).find(x=>String(x.id)===String(id)); if(!m) return;\n  if(!confirm('¿Borrar “'+(m.desc||'movimiento')+'” de S/ '+f(parseFloat(m.monto)||0)+'?\\n\\nNo cambia el stock del producto.')) return;\n  data.productos=(data.productos||[]).filter(x=>String(x.id)!==String(id));\n  saveData(); renderLimpiarInv(); renderCatalogo();\n  if(typeof renderProductosSection==='function') renderProductosSection();\n  if(typeof renderResumen==='function') renderResumen();\n  toast('Movimiento borrado','ok');\n}\nfunction catCompraPendiente(){\n  const costo=parseFloat(document.getElementById('catCosto').value)||0;\n  const stock=Math.max(0,parseInt(document.getElementById('catStock').value)||0);\n  const nuevas=Math.max(0,stock-_catStockPrev);\n  return {costo, nuevas, monto:parseFloat((costo*nuevas).toFixed(2))};\n}\nfunction updateCatGanancia(){\n  const costo=parseFloat(document.getElementById('catCosto').value)||0;\n  const precio=parseFloat(document.getElementById('catPrecio').value)||0;\n  const box=document.getElementById('catGananciaBox');\n  if(box){\n    if(precio<=0){ box.innerHTML='<span style=\"color:var(--text3)\">Pon el precio de venta para ver la ganancia.<\u002Fspan>'; }\n    else if(costo<=0){ box.innerHTML='<b style=\"color:var(--green)\">Ganancia por unidad: S/ '+f(precio)+'<\u002Fb> — sin costo registrado, todo es ganancia.'; }\n    else {\n      const g=precio-costo, m=precio?g/precio*100:0;\n      box.innerHTML='Ganancia por unidad: <b style=\"color:'+(g>=0?'var(--green)':'var(--red)')+'\">S/ '+f(g)+'<\u002Fb> · Margen: <b style=\"color:'+(g>=0?'var(--green)':'var(--red)')+'\">'+m.toFixed(0)+'%<\u002Fb>';\n    }\n  }\n  const c=catCompraPendiente();\n  const wrap=document.getElementById('catInvWrap');\n  if(wrap){\n    if(c.monto>0){\n      wrap.style.display='flex';\n      document.getElementById('catInvLabel').textContent='Registrar en Inversión la compra de '+c.nuevas+' und. × S/ '+f(c.costo)+' = S/ '+f(c.monto);\n    } else wrap.style.display='none';\n  }\n}\nfunction saveCat(){\n  const nombre=document.getElementById('catNombre').value.trim();\n  const precio=parseFloat(document.getElementById('catPrecio').value)||0;\n  const costo=parseFloat(document.getElementById('catCosto').value)||0;\n  if(!nombre){ toast('Ponle un nombre al producto','err'); return; }\n  refreshColorCodes();\n  const codigo=normCod(document.getElementById('catCodigo').value);\n  if(!codigo){ toast('Ponle un código al producto','err'); return; }\n  const otros=catList().filter(x=>x.id!==_catEditId);\n  const usadosOtros=new Set(otros.flatMap(x=>[x.codigo].concat((x.colores||[]).map(c=>c.codigo))).filter(Boolean));\n  if(usadosOtros.has(codigo)){ toast('El código '+codigo+' ya lo usa otro producto','err'); return; }\n  const colCods=_catColores.filter(c=>(c.color||'').trim()).map(c=>c.codigo);\n  const dupCol=colCods.find((c,ix)=>c&&(usadosOtros.has(c)||colCods.indexOf(c)!==ix||c===codigo));\n  if(dupCol){ toast('El código de color '+dupCol+' está repetido','err'); return; }\n  if(precio<=0){ toast('Agrega el precio de venta','err'); return; }\n  const compra=catCompraPendiente();\n  const regInv=compra.monto>0 && document.getElementById('catInvCheck').checked;\n  const p={\n    id:_catEditId||('cat_'+Date.now().toString()),\n    codigo, nombre, cat:document.getElementById('catCategoria').value.trim(),\n    canal:(v=>v==='online'||v==='ambos'?v:'tienda')(document.getElementById('catCanal').value),\n    colores:_catColores.map(c=>({color:(c.color||'').trim(),codigo:c.codigo||'',man:!!c.man,stock:Math.max(0,parseInt(c.stock)||0)})).filter(c=>c.color),\n    color:'',\n    precio, costo, stock:0,\n    proveedor:(document.getElementById('catProveedor').value==='__new__'?'':document.getElementById('catProveedor').value),\n    nota:document.getElementById('catNota').value.trim(), img:_catImg\n  };\n  p.stock = p.colores.length ? sumColores(p.colores) : Math.max(0,parseInt(document.getElementById('catStock').value)||0);\n  const list=catList();\n  const i=list.findIndex(x=>x.id===p.id);\n  const era=!!_catEditId;\n  if(i>=0) list[i]=p; else list.push(p);\n  let devuelto=0;\n  const quitadas=Math.max(0,_catStockPrev-p.stock);\n  if(era && quitadas>0){\n    const est=revertirInversionEstimado(p.id, quitadas, parseFloat(p.costo)||0);\n    if(est>0 && confirm('Quitaste '+quitadas+' und. de stock.\\n\\n¿Descontar también S/ '+f(est)+' de la Inversión (compras de este producto)?\\n\\nAceptar = sí, descontar.  Cancelar = dejar la inversión igual.')){\n      devuelto=revertirInversion(p.id, quitadas, parseFloat(p.costo)||0);\n    }\n  }\n  if(regInv){\n    if(!Array.isArray(data.productos)) data.productos=[];\n    data.productos.push({\n      id:'compra_'+p.id+'_'+Date.now().toString(),\n      tipo:'deposito',\n      desc:'Compra: '+compra.nuevas+'× '+nombre,\n      monto:compra.monto,\n      unds:compra.nuevas, unitCosto:compra.costo,\n      fecha:new Date().toISOString().slice(0,10),\n      proveedor:p.proveedor||'',\n      nota:'Desde Catálogo · S/ '+f(compra.costo)+' c/u',\n      catalogoId:p.id\n    });\n  }\n  saveData(); closeProdModal(); renderCatalogo();\n  if(typeof renderProductosSection==='function') renderProductosSection();\n  if(typeof renderResumen==='function') renderResumen();\n  toast(regInv ? 'Guardado · S/ '+f(compra.monto)+' a Inversión'\n       : (devuelto>0 ? 'Guardado · −S/ '+f(devuelto)+' de Inversión'\n       : (era?'Producto actualizado':'Producto agregado')),'ok');\n}\nfunction deleteCat(){\n  if(!confirm('¿Eliminar este producto del catálogo? Las ventas ya registradas se mantienen.')) return;\n  const id=_catEditId;\n  const inv=Array.isArray(data.productos)?data.productos.filter(t=>t.catalogoId===id&&t.tipo==='deposito'):[];\n  const totInv=inv.reduce((a,t)=>a+(parseFloat(t.monto)||0),0);\n  let quit=0;\n  if(totInv>0 && confirm('Este producto tiene S/ '+f(totInv)+' registrados en Inversión.\\n\\n¿Eliminar también esos movimientos?\\n\\nAceptar = sí.  Cancelar = mantenerlos.')){\n    data.productos=data.productos.filter(t=>!(t.catalogoId===id&&t.tipo==='deposito'));\n    quit=totInv;\n  }\n  data.catalogo=catList().filter(x=>x.id!==id);\n  saveData(); closeProdModal(); renderCatalogo();\n  if(typeof renderProductosSection==='function') renderProductosSection();\n  if(typeof renderResumen==='function') renderResumen();\n  toast('Producto eliminado'+(quit>0?' · −S/ '+f(quit)+' de Inversión':''),'ok');\n}\n\nconst PROVEEDORES_BASE=['Sumbex','Temu','Ala','Roma','Red Car'];\nfunction provList(){\n  if(!Array.isArray(data.proveedores)||!data.proveedores.length) data.proveedores=PROVEEDORES_BASE.slice();\n  return data.proveedores;\n}\nfunction fillProveedores(selId, valor){\n  const s=document.getElementById(selId); if(!s) return;\n  const usados=[...new Set((data.productos||[]).map(m=>m.proveedor).filter(Boolean))];\n  const list=[...new Set(provList().concat(usados))].sort((a,b)=>a.localeCompare(b));\n  data.proveedores=[...new Set(provList().concat(usados))];\n  s.innerHTML='<option value=\"\">Sin proveedor<\u002Foption>'+\n    list.map(p=>'<option'+(p===valor?' selected':'')+'>'+escH(p)+'<\u002Foption>').join('')+\n    '<option value=\"__new__\">＋ Agregar proveedor...<\u002Foption>';\n  s.value=valor&&list.includes(valor)?valor:'';\n}\nfunction onProveedorChange(sel){\n  if(sel.value!=='__new__') return;\n  const nombre=(prompt('Nombre del nuevo proveedor:')||'').trim();\n  if(!nombre){ sel.value=''; return; }\n  const list=provList();\n  const ya=list.find(p=>p.toLowerCase()===nombre.toLowerCase());\n  if(!ya) list.push(nombre);\n  saveData();\n  fillProveedores(sel.id, ya||nombre);\n  toast(ya?'Ese proveedor ya existía':'Proveedor \"'+nombre+'\" agregado','ok');\n}\n\nfunction openCierreDia(){\n  document.getElementById('cierreFecha').value=new Date().toISOString().slice(0,10);\n  renderCierreDia();\n  document.getElementById('cierreModalBg').classList.add('open');\n}\nfunction closeCierreDia(){ document.getElementById('cierreModalBg').classList.remove('open'); }\nfunction renderCierreDia(){\n  const d=document.getElementById('cierreFecha').value;\n  const el=document.getElementById('cierreContent'); if(!el) return;\n  const vs=ventasList().filter(v=>v.fecha===d);\n  const total=vs.reduce((a,v)=>a+(parseFloat(v.total)||0),0);\n  const gan=vs.reduce((a,v)=>a+(v.items||[]).reduce((x,i)=>x+((parseFloat(i.precio)||0)-(parseFloat(i.costo)||0))*i.qty,0),0);\n  const uds=vs.reduce((a,v)=>a+(v.items||[]).reduce((x,i)=>x+i.qty,0),0);\n  const txD=(data.transactions||[]).filter(t=>t.fecha===d);\n  const ingD=txD.filter(t=>t.tipo==='ingreso'&&!t.vaAHapi).reduce((a,t)=>a+(parseFloat(t.monto)||0),0);\n  const egrD=txD.filter(t=>t.tipo==='egreso').reduce((a,t)=>a+(parseFloat(t.monto)||0),0);\n  const pagos={}; vs.forEach(v=>{ const k=v.pago||'Efectivo'; pagos[k]=(pagos[k]||0)+(parseFloat(v.total)||0); });\n  const prods={}; vs.forEach(v=>(v.items||[]).forEach(i=>{ prods[i.nombre]=(prods[i.nombre]||0)+i.qty; }));\n  const top=Object.entries(prods).sort((a,b)=>b[1]-a[1])[0];\n  const card=(l,v,c,bg,bd)=>'<div class=\"inv-sum-card\" style=\"background:'+bg+';border:1px solid '+bd+'\"><div class=\"inv-sum-label\" style=\"color:'+c+'\">'+l+'<\u002Fdiv><div class=\"inv-sum-val\" style=\"color:'+c+'\">'+v+'<\u002Fdiv><\u002Fdiv>';\n  const fila=(l,v,c)=>'<div style=\"display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid var(--border)\"><span style=\"color:var(--text2)\">'+l+'<\u002Fspan><span style=\"font-weight:600'+(c?';color:'+c:'')+'\">'+v+'<\u002Fspan><\u002Fdiv>';\n  let html='<div style=\"text-align:center;padding:6px 0 12px\"><div style=\"font-size:32px;font-weight:700;color:var(--green);line-height:1.1\">S/ '+f(total)+'<\u002Fdiv><div style=\"font-size:12px;color:var(--text2)\">vendido en productos<\u002Fdiv><\u002Fdiv>';\n  html+='<div class=\"inv-summary\" style=\"grid-template-columns:repeat(3,1fr);margin-bottom:12px\">'+\n    card('Ganancia','S/ '+f(gan),gan>=0?'var(--green)':'var(--red)',gan>=0?'var(--green-bg)':'var(--red-bg)',gan>=0?'var(--green-dim)':'var(--red-dim)')+\n    card('Ventas',String(vs.length),'var(--prod)','var(--prod-bg)','var(--prod-dim)')+\n    card('Unidades',String(uds),'var(--yellow)','var(--yellow-bg)','var(--yellow-dim)')+'<\u002Fdiv>';\n  if(top) html+=fila('⭐ Producto estrella',escH(top[0])+' ('+top[1]+' und.)');\n  if(Object.keys(pagos).length){\n    html+='<div style=\"font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);margin:12px 0 4px\">Por método de pago<\u002Fdiv>';\n    html+=Object.entries(pagos).sort((a,b)=>b[1]-a[1]).map(p=>fila(escH(p[0]),'S/ '+f(p[1]),'var(--green)')).join('');\n  }\n  html+='<div style=\"font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);margin:12px 0 4px\">Movimientos del día<\u002Fdiv>';\n  html+=fila('Ingresos','S/ '+f(ingD),'var(--green)')+fila('Egresos','S/ '+f(egrD),'var(--red)')+\n        fila('Neto del día','S/ '+f(ingD-egrD),(ingD-egrD)>=0?'var(--green)':'var(--red)');\n  if(!vs.length&&!txD.length) html='<div class=\"empty-tx\">Sin movimientos registrados este día.<\u002Fdiv>';\n  el.innerHTML=html;\n}\n\nlet _stockId=null, _stockUlt=0;\nfunction openStockCat(id){\n  const p=catList().find(x=>x.id===id); if(!p) return;\n  _stockId=id;\n  _stockUlt=parseFloat(p.costo)||0;\n  document.getElementById('stockProdName').textContent=p.nombre+(p.cat?' · '+p.cat:'')+' — ahora '+(parseInt(p.stock)||0)+' und.';\n  const cw=document.getElementById('stockColorWrap'), cs=document.getElementById('stockColor');\n  if(tieneColores(p)){\n    cs.innerHTML=p.colores.map(c=>'<option value=\"'+escH(c.color)+'\">'+escH(c.color)+' (ahora '+(parseInt(c.stock)||0)+')<\u002Foption>').join('');\n    cw.style.display='';\n  } else { cs.innerHTML=''; cw.style.display='none'; }\n  document.getElementById('stockQty').value=1;\n  document.getElementById('stockCosto').value=_stockUlt||'';\n  document.getElementById('stockFecha').value=new Date().toISOString().slice(0,10);\n  fillProveedores('stockProveedor', p.proveedor||'');\n  const b=document.getElementById('stockUltCosto');\n  if(_stockUlt>0){ b.style.display='inline-flex'; b.textContent='Mismo costo de antes (S/ '+f(_stockUlt)+')'; } else b.style.display='none';\n  updateStockPreviewCat();\n  document.getElementById('stockModalBg').classList.add('open');\n}\nfunction closeStockCat(){ document.getElementById('stockModalBg').classList.remove('open'); }\nfunction setStockCosto(v){ document.getElementById('stockCosto').value=v; updateStockPreviewCat(); }\nfunction updateStockPreviewCat(){\n  const p=catList().find(x=>x.id===_stockId); if(!p) return;\n  const qty=Math.max(0,parseInt(document.getElementById('stockQty').value)||0);\n  const unit=Math.max(0,parseFloat(document.getElementById('stockCosto').value)||0);\n  const colSel=tieneColores(p)?document.getElementById('stockColor').value:'';\n  const stAnt=parseInt(p.stock)||0, cAnt=parseFloat(p.costo)||0;\n  const stNue=stAnt+qty;\n  const cNue=stNue?((stAnt*cAnt)+(qty*unit))/stNue:unit;\n  const precio=parseFloat(p.precio)||0;\n  const gan=precio-cNue;\n  document.getElementById('stockPreview').innerHTML=\n    (colSel?'Color <b style=\"color:var(--prod)\">'+escH(colSel)+'<\u002Fb>: '+varStock(p,colSel)+' → <b style=\"color:var(--prod)\">'+(varStock(p,colSel)+qty)+' und.<\u002Fb><br>':'')+\n    'Stock total: <b style=\"color:var(--text)\">'+stAnt+'<\u002Fb> → <b style=\"color:var(--prod)\">'+stNue+' und.<\u002Fb><br>'+\n    'Costo promedio: S/ '+f(cAnt)+' → <b style=\"color:var(--text)\">S/ '+f(cNue)+'<\u002Fb><br>'+\n    (unit>0?'Inversión de esta compra: <b style=\"color:var(--prod)\">S/ '+f(qty*unit)+'<\u002Fb>':'<span style=\"color:var(--green)\">Sin costo — todo lo que vendas es ganancia<\u002Fspan>')+\n    (precio>0?'<br>Ganancia por unidad: <b style=\"color:'+(gan>=0?'var(--green)':'var(--red)')+'\">S/ '+f(gan)+'<\u002Fb>':'');\n}\nfunction saveStockCat(){\n  const p=catList().find(x=>x.id===_stockId); if(!p) return;\n  const qty=Math.max(0,parseInt(document.getElementById('stockQty').value)||0);\n  const unit=Math.max(0,parseFloat(document.getElementById('stockCosto').value)||0);\n  const fecha=document.getElementById('stockFecha').value||new Date().toISOString().slice(0,10);\n  if(!qty){ toast('Indica cuántas unidades entran','err'); return; }\n  const colSel=tieneColores(p)?document.getElementById('stockColor').value:'';\n  if(tieneColores(p)&&!colSel){ toast('Elige el color que entra','err'); return; }\n  const stAnt=parseInt(p.stock)||0, cAnt=parseFloat(p.costo)||0;\n  const stNue=stAnt+qty;\n  p.costo=parseFloat((stNue?((stAnt*cAnt)+(qty*unit))/stNue:unit).toFixed(2));\n  if(colSel) addVarStock(p,colSel,qty); else p.stock=stNue;\n  if(unit>0){\n    if(!Array.isArray(data.productos)) data.productos=[];\n    data.productos.push({\n      id:'compra_'+p.id+'_'+Date.now().toString(),\n      tipo:'deposito',\n      desc:'Compra: '+qty+'× '+p.nombre+(colSel?' ('+colSel+')':''),\n      monto:parseFloat((qty*unit).toFixed(2)),\n      unds:qty, unitCosto:unit,\n      fecha,\n      proveedor:(document.getElementById('stockProveedor').value==='__new__'?'':document.getElementById('stockProveedor').value),\n      nota:'Desde Catálogo · S/ '+f(unit)+' c/u',\n      catalogoId:p.id\n    });\n  }\n  saveData(); closeStockCat(); renderCatalogo();\n  if(typeof renderProductosSection==='function') renderProductosSection();\n  if(typeof renderResumen==='function') renderResumen();\n  toast((unit>0?'+'+qty+' und. · S/ '+f(qty*unit)+' de inversión':'+'+qty+' und. sin costo')+(colSel?' · '+colSel:''),'ok');\n}\n\nfunction nuevaVentaDesdeFab(){\n  if(!catList().length){ toast('Primero agrega productos en el Catálogo','err'); switchTab('productos'); return; }\n  switchTab('productos');\n  openVentaModal();\n}\n\nfunction ventaRapida(id){\n  openVentaModal();\n  const p=catList().find(x=>x.id===id);\n  if(p) document.getElementById('ventaCanal').value=canalDe(p)==='ambos'?canalVista():canalDe(p);\n  syncVentaReponer();\n  if(p&&tieneColores(p)){\n    if(p.colores.length===1) ventaQty(cartKey(id,p.colores[0].color),1);\n    else { document.getElementById('ventaBuscar').value=p.nombre; renderVentaPicker(); toast('Elige el color a vender','ok'); }\n    return;\n  }\n  ventaQty(id,1);\n}\nfunction openVentaModal(){\n  if(!catList().length){ toast('Primero agrega productos al catálogo','err'); return; }\n  _ventaCart={};\n  document.getElementById('ventaFecha').value=new Date().toISOString().slice(0,10);\n  document.getElementById('ventaPago').value='Efectivo';\n  document.getElementById('ventaCanal').value=canalVista();\n  document.getElementById('ventaReponer').checked=true; syncVentaReponer();\n  document.getElementById('ventaNota').value='';\n  document.getElementById('ventaBuscar').value='';\n  document.getElementById('ventaIngreso').checked=true;\n  renderVentaPicker(); updateVentaTotal();\n  document.getElementById('ventaModalBg').classList.add('open');\n}\nfunction closeVentaModal(){ document.getElementById('ventaModalBg').classList.remove('open'); }\n\nfunction ventaQty(key,d){\n  const k=parseKey(key);\n  const p=catList().find(x=>x.id===k.id); if(!p) return;\n  const cur=_ventaCart[key]?_ventaCart[key].qty:0;\n  const max=varStock(p,k.color);\n  let next=cur+d;\n  if(next<0) next=0;\n  if(max>0&&next>max){ next=max; toast('Solo hay '+max+' en stock'+(k.color?' de '+k.color:''),'err'); }\n  if(next===0) delete _ventaCart[key];\n  else _ventaCart[key]={qty:next, precio:_ventaCart[key]?_ventaCart[key].precio:(parseFloat(p.precio)||0)};\n  renderVentaPicker(); updateVentaTotal();\n}\nfunction setVentaPrecio(id,val){\n  if(!_ventaCart[id]) return;\n  _ventaCart[id].precio=parseFloat(val)||0;\n  updateVentaTotal();\n}\nfunction renderVentaPicker(){\n  const el=document.getElementById('ventaPicker'); if(!el) return;\n  const q=((document.getElementById('ventaBuscar')||{}).value||'').toLowerCase().trim();\n  let list=catList().filter(p=>!q||(p.nombre||'').toLowerCase().includes(q)||(p.cat||'').toLowerCase().includes(q)||coloresTxt(p).toLowerCase().includes(q)||codigosTxt(p).toLowerCase().includes(q));\n  list=list.slice().sort(cmpCod);\n  if(!list.length){ el.innerHTML='<div class=\"empty-inv\"
