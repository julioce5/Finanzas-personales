n\nfunction openInvModal2(src, id){\n  _inv2EditId = id || null;\n  _inv2Type = 'deposito';\n  const m = id ? (data.productos||[]).find(x=>x.id===id) : null;\n  if(m) _inv2Type = m.tipo;\n  document.getElementById('inv2BtnDelete').style.display = m ? '' : 'none';\n  document.getElementById('inv2TypeField').style.display = m ? '' : 'none';\n  setInvType2(_inv2Type);\n  document.getElementById('inv2Desc').value  = m ? m.desc  : '';\n  document.getElementById('inv2Monto').value = m ? m.monto : '';\n  document.getElementById('inv2Fecha').value = m ? m.fecha : new Date().toISOString().slice(0,10);\n  document.getElementById('inv2Nota').value  = m ? m.nota  : '';\n  fillProveedores('inv2Proveedor', m ? (m.proveedor||'') : '');\n  document.getElementById('invModal2Bg').classList.add('open');\n  setTimeout(()=>document.getElementById('inv2Desc').focus(), 100);\n}\nfunction closeInvModal2(){ document.getElementById('invModal2Bg').classList.remove('open'); }\nfunction setInvType2(type){\n  _inv2Type = type;\n  document.getElementById('typeDeposito2').className = 'type-btn' + (type==='deposito' ? ' sel-dep' : '');\n  document.getElementById('typeRetiro2').className   = 'type-btn' + (type==='retiro'   ? ' sel-ret' : '');\n  document.getElementById('inv2BtnSave').className   = type==='deposito' ? 'btn btn-hapi' : 'btn btn-red';\n}\nfunction saveInv2(){\n  const desc  = document.getElementById('inv2Desc').value.trim();\n  const monto = parseFloat(document.getElementById('inv2Monto').value);\n  const fecha = document.getElementById('inv2Fecha').value;\n  if(!desc)            { toast('Agrega una descripción','err'); return; }\n  if(!monto||monto<=0) { toast('Agrega un monto válido','err'); return; }\n  if(!fecha)           { toast('Selecciona una fecha','err');   return; }\n  if(!Array.isArray(data.productos)) data.productos = [];\n  let proveedor = document.getElementById('inv2Proveedor').value;\n  if(proveedor==='__new__') proveedor='';\n  const m = { id: _inv2EditId||Date.now().toString(), tipo:_inv2Type, desc, monto, fecha, proveedor, nota: document.getElementById('inv2Nota').value.trim() };\n  if(_inv2EditId){ const i=data.productos.findIndex(x=>x.id===_inv2EditId); if(i>=0) data.productos[i]=m; else data.productos.push(m); }\n  else { data.productos.push(m); }\n  saveData();\n  closeInvModal2();\n  renderProductosSection();\n  renderResumen();\n}\nfunction deleteInv2(){\n  if(!confirm('¿Eliminar este movimiento?')) return;\n  data.productos = (data.productos||[]).filter(x=>x.id!==_inv2EditId);\n  saveData(); closeInvModal2(); renderProductosSection(); renderResumen(); \n}\nfunction renderProductosSection(){\n  const moves = data.productos||[];\n  const net  = moves.reduce((a,m)=>a+(m.tipo==='deposito'?m.monto:-m.monto),0);\n  const color='var(--prod)';\n  const te=document.getElementById('productosTotal');\n  if(te) te.textContent='S/ '+f(net);\n  const me=document.getElementById('productosMoves');\n  if(!me) return;\n\n  // Apply filters\n  const mesEl=document.getElementById('productosMes');\n  const tipoEl=document.getElementById('productosTipo');\n  const mesFil=mesEl?mesEl.value:'';\n  const tipoFil=tipoEl?tipoEl.value:'';\n  let filtered=[...moves].sort((a,b)=>b.fecha.localeCompare(a.fecha));\n  if(mesFil!=='') filtered=filtered.filter(m=>{\n    const mo=m.fecha?parseInt(m.fecha.slice(5,7))-1:-1;\n    return mo===parseInt(mesFil);\n  });\n  if(tipoFil) filtered=filtered.filter(m=>m.tipo===tipoFil);\n\n  if(!filtered.length){ me.innerHTML=`<div class=\"empty-tx\">Sin movimientos para este filtro.<\u002Fdiv>`; return; }\n  me.innerHTML=filtered.map(m=>{\n    const ds=m.fecha?new Date(m.fecha+'T12:00:00').toLocaleDateString('es-PE',{day:'2-digit',month:'short'}):'';\n    const isIn=m.tipo==='deposito';\n    return `<div class=\"tx-item\" onclick=\"openInvModal2('productos','${m.id}')\">\n      <div class=\"tx-dot\" style=\"background:${isIn?color:'var(--red)'}\"><\u002Fdiv>\n      <div class=\"tx-info\">\n        <div class=\"tx-name\">${m.desc}<\u002Fdiv>\n        <div class=\"tx-meta\">${isIn?'Depósito':'Retiro'}${ds?' · '+ds:''}${m.nota?' · '+m.nota:''}<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tx-amount ${isIn?'g':'r'}\">${isIn?'+':'-'} S/${f(m.monto)}<\u002Fdiv>\n    <\u002Fdiv>`;\n  }).join('');\n}\n\n// Use a simple module-level variable — set once when modal opens, read when saving\nlet _currentInvSrc = 'hapi';\nlet _currentInvId = null;\n\nfunction openInvModal(src, id){\n  _currentInvSrc = src;\n  _currentInvId = id || null;\n  const m = id ? (data[src]||[]).find(x=>x.id===id) : null;\n  invType = m ? m.tipo : 'deposito';\n  const label = src==='hapi' ? 'Hapi' : 'Productos';\n  document.getElementById('invModalTitle').textContent = (m?'Editar':'Registrar — ') + label;\n  document.getElementById('invBtnDelete').style.display = m ? '' : 'none';\n  document.getElementById('invTypeField').style.display = m ? '' : 'none';\n  setInvType(invType);\n  // For new hapi entries, auto-fill desc with current month and lock it\n  const descEl = document.getElementById('invDesc');\n  if(!m && src==='hapi'){\n    const mesNombre = new Date().toLocaleDateString('es-PE',{month:'long'});\n    const mesCapital = mesNombre.charAt(0).toUpperCase()+mesNombre.slice(1);\n    descEl.value = 'Depósito del mes '+mesCapital;\n    descEl.readOnly = true;\n    descEl.style.opacity = '0.6';\n    descEl.style.cursor = 'not-allowed';\n  } else {\n    descEl.value = m ? m.desc : '';\n    descEl.readOnly = false;\n    descEl.style.opacity = '';\n    descEl.style.cursor = '';\n  }\n  document.getElementById('invMonto').value = m ? (m.montoUsd || '') : '';\n  document.getElementById('invFecha').value = m ? m.fecha : new Date().toISOString().slice(0,10);\n  document.getElementById('invNota').value  = m ? m.nota  : '';\n  document.getElementById('invModalBg').classList.add('open');\n  window._invComision=0.0045;\n  setInvComision(0.0045);\n  const invComWrap=document.getElementById('invComisionWrap');\n  if(invComWrap) invComWrap.style.display=(src==='hapi')?'':'none';\n  updateInvUsdPreview();\n  setTimeout(()=>document.getElementById('invMonto').focus(), 100);\n}\n\nfunction closeInvModal(){ document.getElementById('invModalBg').classList.remove('open'); }\nfunction bgClickInv(e){ if(e.target===document.getElementById('invModalBg')) closeInvModal(); }\n\nfunction saveInv(){\n  const src    = _currentInvSrc;\n  const desc   = document.getElementById('invDesc').value.trim();\n  const montoUsd = parseFloat(document.getElementById('invMonto').value);\n  const fecha  = document.getElementById('invFecha').value;\n  if(!desc)              { toast('Agrega una descripción','err'); return; }\n  if(!montoUsd||montoUsd<=0){ toast('Agrega un monto válido','err'); return; }\n  if(!fecha)             { toast('Selecciona una fecha','err');   return; }\n  const tc = getTc();\n  const HAPI_COMISION = (src==='hapi' && invType==='deposito') ? (window._invComision||0) : 0;\n  // Solo aplica comisión en depósitos de hapi\n  const comisionUsd = (src==='hapi' && invType==='deposito') ? montoUsd * HAPI_COMISION : 0;\n  const montoNetoUsd = montoUsd - comisionUsd;\n  const monto = montoNetoUsd * tc;\n  if(!Array.isArray(data[src])) data[src] = [];\n  const m = {\n    id:    _currentInvId || Date.now().toString(),\n    tipo:  invType,\n    desc, monto, montoUsd: montoNetoUsd, montoUsdBruto: montoUsd, comisionUsd, fecha,\n    nota:  document.getElementById('invNota').value.trim()\n  };\n  if(_currentInvId){\n    const i = data[src].findIndex(x=>x.id===_currentInvId);\n    if(i>=0) data[src][i]=m; else data[src].push(m);\n  } else {\n    data[src].push(m);\n  }\n  saveData();\n  closeInvModal();\n  renderInvSection(src);\n  renderResumen();\n  if(comisionUsd>0) toast(`Comisión descontada: -$${f(comisionUsd)}`, 'ok');\n  else if(src==='hapi' && invType==='deposito') toast('Depósito registrado sin comisión', 'ok');\n}\n\nfunction deleteInv(){\n  const src = _currentInvSrc;\n  if(!confirm('¿Eliminar este movimiento?')) return;\n  data[src] = (data[src]||[]).filter(x=>x.id!==_currentInvId);\n  saveData();\n  closeInvModal();\n  renderInvSection(src);\n  renderResumen();\n  \n}\n\n// ── HAPI RENTABILIDAD MENSUAL ─────────────────────────────────────────────────\nlet _balEditMes = null;\n\nfunction openBalModal(mes){\n  _balEditMes = mes;\n  const existing = (data.hapiBalances||{})[mes];\n  document.getElementById('balModalTitle').textContent =\n    'Balance inicio — ' + new Date(mes+'-02').toLocaleDateString('es-PE',{month:'long',year:'numeric'});\n  document.getElementById('balBtnDelete').style.display = existing!=null ? '' : 'none';\n  document.getElementById('balMonto').value = existing!=null ? existing : '';\n  updateBalPreview();\n  document.getElementById('balModalBg').classList.add('open');\n  setTimeout(()=>document.getElementById('balMonto').focus(),100);\n}\nfunction closeBalModal(){ document.getElementById('balModalBg').classList.remove('open'); }\n\nfunction updateBalPreview(){\n  const usd = parseFloat(document.getElementById('balMonto').value)||0;\n  const tc = getTc();\n  const prev = document.getElementById('balPreview');\n  if(!prev) return;\n  if(usd>0){ prev.style.display='block'; prev.textContent='= S/ '+f(usd*tc); }\n  else { prev.style.display='none'; }\n}\n\nfunction saveBal(){\n  const usd = parseFloat(document.getElementById('balMonto').value);\n  if(!usd||usd<0){ toast('Ingresa un balance válido','err'); return; }\n  if(!data.hapiBalances) data.hapiBalances = {};\n  data.hapiBalances[_balEditMes] = usd;\n  saveData();\n  closeBalModal();\n  renderHapiRent();\n}\n\nfunction deleteBal(){\n  if(!confirm('¿Eliminar este balance?')) return;\n  if(data.hapiBalances) delete data.hapiBalances[_balEditMes];\n  saveData(); closeBalModal(); renderHapiRent(); \n}\n\nfunction renderHapiRent(){\n  const el = document.getElementById('hapiRentTable');\n  if(!el) return;\n  const tc = getTc();\n  const balances = data.hapiBalances || {};\n\n  // Deposits per month (net USD)\n  const depsByMonth = {};\n  (data.hapi||[]).forEach(m=>{\n    if(!m.fecha) return;\n    const ym = m.fecha.slice(0,7);\n    const val = (m.montoUsd||0) * (m.tipo==='deposito'?1:-1);\n    depsByMonth[ym] = (depsByMonth[ym]||0) + val;\n  });\n\n  const now = new Date();\n  const currentYM = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');\n\n  const months = Array.from({length:12},(_,i)=>\n    activeYear+'-'+String(i+1).padStart(2,'0')\n  );\n\n  let html = `<div style=\"overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border)\">\n  <table style=\"min-width:320px\">\n    <thead><tr>\n      <th style=\"text-align:left\">Mes<\u002Fth>\n      <th>Inicio mes<\u002Fth>\n      <th>Monto actual<\u002Fth>\n      <th>Rentabilidad<\u002Fth>\n    <\u002Ftr><\u002Fthead>\n    <tbody>`;\n\n  let prevBalUsd = null;\n  months.forEach(ym=>{\n    const isFuture = ym > currentYM;\n    const isCurrent = ym === currentYM;\n    const label = new Date(ym+'-02').toLocaleDateString('es-PE',{month:'long'});\n    const labelCap = label.charAt(0).toUpperCase()+label.slice(1);\n\n    const balInicio = balances[ym] != null ? balances[ym] : null;\n    const deps = depsByMonth[ym] || 0;\n    // Monto actual = balance inicio + depósitos del mes\n    const montoActual = balInicio != null ? balInicio + deps : null;\n\n    // Rentabilidad = (balance inicio de este mes - balance inicio del mes anterior) / balance inicio del mes anterior\n    let rentStr = `<span style=\"color:var(--text3)\">—<\u002Fspan>`;\n    if(balInicio != null && prevBalUsd != null && prevBalUsd > 0){\n      const ganancia = balInicio - prevBalUsd;\n      const rentab = (ganancia / prevBalUsd) * 100;\n      rentStr = `<span style=\"color:${rentab>=0?'var(--green)':'var(--red)'};font-weight:700\">${rentab>=0?'+':''}${rentab.toFixed(2)}%<\u002Fspan>\n                 <span style=\"font-size:10px;color:${ganancia>=0?'var(--green)':'var(--red)'}\"> (${ganancia>=0?'+':''}$${f(Math.abs(ganancia))})<\u002Fspan>`;\n    }\n\n    const rowBg = isCurrent ? 'background:var(--surface2)' : '';\n\n    // Inicio mes cell — clickable to enter balance\n    const inicioCell = !isFuture\n      ? `<td style=\"color:${balInicio!=null?'var(--yellow)':'var(--text3)'};cursor:pointer\" data-mes=\"${ym}\" onclick=\"openBalModal(this.getAttribute('data-mes'))\" title=\"Toca para editar\">\n           ${balInicio!=null ? '$'+f(balInicio) : '<span style=\"font-size:11px;border:1px dashed var(--border2);border-radius:4px;padding:2px 7px;color:var(--text3)\">+ añadir<\u002Fspan>'}\n         <\u002Ftd>`\n      : `<td style=\"color:var(--text3)\">—<\u002Ftd>`;\n\n    const actualCell = montoActual != null\n      ? `<td style=\"color:var(--hapi);font-weight:600\">$${f(montoActual)}<\u002Ftd>`\n      : `<td style=\"color:var(--text3)\">—<\u002Ftd>`;\n\n    html += `<tr style=\"${rowBg}\">\n      <td style=\"text-align:left;font-weight:${isCurrent?'700':'500'};color:${isCurrent?'var(--text)':'var(--text2)'}\">\n        ${labelCap}${isCurrent?' <span style=\"font-size:9px;color:var(--hapi);border:1px solid var(--hapi-dim);border-radius:4px;padding:1px 4px\">hoy<\u002Fspan>':''}\n      <\u002Ftd>\n      ${inicioCell}\n      ${actualCell}\n      <td>${rentStr}<\u002Ftd>\n    <\u002Ftr>`;\n\n    if(balInicio != null) prevBalUsd = balInicio;\n  });\n\n  html += `<\u002Ftbody><\u002Ftable><\u002Fdiv>\n  <div style=\"font-size:10px;color:var(--text3);margin-top:6px;padding:0 2px\">\n    Toca cualquier celda de \"Inicio mes\" para ingresar el balance que aparece en Hapi ese día.\n  <\u002Fdiv>`;\n  el.innerHTML = html;\n}\n\nfunction resetData(){\n  if(!confirm('¿Borrar TODOS los datos guardados? Esto no se puede deshacer.\\nExporta un respaldo primero si quieres guardar algo.'))return;\n  localStorage.removeItem('fin_personal_v1');\n  data={years:[new Date().getFullYear()],transactions:[],hapi:[],productos:[],catalogo:[],ventasProd:[]};\n  activeYear=data.years[0];\n  saveData();buildYearSel();renderAll();\n  toast('Datos reiniciados','ok');\n}\nfunction toggleBackup(){document.getElementById('backupPanel').classList.toggle('open');updateStorageLabel();}\nfunction storageBytes(){\n  try{ return new Blob([localStorage.getItem('fin_personal_v1')||'']).size; }catch(e){ return 0; }\n}\nfunction updateStorageLabel(){\n  const el=document.getElementById('storageLabel'); if(!el) return;\n  const mb=storageBytes()/1048576;\n  const pct=Math.min(100,Math.round(mb/5*100));\n  el.textContent='· Espacio usado: '+mb.toFixed(2)+' MB de ~5 MB ('+pct+'%)';\n  el.style.color = pct>=80 ? 'var(--red)' : pct>=60 ? 'var(--yellow)' : 'var(--text2)';\n  if(pct>=80) el.textContent+=' — exporta y borra fotos que no uses';\n}\nfunction backupPayload(){\n  const now=new Date();\n  return {\n    now,\n    name:'finanzas_'+now.toISOString().slice(0,10)+'.json',\n    json:JSON.stringify({version:1,exported:now.toISOString(),data},null,2),\n    texto:'Respaldo Finanzas — '+now.toLocaleDateString('es-PE')+' · '+(data.transactions||[]).length+' movimientos, '+(data.catalogo||[]).length+' productos, '+(data.ventasProd||[]).length+' ventas.'\n  };\n}\nasync function compartirBackup(titulo){\n  const b=backupPayload();\n  const file=new File([b.json], b.name, {type:'application/json'});\n  if(navigator.canShare && navigator.canShare({files:[file]})){\n    try{\n      await navigator.share({files:[file], title:titulo, text:b.texto});\n      localStorage.setItem('fin_lastbackup', b.now.toLocaleString('es-PE'));\n      updateLastBackupLabel();\n      toast('Respaldo enviado','ok');\n      return true;\n    }catch(err){ if(err.name==='AbortError') return true; }\n  }\n  return false;\n}\nasync function shareBackup(){\n  if(await compartirBackup('Respaldo Finanzas')) return;\n  exportData();\n  toast('Archivo descargado — adjúntalo en WhatsApp','ok');\n  const b=backupPayload();\n  setTimeout(()=>{ window.location.href='https://wa.me/?text='+encodeURIComponent(b.texto); }, 700);\n}\nasync function mailBackup(){\n  if(await compartirBackup('Respaldo Finanzas')) return;\n  exportData();\n  const b=backupPayload();\n  toast('Archivo descargado — adjúntalo al correo','ok');\n  setTimeout(()=>{ window.location.href='mailto:?subject='+encodeURIComponent('Respaldo Finanzas '+b.now.toLocaleDateString('es-PE'))+'&body='+encodeURIComponent(b.texto+'\\n\\n(Adjunta el archivo '+b.name+' que se acaba de descargar.)'); }, 700);\n}\nfunction exportData(){\n  const now=new Date();\n  const blob=new Blob([JSON.stringify({version:1,exported:now.toISOString(),data},null,2)],{type:'application/json'});\n  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`finanzas_${now.toISOString().slice(0,10)}.json`;a.click();\n  localStorage.setItem('fin_lastbackup',now.toLocaleString('es-PE'));updateLastBackupLabel();updateStorageLabel();toast('Respaldo exportado','ok');\n}\nfunction importData(e){\n  const file=e.target.files[0];if(!file)return;\n  const reader=new FileReader();\n  reader.onload=ev=>{\n    try{\n      const parsed=JSON.parse(ev.target.result);\n      if(!parsed.data)throw new Error();\n      if(!confirm('¿Restaurar datos del respaldo? Esto reemplaza todo lo actual.'))return;\n      data=parsed.data;\n      if(!Array.isArray(data.hapi))data.hapi=[];if(!Array.isArray(data.productos))data.productos=[];\n      if(!Array.isArray(data.catalogo))data.catalogo=[];if(!Array.isArray(data.ventasProd))data.ventasProd=[];\n      saveData();buildYearSel();renderAll();toast('Datos restaurados','ok');\n    }catch(err){toast('Archivo inválido','err');}\n  };\n  reader.readAsText(file);e.target.value='';\n}\nfunction updateLastBackupLabel(){\n  const lb=localStorage.getItem('fin_lastbackup');\n  const el=document.getElementById('lastBackupLabel');\n  if(el)el.textContent=lb?'Último respaldo: '+lb:'Sin respaldo aún';\n}\nlet toastTimer;\nfunction toast(msg,type=''){\n  const t=document.getElementById('toast');t.textContent=msg;t.className='toast show '+type;\n  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.className='toast';},3000);\n}\n\n// ── TEMA CLARO/OSCURO ─────────────────────────────────────────────────────────\nfunction toggleTheme(){\n  const isLight=document.body.classList.toggle('light');\n  localStorage.setItem('fin_theme',isLight?'light':'dark');\n  updateThemeIcon(isLight);\n}\nfunction updateThemeIcon(isLight){\n  const icon=document.getElementById('themeIcon');\n  if(!icon)return;\n  icon.innerHTML=isLight\n    ?'<circle cx=\"12\" cy=\"12\" r=\"5\"/><line x1=\"12\" y1=\"1\" x2=\"12\" y2=\"3\"/><line x1=\"12\" y1=\"21\" x2=\"12\" y2=\"23\"/><line x1=\"4.22\" y1=\"4.22\" x2=\"5.64\" y2=\"5.64\"/><line x1=\"18.36\" y1=\"18.36\" x2=\"19.78\" y2=\"19.78\"/><line x1=\"1\" y1=\"12\" x2=\"3\" y2=\"12\"/><line x1=\"21\" y1=\"12\" x2=\"23\" y2=\"12\"/><line x1=\"4.22\" y1=\"19.78\" x2=\"5.64\" y2=\"18.36\"/><line x1=\"18.36\" y1=\"5.64\" x2=\"19.78\" y2=\"4.22\"/>'\n    :'<path d=\"M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z\"/>';\n}\nfunction loadTheme(){\n  const t=localStorage.getItem('fin_theme');\n  if(t==='light'){document.body.classList.add('light');updateThemeIcon(true);}\n}\n\n// ── FAB ───────────────────────────────────────────────────────────────────────\nfunction toggleFab(){\n  const menu=document.getElementById('fabMenu');\n  const icon=document.getElementById('fabIcon');\n  const open=menu.classList.toggle('open');\n  icon.innerHTML=open\n    ?'<path d=\"M18 6L6 18M6 6l12 12\"/>'\n    :'<path d=\"M12 5v14M5 12h14\"/>';\n}\nfunction closeFab(){\n  document.getElementById('fabMenu').classList.remove('open');\n  document.getElementById('fabIcon').innerHTML='<path d=\"M12 5v14M5 12h14\"/>';\n}\n// Close fab when clicking outside\ndocument.addEventListener('click',e=>{\n  const fab=document.getElementById('fabBtn');\n  const menu=document.getElementById('fabMenu');\n  if(fab&&menu&&!fab.contains(e.target)&&!menu.contains(e.target))closeFab();\n});\n\n// ── RACHA ─────────────────────────────────────────────────────────────────────\nfunction renderRacha(){\n  const el=document.getElementById('rachaCard');\n  if(!el)return;\n  const txs=data.transactions.filter(t=>getTxYear(t)===activeYear);\n  let racha=0;\n  let maxRacha=0;\n  const now=new Date();\n  const mi=now.getMonth();\n  for(let i=mi;i>=0;i--){\n    const mt=txs.filter(t=>getTxMonth(t)===i);\n    const ing=mt.filter(t=>t.tipo==='ingreso').reduce((a,t)=>a+t.monto,0);\n    const egr=mt.filter(t=>t.tipo==='egreso').reduce((a,t)=>a+t.monto,0);\n    if(ing-egr>0) racha++; else break;\n  }\n  for(let i=0;i<=mi;i++){\n    const mt=txs.filter(t=>getTxMonth(t)===i);\n    const ing=mt.filter(t=>t.tipo==='ingreso').reduce((a,t)=>a+t.monto,0);\n    const egr=mt.filter(t=>t.tipo==='egreso').reduce((a,t)=>a+t.monto,0);\n    if(ing-egr>0) maxRacha++; else maxRacha=0;\n  }\n  if(racha===0){el.style.display='none';return;}\n  el.style.display='flex';\n  const emoji=racha>=6?'🔥':racha>=3?'⚡':'✅';\n  el.innerHTML=`\n    <div style=\"font-size:24px\">${emoji}<\u002Fdiv>\n    <div>\n      <div style=\"font-size:13px;font-weight:700;color:var(--green)\">${racha} mes${racha>1?'es':''} consecutivo${racha>1?'s':''} con balance positivo<\u002Fdiv>\n      <div style=\"font-size:11px;color:var(--text3)\">Sigue así — cada mes que ahorras cuenta<\u002Fdiv>\n    <\u002Fdiv>`;\n}\n\n// ── BARRAS MENSUALES ──────────────────────────────────────────────────────────\nfunction renderBarrasMensuales(){\n  const el=document.getElementById('barrasMensuales');\n  if(!el)return;\n  const txs=data.transactions.filter(t=>getTxYear(t)===activeYear);\n  const MLAB=['E','F','M','A','M','J','J','A','S','O','N','D'];\n  const vals=MESES.map((_,mi)=>{\n    const mt=txs.filter(t=>getTxMonth(t)===mi);\n    const ing=mt.filter(t=>t.tipo==='ingreso').reduce((a,t)=>a+t.monto,0);\n    const egr=mt.filter(t=>t.tipo==='egreso').reduce((a,t)=>a+t.monto,0);\n    return {ing,egr};\n  });\n  const max=Math.max(...vals.map(v=>Math.max(v.ing,v.egr)),1);\n  const now=new Date();\n  const curMi=now.getFullYear()===activeYear?now.getMonth():11;\n  el.innerHTML=vals.map((v,i)=>{\n    const hIng=Math.round((v.ing/max)*60);\n    const hEgr=Math.round((v.egr/max)*60);\n    const isCur=i===curMi;\n    return `<div class=\"barra-col\">\n      <div class=\"barra-pair\">\n        <div class=\"barra-ing\" style=\"height:${hIng}px;opacity:${i>curMi?.3:1}\"><\u002Fdiv>\n        <div class=\"barra-egr\" style=\"height:${hEgr}px;opacity:${i>curMi?.3:1}\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"barra-label\" style=\"color:${isCur?'var(--text)':'var(--text3)'};font-weight:${isCur?'700':'400'}\">${MLAB[i]}<\u002Fdiv>\n    <\u002Fdiv>`;\n  }).join('');\n}\n\n// ── NOTAS ─────────────────────────────────────────────────────────────────────\nlet _notaEditId=null;\nfunction openNotaModal(id){\n  _notaEditId=id||null;\n  const n=id?(data.notas||[]).find(x=>x.id===id):null;\n  document.getElementById('notaModalTitle').textContent=n?'Editar nota':'Nueva nota';\n  document.getElementById('notaBtnDelete').style.display=n?'':'none';\n  document.getElementById('notaTexto').value=n?n.texto:'';\n  document.getElementById('notaModalBg').classList.add('open');\n  setTimeout(()=>document.getElementById('notaTexto').focus(),100);\n}\nfunction closeNotaModal(){document.getElementById('notaModalBg').classList.remove('open');}\nfunction saveNota(){\n  const texto=document.getElementById('notaTexto').value.trim();\n  if(!texto){toast('Escribe algo','err');return;}\n  if(!Array.isArray(data.notas))data.notas=[];\n  const n={id:_notaEditId||Date.now().toString(),texto,fecha:new Date().toISOString().slice(0,10)};\n  if(_notaEditId){const i=data.notas.findIndex(x=>x.id===_notaEditId);if(i>=0)data.notas[i]=n;else data.notas.push(n);}\n  else data.notas.push(n);\n  saveData();closeNotaModal();renderNotas();\n}\nfunction deleteNota(){\n  if(!confirm('¿Eliminar esta nota?'))return;\n  data.notas=(data.notas||[]).filter(x=>x.id!==_notaEditId);\n  saveData();closeNotaModal();renderNotas();\n}\nfunction renderNotas(){\n  const el=document.getElementById('notasList');\n  if(!el)return;\n  const notas=[...(data.notas||[])].sort((a,b)=>b.fecha.localeCompare(a.fecha));\n  if(!notas.length){el.innerHTML='<div class=\"empty-tx\">Sin notas aún. Toca \"Nueva nota\" para agregar.<\u002Fdiv>';return;}\n  el.innerHTML=notas.map(n=>`\n    <div class=\"nota-item\" onclick=\"openNotaModal('${n.id}')\">\n      <div class=\"nota-text\">${n.texto}<\u002Fdiv>\n      <div class=\"nota-date\">${new Date(n.fecha+'T12:00:00').toLocaleDateString('es-PE',{day:'2-digit',month:'long',year:'numeric'})}<\u002Fdiv>\n    <\u002Fdiv>`).join('');\n}\n\n// ── CATEGORÍAS PERSONALIZADAS ─────────────────────────────────────────────────\nfunction openCatModal(){\n  renderCatTags();\n  document.getElementById('catModalBg').classList.add('open');\n}\nfunction closeCatModal(){document.getElementById('catModalBg').classList.remove('open');}\nfunction addCatCustom(){\n  const inp=document.getElementById('catNueva');\n  const val=inp.value.trim();\n  if(!val)return;\n  if(!Array.isArray(data.catsCustom))data.catsCustom=[];\n  if(data.catsCustom.includes(val)||['Comidas','Pasajes','Fiestas','Spotify','Otros'].includes(val)){\n    toast('Esa categoría ya existe','err');return;\n  }\n  data.catsCustom.push(val);\n  inp.value='';\n  saveData();renderCatTags();updateEgrCats();\n}\nfunction removeCatCustom(cat){\n  data.catsCustom=(data.catsCustom||[]).filter(c=>c!==cat);\n  saveData();renderCatTags();updateEgrCats();\n}\nfunction renderCatTags(){\n  const el=document.getElementById('catTagsList');\n  if(!el)return;\n  const cats=data.catsCustom||[];\n  if(!cats.length){el.innerHTML='<span style=\"font-size:11px;color:var(--text3)\">Sin categorías personalizadas aún.<\u002Fspan>';return;}\n  el.innerHTML=cats.map(c=>`<span class=\"cat-tag\">${c}<button onclick=\"removeCatCustom('${c}')\" title=\"Eliminar\">×<\u002Fbutton><\u002Fspan>`).join('');\n}\nfunction updateEgrCats(){\n  const custom=data.catsCustom||[];\n  const usadas=[...new Set((data.transactions||[]).filter(t=>t.tipo==='egreso').map(t=>t.cat).filter(Boolean))];\n  const all=[...new Set([...['Comidas','Pasajes','Fiestas','Spotify'],...custom,...usadas])];\n  // Update filter select\n  const egrCatEl=document.getElementById('egrCat');\n  if(egrCatEl){\n    const cur=egrCatEl.value;\n    egrCatEl.innerHTML='<option value=\"\">Todas las categorías<\u002Foption>'+all.map(c=>`<option${cur===c?' selected':''}>${c}<\u002Foption>`).join('');\n  }\n  // Update EGR_CATS array used in modal (sin las categorías solo heredadas de datos viejos)\n  window._EGR_CATS_ALL=[...new Set([...['Comidas','Pasajes','Fiestas','Spotify'],...custom])];\n}\nfunction getEgrCats(){return window._EGR_CATS_ALL||EGR_CATS;}\nfunction getIngCats(){\n  if(!Array.isArray(data.ingCatsCustom)) data.ingCatsCustom=[];\n  return [...new Set(ING_CATS.concat(data.ingCatsCustom))];\n}\nfunction fillTxCats(type, valor){\n  const sel=document.getElementById('txCat'); if(!sel) return;\n  let cats=(type==='ingreso'?getIngCats():getEgrCats()).slice();\n  const edit=editTxId?data.transactions.find(t=>t.id===editTxId):null;\n  const actual=valor||(edit?edit.cat:'');\n  if(actual&&!cats.includes(actual)) cats.push(actual);\n  sel.innerHTML=cats.map(c=>'<option'+(c===actual?' selected':'')+'>'+c+'<\u002Foption>').join('')+\n    '<option value=\"__new__\">＋ Otra categoría...<\u002Foption>';\n  if(actual) sel.value=actual;\n  if(typeof onCatChange==='function') onCatChange();\n}\nfunction onTxCatChange(sel){\n  if(sel.value!=='__new__'){ if(typeof onCatChange==='function') onCatChange(); return; }\n  const nombre=(prompt('Nombre de la nueva categoría:')||'').trim();\n  if(!nombre){ fillTxCats(txType); return; }\n  if(txType==='ingreso'){\n    if(!Array.isArray(data.ingCatsCustom)) data.ingCatsCustom=[];\n    const ya=getIngCats().find(c=>c.toLowerCase()===nombre.toLowerCase());\n    if(!ya) data.ingCatsCustom.push(nombre);\n    saveData(); updateIngCatsFilter(); fillTxCats('ingreso', ya||nombre);\n    toast(ya?'Esa categoría ya existía':'Categoría \"'+nombre+'\" agregada','ok');\n  } else {\n    if(!Array.isArray(data.catsCustom)) data.catsCustom=[];\n    const ya=getEgrCats().find(c=>c.toLowerCase()===nombre.toLowerCase());\n    if(!ya) data.catsCustom.push(nombre);\n    saveData(); updateEgrCats(); fillTxCats('egreso', ya||nombre);\n    toast(ya?'Esa categoría ya existía':'Categoría \"'+nombre+'\" agregada','ok');\n  }\n}\nfunction updateIngCatsFilter(){\n  const el=document.getElementById('ingCat'); if(!el) return;\n  const cur=el.value;\n  const usadas=[...new Set(data.transactions.filter(t=>t.tipo==='ingreso').map(t=>t.cat).filter(Boolean))];\n  const all=[...new Set(getIngCats().concat(usadas))];\n  el.innerHTML='<option value=\"\">Todas las fuentes<\u002Foption>'+all.map(c=>'<option'+(cur===c?' selected':'')+'>'+c+'<\u002Foption>').join('');\n}\n\nloadData();\nloadTheme();\ninitCloud();\n\n// ── SERVICE WORKER ────────────────────────────────────────────────────────────\nif('serviceWorker' in navigator){\n  navigator.serviceWorker.register('sw.js').catch(()=>{});\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
