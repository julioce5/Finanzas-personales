''),W-pad*2-64-sw-12),pad+56,y+18);\n    x.fillStyle=tx2; x.font='400 11px '+fam; x.fillText(it.q+' × S/ '+f(it.p),pad+56,y+34);\n    x.fillStyle=bd; x.fillRect(pad,y+rowH-1,W-pad*2,1);\n    y+=rowH;\n  });\n  y+=16;\n  x.fillStyle=bg2; x.fillRect(0,y,W,H-y);\n  x.fillStyle=tx2; x.font='400 12px '+fam; x.fillText('Total vendido',pad,y+30);\n  x.fillStyle=tx3; x.font='400 11px '+fam; x.fillText(R.und+' und. · '+R.nv+' venta'+(R.nv!==1?'s':''),pad,y+48);\n  x.fillStyle=gr; x.font='800 24px '+fam; x.textAlign='right'; x.fillText('S/ '+f(R.tot),W-pad,y+44); x.textAlign='left';\n  const name='reporte_tienda_'+(R.de||'')+'_'+(R.ha||'')+'.png';\n  const blob=await new Promise(res=>c.toBlob(res,'image/png'));\n  if(!blob){ toast('No se pudo crear la foto','err'); return; }\n  try{\n    const file=new File([blob],name,{type:'image/png'});\n    if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:'Reporte de ventas · Tienda'}); return; }\n  }catch(e){ if(e&&e.name==='AbortError') return; }\n  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove();\n  setTimeout(()=>URL.revokeObjectURL(a.href),2000);\n  toast('Foto descargada','ok');\n}\nfunction closeReporteTienda(){ document.getElementById('repTiendaBg').style.display='none'; }\nfunction renderReporteTienda(){\n  let de=document.getElementById('repDesde').value, ha=document.getElementById('repHasta').value;\n  if(de&&ha&&de>ha){ const t=de; de=ha; ha=t; }\n  const vs=ventasList().filter(v=>canalDe(v)!=='online'&&v.fecha&&(!de||v.fecha>=de)&&(!ha||v.fecha<=ha))\n    .sort((a,b)=>a.fecha.localeCompare(b.fecha)||String(a.id).localeCompare(String(b.id)));\n  const filas=[]; let tot=0, und=0;\n  vs.forEach(v=>(v.items||[]).forEach(i=>{ const q=parseInt(i.qty)||0, p=parseFloat(i.precio)||0; tot+=q*p; und+=q; filas.push({fecha:v.fecha,nombre:i.nombre,color:i.color,q,p}); }));\n  const lista=document.getElementById('repLista');\n  lista.innerHTML=filas.length?filas.map(x=>{\n    const dt=new Date(x.fecha+'T12:00:00').toLocaleDateString('es-PE',{day:'2-digit',month:'short'});\n    return '<div style=\"display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)\">'+\n      '<span style=\"width:46px;flex-shrink:0;font-size:11px;color:var(--text3)\">'+dt+'<\u002Fspan>'+\n      '<div style=\"flex:1;min-width:0\"><div style=\"font-size:13px;color:var(--text)\">'+escH(x.nombre)+(x.color?' <span style=\"color:var(--text2)\">('+escH(x.color)+')<\u002Fspan>':'')+'<\u002Fdiv>'+\n      '<div style=\"font-size:11px;color:var(--text2)\">'+x.q+' × S/ '+f(x.p)+'<\u002Fdiv><\u002Fdiv>'+\n      '<span style=\"font-size:13px;font-weight:700;color:var(--text)\">S/ '+f(x.q*x.p)+'<\u002Fspan><\u002Fdiv>';\n  }).join(''):'<div class=\"empty-tx\" style=\"padding:24px 0\">No hay ventas en tienda entre esas fechas.<\u002Fdiv>';\n  window._repData={de,ha,filas,tot,und,nv:vs.length};\n  document.getElementById('repTotal').textContent='S/ '+f(tot);\n  document.getElementById('repUnd').textContent=und+' und. · '+vs.length+' venta'+(vs.length!==1?'s':'');\n}\nfunction renderVentasProd(){\n  const el=document.getElementById('ventasList'); if(!el) return;\n  const mes=((document.getElementById('ventasMes')||{}).value)||'';\n  let vs=ventasCanal().filter(v=>!mes||(v.fecha||'').slice(0,7)===mes);\n  vs=vs.slice().sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||'')||String(b.id).localeCompare(String(a.id)));\n  try{ renderRankingVentas(); }catch(e){ console.error(e); }\n  const total=vs.reduce((a,v)=>a+(parseFloat(v.total)||0),0);\n  const uds=vs.reduce((a,v)=>a+(v.items||[]).reduce((x,i)=>x+i.qty,0),0);\n  const gan=vs.reduce((a,v)=>a+(v.items||[]).reduce((x,i)=>x+((parseFloat(i.precio)||0)-(parseFloat(i.costo)||0))*i.qty,0),0);\n  const badge=document.getElementById('ventasTotalBadge');\n  if(badge) badge.textContent='S/ '+f(total);\n  const stats=document.getElementById('ventasStats');\n  if(stats) stats.innerHTML=[\n    ['Vendido','S/ '+f(total),'var(--green)','var(--green-bg)','var(--green-dim)'],\n    ['Ganancia','S/ '+f(gan),gan>=0?'var(--green)':'var(--red)',gan>=0?'var(--green-bg)':'var(--red-bg)',gan>=0?'var(--green-dim)':'var(--red-dim)'],\n    ['Unidades',String(uds),'var(--prod)','var(--prod-bg)','var(--prod-dim)'],\n    ['Ticket prom.','S/ '+f(vs.length?total/vs.length:0),'var(--yellow)','var(--yellow-bg)','var(--yellow-dim)']\n  ].map(a=>'<div class=\"inv-sum-card\" style=\"background:'+a[3]+';border:1px solid '+a[4]+'\"><div class=\"inv-sum-label\" style=\"color:'+a[2]+'\">'+a[0]+'<\u002Fdiv><div class=\"inv-sum-val\" style=\"color:'+a[2]+'\">'+a[1]+'<\u002Fdiv><\u002Fdiv>').join('');\n  const va=ventasList().filter(v=>!mes||(v.fecha||'').slice(0,7)===mes).sort((a,b)=>String(b.id).localeCompare(String(a.id)));\n  if(!va.length){ el.innerHTML='<div class=\"empty-tx\">Sin ventas registradas'+(mes?' en este mes':' aún')+'. Toca “Registrar venta”.<\u002Fdiv>'; return; }\n  const groups={};\n  va.forEach(v=>{ const k=v.fecha||'—'; (groups[k]=groups[k]||[]).push(v); });\n  el.innerHTML=Object.keys(groups).sort().reverse().map(k=>{\n    const g=groups[k];\n    const dt=k!=='—'?new Date(k+'T12:00:00'):null;\n    const lbl=dt?dt.toLocaleDateString('es-PE',{weekday:'short',day:'2-digit',month:'short'}):'Sin fecha';\n    const dayTot=g.reduce((a,v)=>a+(parseFloat(v.total)||0),0);\n    const dayGan=g.reduce((a,v)=>a+(v.items||[]).reduce((x,i)=>x+((parseFloat(i.precio)||0)-(parseFloat(i.costo)||0))*i.qty,0),0);\n    const fila=v=>{\n      const items=(v.items||[]).map(i=>i.qty+'× '+escH(i.nombre)+(i.color?' ('+escH(i.color)+')':'')).join(', ');\n      return '<div class=\"tx-item\" style=\"cursor:default\">'+\n        '<div class=\"tx-dot\" style=\"background:var(--prod)\"><\u002Fdiv>'+\n        '<div class=\"tx-info\"><div class=\"tx-name\">'+items+'<\u002Fdiv>'+\n        '<div class=\"tx-meta\">'+escH(v.pago||'Efectivo')+(v.txId?' · en Ingresos':' · sin ingreso')+(v.nota?' · '+escH(v.nota):'')+'<\u002Fdiv><\u002Fdiv>'+\n        '<div style=\"text-align:right\"><div class=\"tx-amount g\">S/ '+f(parseFloat(v.total)||0)+'<\u002Fdiv><div style=\"font-size:10px;color:var(--text3)\">gan. S/ '+f((v.items||[]).reduce((x,i)=>x+((parseFloat(i.precio)||0)-(parseFloat(i.costo)||0))*i.qty,0))+'<\u002Fdiv><\u002Fdiv>'+\n        '<button class=\"btn\" style=\"width:28px;height:28px;padding:0;justify-content:center\" onclick=\"deleteVenta(\\''+v.id+'\\')\" title=\"Anular venta\">'+\n        '<svg width=\"13\" height=\"13\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path d=\"M18 6L6 18M6 6l12 12\"/><\u002Fsvg><\u002Fbutton>'+\n      '<\u002Fdiv>';\n    };\n    const col=(t,c,list)=>{ const st=list.reduce((a,v)=>a+(parseFloat(v.total)||0),0);\n      return '<div style=\"min-width:0;padding:10px 12px;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--border)\">'+\n        '<div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px\"><span style=\"font-size:13px;font-weight:700;color:'+c+'\">'+t+'<\u002Fspan>'+(list.length?'<span style=\"font-size:11px;color:var(--text2)\">S/ '+f(st)+'<\u002Fspan>':'')+'<\u002Fdiv>'+\n        (list.length?'<div class=\"tx-list\">'+list.map(fila).join('')+'<\u002Fdiv>':'<div style=\"font-size:12px;color:var(--text3);padding:4px 0 2px\">Sin ventas este día.<\u002Fdiv>')+'<\u002Fdiv>'; };\n    const ti=g.filter(v=>canalDe(v)!=='online'), on=g.filter(v=>canalDe(v)==='online');\n    return '<div class=\"venta-day\"><div class=\"venta-day-head\"><div class=\"venta-day-label\">'+lbl+'<\u002Fdiv><div class=\"venta-day-line\"><\u002Fdiv><div class=\"venta-day-total\">S/ '+f(dayTot)+' · gan. S/ '+f(dayGan)+'<\u002Fdiv><\u002Fdiv>'+\n      '<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px\">'+col('Tienda','var(--green)',ti)+col('Online','var(--yellow)',on)+'<\u002Fdiv><\u002Fdiv>';\n  }).join('');\n}\n\n// ── PRODUCTOS INVERSIÓN (modal independiente) ────────────────────────────────\nlet _inv2EditId = null;\nlet _inv2Type = 'deposito';\n\nfunction openInvModal2(src, id){\n  _inv2EditId = id || null;\n  _inv2Type = 'deposito';\n  const m = id ? (data.productos||[]).find(x=>x.id===id) : null;\n  if(m) _inv2Type = m.tipo;\n  document.getElementById('inv2BtnDelete').style.display = m ? '' : 'none';\n  document.getElementById('inv2TypeField').style.display = m ? '' : 'none';\n  setInvType2(_inv2Type);\n  document.getElementById('inv2Desc').value  = m ? m.desc  : '';\n  document.getElementById('inv2Monto').value = m ? m.monto : '';\n  document.getElementById('inv2Fecha').value = m ? m.fecha : new Date().toISOString().slice(0,10);\n  document.getElementById('inv2Nota').value  = m ? m.nota  : '';\n  fillProveedores('inv2Proveedor', m ? (m.proveedor||'') : '');\n  document.getElementById('invModal2Bg').classList.add('open');\n  setTimeout(()=>document.getElementById('inv2Desc').focus(), 100);\n}\nfunction closeInvModal2(){ document.getElementById('invModal2Bg').classList.remove('open'); }\nfunction setInvType2(type){\n  _inv2Type = type;\n  document.getElementById('typeDeposito2').className = 'type-btn' + (type==='deposito' ? ' sel-dep' : '');\n  document.getElementById('typeRetiro2').className   = 'type-btn' + (type==='retiro'   ? ' sel-ret' : '');\n  document.getElementById('inv2BtnSave').className   = type==='deposito' ? 'btn btn-hapi' : 'btn btn-red';\n}\nfunction saveInv2(){\n  const desc  = document.getElementById('inv2Desc').value.trim();\n  const monto = parseFloat(document.getElementById('inv2Monto').value);\n  const fecha = document.getElementById('inv2Fecha').value;\n  if(!desc)            { toast('Agrega una descripción','err'); return; }\n  if(!monto||monto<=0) { toast('Agrega un monto válido','err'); return; }\n  if(!fecha)           { toast('Selecciona una fecha','err');   return; }\n  if(!Array.isArray(data.productos)) data.productos = [];\n  let proveedor = document.getElementById('inv2Proveedor').value;\n  if(proveedor==='__new__') proveedor='';\n  const m = { id: _inv2EditId||Date.now().toString(), tipo:_inv2Type, desc, monto, fecha, proveedor, nota: document.getElementById('inv2Nota').value.trim() };\n  if(_inv2EditId){ const i=data.productos.findIndex(x=>x.id===_inv2EditId); if(i>=0) data.productos[i]=m; else data.productos.push(m); }\n  else { data.productos.push(m); }\n  saveData();\n  closeInvModal2();\n  renderProductosSection();\n  renderResumen();\n}\nfunction deleteInv2(){\n  if(!confirm('¿Eliminar este movimiento?')) return;\n  data.productos = (data.productos||[]).filter(x=>x.id!==_inv2EditId);\n  saveData(); closeInvModal2(); renderProductosSection(); renderResumen(); \n}\nfunction renderProductosSection(){\n  const moves = data.productos||[];\n  const net  = moves.reduce((a,m)=>a+(m.tipo==='deposito'?m.monto:-m.monto),0);\n  const color='var(--prod)';\n  const te=document.getElementById('productosTotal');\n  if(te) te.textContent='S/ '+f(net);\n  const me=document.getElementById('productosMoves');\n  if(!me) return;\n\n  // Apply filters\n  const mesEl=document.getElementById('productosMes');\n  const tipoEl=document.getElementById('productosTipo');\n  const mesFil=mesEl?mesEl.value:'';\n  const tipoFil=tipoEl?tipoEl.value:'';\n  let filtered=[...moves].sort((a,b)=>b.fecha.localeCompare(a.fecha));\n  if(mesFil!=='') filtered=filtered.filter(m=>{\n    const mo=m.fecha?parseInt(m.fecha.slice(5,7))-1:-1;\n    return mo===parseInt(mesFil);\n  });\n  if(tipoFil) filtered=filtered.filter(m=>m.tipo===tipoFil);\n\n  if(!filtered.length){ me.innerHTML=`<div class=\"empty-tx\">Sin movimientos para este filtro.<\u002Fdiv>`; return; }\n  me.innerHTML=filtered.map(m=>{\n    const ds=m.fecha?new Date(m.fecha+'T12:00:00').toLocaleDateString('es-PE',{day:'2-digit',month:'short'}):'';\n    const isIn=m.tipo==='deposito';\n    return `<div class=\"tx-item\" onclick=\"openInvModal2('productos','${m.id}')\">\n      <div class=\"tx-dot\" style=\"background:${isIn?color:'var(--red)'}\"><\u002Fdiv>\n      <div class=\"tx-info\">\n        <div class=\"tx-name\">${escH(m.desc)}<\u002Fdiv>\n        <div class=\"tx-meta\">${isIn?'Depósito':'Retiro'}${ds?' · '+ds:''}${m.nota?' · '+escH(m.nota):''}<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tx-amount ${isIn?'g':'r'}\">${isIn?'+':'-'} S/${f(m.monto)}<\u002Fdiv>\n    <\u002Fdiv>`;\n  }).join('');\n}\n\n// Use a simple module-level variable — set once when modal opens, read when saving\nlet _currentInvSrc = 'hapi';\nlet _currentInvId = null;\n\n\n\n\n\n// ── HAPI RENTABILIDAD MENSUAL ─────────────────────────────────────────────────\nlet _balEditMes = null;\n\nfunction openBalModal(mes){\n  _balEditMes = mes;\n  const existing = (data.hapiBalances||{})[mes];\n  document.getElementById('balModalTitle').textContent =\n    'Balance inicio — ' + new Date(mes+'-02').toLocaleDateString('es-PE',{month:'long',year:'numeric'});\n  document.getElementById('balBtnDelete').style.display = existing!=null ? '' : 'none';\n  document.getElementById('balMonto').value = existing!=null ? existing : '';\n  updateBalPreview();\n  document.getElementById('balModalBg').classList.add('open');\n  setTimeout(()=>document.getElementById('balMonto').focus(),100);\n}\nfunction closeBalModal(){ document.getElementById('balModalBg').classList.remove('open'); }\n\nfunction updateBalPreview(){\n  const usd = parseFloat(document.getElementById('balMonto').value)||0;\n  const tc = getTc();\n  const prev = document.getElementById('balPreview');\n  if(!prev) return;\n  if(usd>0){ prev.style.display='block'; prev.textContent='= S/ '+f(usd*tc); }\n  else { prev.style.display='none'; }\n}\n\nfunction saveBal(){\n  const usd = parseFloat(document.getElementById('balMonto').value);\n  if(!usd||usd<0){ toast('Ingresa un balance válido','err'); return; }\n  if(!data.hapiBalances) data.hapiBalances = {};\n  data.hapiBalances[_balEditMes] = usd;\n  saveData();\n  closeBalModal();\n  renderHapiRent();\n}\n\nfunction deleteBal(){\n  if(!confirm('¿Eliminar este balance?')) return;\n  if(data.hapiBalances) delete data.hapiBalances[_balEditMes];\n  saveData(); closeBalModal(); renderHapiRent(); \n}\n\nfunction renderHapiRent(){\n  const el = document.getElementById('hapiRentTable');\n  if(!el) return;\n  const tc = getTc();\n  const balances = data.hapiBalances || {};\n\n  // Deposits per month (net USD)\n  const depsByMonth = {};\n  (data.hapi||[]).forEach(m=>{\n    if(!m.fecha) return;\n    const ym = m.fecha.slice(0,7);\n    const val = (m.montoUsd||0) * (m.tipo==='deposito'?1:-1);\n    depsByMonth[ym] = (depsByMonth[ym]||0) + val;\n  });\n\n  const now = new Date();\n  const currentYM = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');\n\n  const months = Array.from({length:12},(_,i)=>\n    activeYear+'-'+String(i+1).padStart(2,'0')\n  );\n\n  let html = `<div style=\"overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border)\">\n  <table style=\"min-width:320px\">\n    <thead><tr>\n      <th style=\"text-align:left\">Mes<\u002Fth>\n      <th>Inicio mes<\u002Fth>\n      <th>Monto actual<\u002Fth>\n      <th>Rentabilidad<\u002Fth>\n    <\u002Ftr><\u002Fthead>\n    <tbody>`;\n\n  let prevBalUsd = null;\n  months.forEach(ym=>{\n    const isFuture = ym > currentYM;\n    const isCurrent = ym === currentYM;\n    const label = new Date(ym+'-02').toLocaleDateString('es-PE',{month:'long'});\n    const labelCap = label.charAt(0).toUpperCase()+label.slice(1);\n\n    const balInicio = balances[ym] != null ? balances[ym] : null;\n    const deps = depsByMonth[ym] || 0;\n    // Monto actual = balance inicio + depósitos del mes\n    const montoActual = balInicio != null ? balInicio + deps : null;\n\n    // Rentabilidad = (balance inicio de este mes - balance inicio del mes anterior) / balance inicio del mes anterior\n    let rentStr = `<span style=\"color:var(--text3)\">—<\u002Fspan>`;\n    if(balInicio != null && prevBalUsd != null && prevBalUsd > 0){\n      const ganancia = balInicio - prevBalUsd;\n      const rentab = (ganancia / prevBalUsd) * 100;\n      rentStr = `<span style=\"color:${rentab>=0?'var(--green)':'var(--red)'};font-weight:700\">${rentab>=0?'+':''}${rentab.toFixed(2)}%<\u002Fspan>\n                 <span style=\"font-size:10px;color:${ganancia>=0?'var(--green)':'var(--red)'}\"> (${ganancia>=0?'+':''}$${f(Math.abs(ganancia))})<\u002Fspan>`;\n    }\n\n    const rowBg = isCurrent ? 'background:var(--surface2)' : '';\n\n    // Inicio mes cell — clickable to enter balance\n    const inicioCell = !isFuture\n      ? `<td style=\"color:${balInicio!=null?'var(--yellow)':'var(--text3)'};cursor:pointer\" data-mes=\"${ym}\" onclick=\"openBalModal(this.getAttribute('data-mes'))\" title=\"Toca para editar\">\n           ${balInicio!=null ? '$'+f(balInicio) : '<span style=\"font-size:11px;border:1px dashed var(--border2);border-radius:4px;padding:2px 7px;color:var(--text3)\">+ añadir<\u002Fspan>'}\n         <\u002Ftd>`\n      : `<td style=\"color:var(--text3)\">—<\u002Ftd>`;\n\n    const actualCell = montoActual != null\n      ? `<td style=\"color:var(--hapi);font-weight:600\">$${f(montoActual)}<\u002Ftd>`\n      : `<td style=\"color:var(--text3)\">—<\u002Ftd>`;\n\n    html += `<tr style=\"${rowBg}\">\n      <td style=\"text-align:left;font-weight:${isCurrent?'700':'500'};color:${isCurrent?'var(--text)':'var(--text2)'}\">\n        ${labelCap}${isCurrent?' <span style=\"font-size:9px;color:var(--hapi);border:1px solid var(--hapi-dim);border-radius:4px;padding:1px 4px\">hoy<\u002Fspan>':''}\n      <\u002Ftd>\n      ${inicioCell}\n      ${actualCell}\n      <td>${rentStr}<\u002Ftd>\n    <\u002Ftr>`;\n\n    if(balInicio != null) prevBalUsd = balInicio;\n  });\n\n  html += `<\u002Ftbody><\u002Ftable><\u002Fdiv>\n  <div style=\"font-size:10px;color:var(--text3);margin-top:6px;padding:0 2px\">\n    \"Inicio mes\" se llena solo con el valor de Mis acciones la primera vez que abres la app en el mes. Tócalo para corregirlo.\n  <\u002Fdiv>`;\n  el.innerHTML = html;\n}\n\nfunction resetData(){\n  if(!confirm('¿Borrar TODOS los datos guardados? Esto no se puede deshacer.\\nExporta un respaldo primero si quieres guardar algo.'))return;\n  localStorage.removeItem('fin_personal_v1');\n  data={years:[new Date().getFullYear()],transactions:[],hapi:[],productos:[],catalogo:[],ventasProd:[]};\n  activeYear=data.years[0];\n  saveData();buildYearSel();renderAll();\n  toast('Datos reiniciados','ok');\n}\nfunction toggleBackup(){document.getElementById('backupPanel').classList.toggle('open');updateStorageLabel();}\nfunction storageBytes(){\n  try{ return new Blob([localStorage.getItem('fin_personal_v1')||'']).size; }catch(e){ return 0; }\n}\nfunction updateStorageLabel(){\n  const el=document.getElementById('storageLabel'); if(!el) return;\n  const mb=storageBytes()/1048576;\n  const pct=Math.min(100,Math.round(mb/5*100));\n  el.textContent='· Espacio usado: '+mb.toFixed(2)+' MB de ~5 MB ('+pct+'%)';\n  el.style.color = pct>=80 ? 'var(--red)' : pct>=60 ? 'var(--yellow)' : 'var(--text2)';\n  if(pct>=80) el.textContent+=' — exporta y borra fotos que no uses';\n}\nfunction backupPayload(){\n  const now=new Date();\n  return {\n    now,\n    name:'finanzas_'+now.toISOString().slice(0,10)+'.json',\n    json:JSON.stringify({version:1,exported:now.toISOString(),data},null,2),\n    texto:'Respaldo Finanzas — '+now.toLocaleDateString('es-PE')+' · '+(data.transactions||[]).length+' movimientos, '+(data.catalogo||[]).length+' productos, '+(data.ventasProd||[]).length+' ventas.'\n  };\n}\nasync function compartirBackup(titulo){\n  const b=backupPayload();\n  const file=new File([b.json], b.name, {type:'application/json'});\n  if(navigator.canShare && navigator.canShare({files:[file]})){\n    try{\n      await navigator.share({files:[file], title:titulo, text:b.texto});\n      localStorage.setItem('fin_lastbackup', b.now.toLocaleString('es-PE'));\n      updateLastBackupLabel();\n      toast('Respaldo enviado','ok');\n      return true;\n    }catch(err){ if(err.name==='AbortError') return true; }\n  }\n  return false;\n}\nasync function shareBackup(){\n  if(await compartirBackup('Respaldo Finanzas')) return;\n  exportData();\n  toast('Archivo descargado — adjúntalo en WhatsApp','ok');\n  const b=backupPayload();\n  setTimeout(()=>{ window.location.href='https://wa.me/?text='+encodeURIComponent(b.texto); }, 700);\n}\nasync function mailBackup(){\n  if(await compartirBackup('Respaldo Finanzas')) return;\n  exportData();\n  const b=backupPayload();\n  toast('Archivo descargado — adjúntalo al correo','ok');\n  setTimeout(()=>{ window.location.href='mailto:?subject='+encodeURIComponent('Respaldo Finanzas '+b.now.toLocaleDateString('es-PE'))+'&body='+encodeURIComponent(b.texto+'\\n\\n(Adjunta el archivo '+b.name+' que se acaba de descargar.)'); }, 700);\n}\nfunction exportData(){\n  const now=new Date();\n  const blob=new Blob([JSON.stringify({version:1,exported:now.toISOString(),data},null,2)],{type:'application/json'});\n  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`finanzas_${now.toISOString().slice(0,10)}.json`;a.click();\n  localStorage.setItem('fin_lastbackup',now.toLocaleString('es-PE'));updateLastBackupLabel();updateStorageLabel();toast('Respaldo exportado','ok');\n}\nfunction importData(e){\n  const file=e.target.files[0];if(!file)return;\n  const reader=new FileReader();\n  reader.onload=ev=>{\n    try{\n      const parsed=JSON.parse(ev.target.result);\n      if(!parsed.data)throw new Error();\n      if(!confirm('¿Restaurar datos del respaldo? Esto reemplaza todo lo actual.'))return;\n      data=parsed.data;\n      if(!Array.isArray(data.hapi))data.hapi=[];if(!Array.isArray(data.productos))data.productos=[];\n      if(!Array.isArray(data.catalogo))data.catalogo=[];if(!Array.isArray(data.ventasProd))data.ventasProd=[];\n      saveData();buildYearSel();renderAll();toast('Datos restaurados','ok');\n    }catch(err){toast('Archivo inválido','err');}\n  };\n  reader.readAsText(file);e.target.value='';\n}\nfunction updateLastBackupLabel(){\n  const lb=localStorage.getItem('fin_lastbackup');\n  const el=document.getElementById('lastBackupLabel');\n  if(el)el.textContent=lb?'Último respaldo: '+lb:'Sin respaldo aún';\n}\nlet toastTimer;\nfunction toast(msg,type=''){\n  const t=document.getElementById('toast');t.textContent=msg;t.className='toast show '+type;\n  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.className='toast';},3000);\n}\n\n// ── TEMA CLARO/OSCURO ─────────────────────────────────────────────────────────\nfunction toggleTheme(){\n  const isLight=document.body.classList.toggle('light');\n  localStorage.setItem('fin_theme',isLight?'light':'dark');\n  updateThemeIcon(isLight);\n}\nfunction updateThemeIcon(isLight){\n  const icon=document.getElementById('themeIcon');\n  if(!icon)return;\n  icon.innerHTML=isLight\n    ?'<circle cx=\"12\" cy=\"12\" r=\"5\"/><line x1=\"12\" y1=\"1\" x2=\"12\" y2=\"3\"/><line x1=\"12\" y1=\"21\" x2=\"12\" y2=\"23\"/><line x1=\"4.22\" y1=\"4.22\" x2=\"5.64\" y2=\"5.64\"/><line x1=\"18.36\" y1=\"18.36\" x2=\"19.78\" y2=\"19.78\"/><line x1=\"1\" y1=\"12\" x2=\"3\" y2=\"12\"/><line x1=\"21\" y1=\"12\" x2=\"23\" y2=\"12\"/><line x1=\"4.22\" y1=\"19.78\" x2=\"5.64\" y2=\"18.36\"/><line x1=\"18.36\" y1=\"5.64\" x2=\"19.78\" y2=\"4.22\"/>'\n    :'<path d=\"M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z\"/>';\n}\nfunction loadTheme(){\n  const t=localStorage.getItem('fin_theme');\n  if(t==='light'){document.body.classList.add('light');updateThemeIcon(true);}\n}\n\n// ── FAB ───────────────────────────────────────────────────────────────────────\nfunction toggleFab(){\n  const menu=document.getElementById('fabMenu');\n  const icon=document.getElementById('fabIcon');\n  const open=menu.classList.toggle('open');\n  icon.innerHTML=open\n    ?'<path d=\"M18 6L6 18M6 6l12 12\"/>'\n    :'<path d=\"M12 5v14M5 12h14\"/>';\n}\nfunction closeFab(){\n  document.getElementById('fabMenu').classList.remove('open');\n  document.getElementById('fabIcon').innerHTML='<path d=\"M12 5v14M5 12h14\"/>';\n}\n// Close fab when clicking outside\ndocument.addEventListener('click',e=>{\n  const fab=document.getElementById('fabBtn');\n  const menu=document.getElementById('fabMenu');\n  if(fab&&menu&&!fab.contains(e.target)&&!menu.contains(e.target))closeFab();\n});\n\n// ── RACHA ─────────────────────────────────────────────────────────────────────\nfunction renderRacha(){\n  const el=document.getElementById('rachaCard');\n  if(!el)return;\n  const txs=data.transactions.filter(t=>getTxYear(t)===activeYear);\n  let racha=0;\n  let maxRacha=0;\n  const now=new Date();\n  const mi=now.getMonth();\n  for(let i=mi;i>=0;i--){\n    const mt=txs.filter(t=>getTxMonth(t)===i);\n    const ing=mt.filter(t=>t.tipo==='ingreso'&&!t.vaAHapi).reduce((a,t)=>a+t.monto,0);\n    const egr=mt.filter(t=>t.tipo==='egreso').reduce((a,t)=>a+t.monto,0);\n    if(ing-egr>0) racha++; else break;\n  }\n  for(let i=0;i<=mi;i++){\n    const mt=txs.filter(t=>getTxMonth(t)===i);\n    const ing=mt.filter(t=>t.tipo==='ingreso'&&!t.vaAHapi).reduce((a,t)=>a+t.monto,0);\n    const egr=mt.filter(t=>t.tipo==='egreso').reduce((a,t)=>a+t.monto,0);\n    if(ing-egr>0) maxRacha++; else maxRacha=0;\n  }\n  if(racha===0){el.style.display='none';return;}\n  el.style.display='flex';\n  const emoji=racha>=6?'🔥':racha>=3?'⚡':'✅';\n  el.innerHTML=`\n    <div style=\"font-size:24px\">${emoji}<\u002Fdiv>\n    <div>\n      <div style=\"font-size:13px;font-weight:700;color:var(--green)\">${racha} mes${racha>1?'es':''} consecutivo${racha>1?'s':''} con balance positivo<\u002Fdiv>\n      <div style=\"font-size:11px;color:var(--text3)\">Sigue así — cada mes que ahorras cuenta<\u002Fdiv>\n    <\u002Fdiv>`;\n}\n\n// ── BARRAS MENSUALES ──────────────────────────────────────────────────────────\nfunction renderBarrasMensuales(){\n  const el=document.getElementById('barrasMensuales');\n  if(!el)return;\n  const txs=data.transactions.filter(t=>getTxYear(t)===activeYear);\n  const MLAB=['E','F','M','A','M','J','J','A','S','O','N','D'];\n  const vals=MESES.map((_,mi)=>{\n    const mt=txs.filter(t=>getTxMonth(t)===mi);\n    const ing=mt.filter(t=>t.tipo==='ingreso'&&!t.vaAHapi).reduce((a,t)=>a+t.monto,0);\n    const egr=mt.filter(t=>t.tipo==='egreso').reduce((a,t)=>a+t.monto,0);\n    return {ing,egr};\n  });\n  const max=Math.max(...vals.map(v=>Math.max(v.ing,v.egr)),1);\n  const now=new Date();\n  const curMi=now.getFullYear()===activeYear?now.getMonth():11;\n  el.innerHTML=vals.map((v,i)=>{\n    const hIng=Math.round((v.ing/max)*60);\n    const hEgr=Math.round((v.egr/max)*60);\n    const isCur=i===curMi;\n    return `<div class=\"barra-col\">\n      <div class=\"barra-pair\">\n        <div class=\"barra-ing\" style=\"height:${hIng}px;opacity:${i>curMi?.3:1}\"><\u002Fdiv>\n        <div class=\"barra-egr\" style=\"height:${hEgr}px;opacity:${i>curMi?.3:1}\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"barra-label\" style=\"color:${isCur?'var(--text)':'var(--text3)'};font-weight:${isCur?'700':'400'}\">${MLAB[i]}<\u002Fdiv>\n    <\u002Fdiv>`;\n  }).join('');\n}\n\n// ── NOTAS ─────────────────────────────────────────────────────────────────────\nlet _notaEditId=null;\nfunction openNotaModal(id){\n  _notaEditId=id||null;\n  const n=id?(data.notas||[]).find(x=>x.id===id):null;\n  document.getElementById('notaModalTitle').textContent=n?'Editar nota':'Nueva nota';\n  document.getElementById('notaBtnDelete').style.display=n?'':'none';\n  document.getElementById('notaTexto').value=n?n.texto:'';\n  document.getElementById('notaModalBg').classList.add('open');\n  setTimeout(()=>document.getElementById('notaTexto').focus(),100);\n}\nfunction closeNotaModal(){document.getElementById('notaModalBg').classList.remove('open');}\nfunction saveNota(){\n  const texto=document.getElementById('notaTexto').value.trim();\n  if(!texto){toast('Escribe algo','err');return;}\n  if(!Array.isArray(data.notas))data.notas=[];\n  const prev=_notaEditId?(data.notas||[]).find(x=>x.id===_notaEditId):null;\n  const n={id:_notaEditId||Date.now().toString(),texto,fecha:new Date().toISOString().slice(0,10),hecha:!!(prev&&prev.hecha)};\n  if(_notaEditId){const i=data.notas.findIndex(x=>x.id===_notaEditId);if(i>=0)data.notas[i]=n;else data.notas.push(n);}\n  else data.notas.push(n);\n  saveData();closeNotaModal();renderNotas();renderNotasResumen();\n}\nfunction deleteNota(){\n  if(!confirm('¿Eliminar esta nota?'))return;\n  data.notas=(data.notas||[]).filter(x=>x.id!==_notaEditId);\n  saveData();closeNotaModal();renderNotas();renderNotasResumen();\n}\nfunction toggleNotaHecha(id,ev){\n  if(ev) ev.stopPropagation();\n  const n=(data.notas||[]).find(x=>x.id===id); if(!n) return;\n  n.hecha=!n.hecha; saveData(); renderNotas(); renderNotasResumen();\n  toast(n.hecha?'Nota marcada como hecha':'Nota pendiente otra vez','ok');\n}\nfunction notaCheck(n){\n  return '<button title=\"'+(n.hecha?'Marcar pendiente':'Marcar como hecha')+'\" onclick=\"toggleNotaHecha(\\''+n.id+'\\',event)\" style=\"flex-shrink:0;width:24px;height:24px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;border:2px solid '+(n.hecha?'var(--green)':'var(--border2)')+';background:'+(n.hecha?'var(--green)':'transparent')+';color:#fff\">'+(n.hecha?'<svg width=\"12\" height=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" viewBox=\"0 0 24 24\"><path d=\"M5 12l5 5 9-10\"><\u002Fpath><\u002Fsvg>':'')+'<\u002Fbutton>';\n}\nfunction renderNotas(){\n  const el=document.getElementById('notasList');\n  if(!el)return;\n  const notas=[...(data.notas||[])].sort((a,b)=>b.fecha.localeCompare(a.fecha));\n  if(!notas.length){el.innerHTML='<div class=\"empty-tx\">Sin notas aún. Toca \"Nueva nota\" para agregar.<\u002Fdiv>';return;}\n  const item=n=>'<div class=\"nota-item\" onclick=\"openNotaModal(\\''+n.id+'\\')\" style=\"display:flex;gap:12px;align-items:flex-start'+(n.hecha?';opacity:.55':'')+'\">'+notaCheck(n)+\n    '<div style=\"flex:1;min-width:0\"><div class=\"nota-text\" style=\"'+(n.hecha?'text-decoration:line-through':'')+'\">'+escH(n.texto)+'<\u002Fdiv>'+\n    '<div class=\"nota-date\">'+new Date(n.fecha+'T12:00:00').toLocaleDateString('es-PE',{day:'2-digit',month:'long',year:'numeric'})+'<\u002Fdiv><\u002Fdiv><\u002Fdiv>';\n  const pend=notas.filter(n=>!n.hecha), hechas=notas.filter(n=>n.hecha);\n  el.innerHTML=(pend.length?pend.map(item).join(''):'<div class=\"empty-tx\">No tienes notas pendientes.<\u002Fdiv>')+\n    (hechas.length?'<details style=\"margin-top:14px\"><summary style=\"cursor:pointer;font-size:12px;color:var(--text2);margin-bottom:8px\">Hechas ('+hechas.length+')<\u002Fsummary>'+hechas.map(item).join('')+'<\u002Fdetails>':'');\n}\n\n// ── CATEGORÍAS PERSONALIZADAS ─────────────────────────────────────────────────\nfunction openCatModal(){\n  renderCatTags();\n  document.getElementById('catModalBg').classList.add('open');\n}\nfunction closeCatModal(){document.getElementById('catModalBg').classList.remove('open');}\nfunction addCatCustom(){\n  const inp=document.getElementById('catNueva');\n  const val=inp.value.trim();\n  if(!val)return;\n  if(!Array.isArray(data.catsCustom))data.catsCustom=[];\n  if(data.catsCustom.includes(val)||['Comidas','Pasajes','Fiestas','Spotify','Otros'].includes(val)){\n    toast('Esa categoría ya existe','err');return;\n  }\n  data.catsCustom.push(val);\n  inp.value='';\n  saveData();renderCatTags();updateEgrCats();\n}\nfunction removeCatCustom(cat){\n  data.catsCustom=(data.catsCustom||[]).filter(c=>c!==cat);\n  saveData();renderCatTags();updateEgrCats();\n}\nfunction renderCatTags(){\n  const el=document.getElementById('catTagsList');\n  if(!el)return;\n  const cats=data.catsCustom||[];\n  if(!cats.length){el.innerHTML='<span style=\"font-size:11px;color:var(--text3)\">Sin categorías personalizadas aún.<\u002Fspan>';return;}\n  el.innerHTML=cats.map(c=>`<span class=\"cat-tag\">${c}<button onclick=\"removeCatCustom('${c}')\" title=\"Eliminar\">×<\u002Fbutton><\u002Fspan>`).join('');\n}\nfunction updateEgrCats(){\n  const custom=data.catsCustom||[];\n  const usadas=[...new Set((data.transactions||[]).filter(t=>t.tipo==='egreso').map(t=>t.cat).filter(Boolean))];\n  const all=[...new Set([...['Comidas','Pasajes','Fiestas','Spotify'],...custom,...usadas])];\n  // Update filter select\n  const egrCatEl=document.getElementById('egrCat');\n  if(egrCatEl){\n    const cur=egrCatEl.value;\n    egrCatEl.innerHTML='<option value=\"\">Todas las categorías<\u002Foption>'+all.map(c=>`<option${cur===c?' selected':''}>${c}<\u002Foption>`).join('');\n  }\n  // Update EGR_CATS array used in modal (sin las categorías solo heredadas de datos viejos)\n  window._EGR_CATS_ALL=[...new Set([...['Comidas','Pasajes','Fiestas','Spotify'],...custom])];\n}\nfunction getEgrCats(){return window._EGR_CATS_ALL||EGR_CATS;}\nfunction getIngCats(){\n  if(!Array.isArray(data.ingCatsCustom)) data.ingCatsCustom=[];\n  return [...new Set(ING_CATS.concat(data.ingCatsCustom))];\n}\nfunction fillTxCats(type, valor){\n  const sel=document.getElementById('txCat'); if(!sel) return;\n  let cats=(type==='ingreso'?getIngCats():getEgrCats()).slice();\n  const edit=editTxId?data.transactions.find(t=>t.id===editTxId):null;\n  const actual=valor||(edit?edit.cat:'');\n  if(actual&&!cats.includes(actual)) cats.push(actual);\n  sel.innerHTML=cats.map(c=>'<option'+(c===actual?' selected':'')+'>'+c+'<\u002Foption>').join('')+\n    '<option value=\"__new__\">＋ Otra categoría...<\u002Foption>';\n  if(actual) sel.value=actual;\n  if(typeof onCatChange==='function') onCatChange();\n}\nfunction onTxCatChange(sel){\n  if(sel.value!=='__new__'){ if(typeof onCatChange==='function') onCatChange(); return; }\n  const nombre=(prompt('Nombre de la nueva categoría:')||'').trim();\n  if(!nombre){ fillTxCats(txType); return; }\n  if(txType==='ingreso'){\n    if(!Array.isArray(data.ingCatsCustom)) data.ingCatsCustom=[];\n    const ya=getIngCats().find(c=>c.toLowerCase()===nombre.toLowerCase());\n    if(!ya) data.ingCatsCustom.push(nombre);\n    saveData(); updateIngCatsFilter(); fillTxCats('ingreso', ya||nombre);\n    toast(ya?'Esa categoría ya existía':'Categoría \"'+nombre+'\" agregada','ok');\n  } else {\n    if(!Array.isArray(data.catsCustom)) data.catsCustom=[];\n    const ya=getEgrCats().find(c=>c.toLowerCase()===nombre.toLowerCase());\n    if(!ya) data.catsCustom.push(nombre);\n    saveData(); updateEgrCats(); fillTxCats('egreso', ya||nombre);\n    toast(ya?'Esa categoría ya existía':'Categoría \"'+nombre+'\" agregada','ok');\n  }\n}\nfunction updateIngCatsFilter(){\n  const el=document.getElementById('ingCat'); if(!el) return;\n  const cur=el.value;\n  const usadas=[...new Set(data.transactions.filter(t=>t.tipo==='ingreso').map(t=>t.cat).filter(Boolean))];\n  const all=[...new Set(getIngCats().concat(usadas))];\n  el.innerHTML='<option value=\"\">Todas las fuentes<\u002Foption>'+all.map(c=>'<option'+(cur===c?' selected':'')+'>'+c+'<\u002Foption>').join('');\n}\n\nwindow.__appStart=function(){\nloadData();\nloadTheme();\naplicarFijosAuto();\ninitCloud();\nfetchTcHoy(false);\nsetTimeout(()=>fetchPrecios(false),1500);\nsetInterval(()=>{ if(document.visibilityState==='visible') fetchPrecios(false); },5*60*1000);\ndocument.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') fetchPrecios(false); });\nsetTimeout(()=>fetchPrecios(false),3000);\n};\nif(window.__appUnlocked) window.__appStart();\n\n// ── SERVICE WORKER ────────────────────────────────────────────────────────────\nif('serviceWorker' in navigator){\n  navigator.serviceWorker.register('sw.js').catch(()=>{});\n}\n<\u002Fscript>\n\n\n<script id=\"mejoras-movil-js\">\n(function(){\n  var mq=window.matchMedia('(max-width:640px)');\n  function labels(){var w=document.querySelector('.month-table-wrap');if(!w)return;var ths=[].map.call(w.querySelectorAll('thead th'),function(t){return t.textContent.trim();});\n    w.querySelectorAll('tbody tr').forEach(function(tr){[].forEach.call(tr.children,function(td,i){td.setAttribute('data-l',ths[i]||'');var v=td.textContent.trim();td.classList.toggle('vacio',i>0&&i<tr.children.length-1&&(/^(S\\/\\s*)?[-–—]?\\s*0([.,]00)?$/.test(v)||v===''||v==='—'||v==='-'));});});}\n  function init(){\n    var body=document.getElementById('monthTableBody');if(body){new MutationObserver(labels).observe(body,{childList:true,subtree:true});labels();}\n    var tabs=document.querySelector('.tabs');if(!tabs)return;\n    var mas=document.createElement('div');mas.className='tab tab-mas';\n    mas.innerHTML='<span class=\"tab-icon\"><svg width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" viewBox=\"0 0 24 24\"><circle cx=\"5\" cy=\"12\" r=\"1.5\"/><circle cx=\"12\" cy=\"12\" r=\"1.5\"/><circle cx=\"19\" cy=\"12\" r=\"1.5\"/><\u002Fsvg><\u002Fspan>Más';\n    tabs.appendChild(mas);\n    var sh=document.createElement('div');sh.className='mas-sheet';\n    var src=tabs.querySelectorAll('.tab:not(.tab-mas)');\n    [['grafico',5,'Gráfico'],['notas',6,'Notas']].forEach(function(x){var b=document.createElement('button');b.type='button';b.innerHTML=(src[x[1]].querySelector('.tab-icon')||{}).innerHTML+'<span>'+x[2]+'<\u002Fspan>';b.onclick=function(){sh.classList.remove('open');switchTab(x[0]);window.scrollTo(0,0);};sh.appendChild(b);});\n    document.body.appendChild(sh);\n    if(!mq.matches)mas.style.display='none';\n    mq.addEventListener&&mq.addEventListener('change',function(){mas.style.display=mq.matches?'':'none';sh.classList.remove('open');});\n    mas.onclick=function(e){e.stopPropagation();sh.classList.toggle('open');};\n    document.addEventListener('click',function(e){if(!sh.contains(e.target))sh.classList.remove('open');});\n    var orig=window.switchTab;\n    window.switchTab=function(t){orig.apply(this,arguments);mas.classList.toggle('active',t==='grafico'||t==='notas');sh.classList.remove('open');};\n    [].forEach.call(src,function(tb,i){var id=['resumen','ingresos','egresos','hapi','productos','grafico','notas'][i];tb.setAttribute('onclick','');tb.onclick=function(){window.switchTab(id);window.scrollTo(0,0);};});\n  }\n  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();\n})();\n<\u002Fscript><\u002Fbody><\u002Fhtml>"</script>
