 stockCosto=(data.catalogo||[]).reduce((a,p)=>a+(parseFloat(p.costo)||0)*(parseInt(p.stock)||0),0);\n    pc.innerHTML=[\n      ['Invertido','S/ '+f(invY),''],\n      ['Vendido','S/ '+f(vend),'green'],\n      ['Ganancia','S/ '+f(ganP),ganP>=0?'green':'red'],\n      ['Stock a costo','S/ '+f(stockCosto),'yellow'],\n    ].map(a=>'<div class=\"sum-card\"><div class=\"sum-label\">'+a[0]+'<\u002Fdiv><div class=\"sum-value '+a[2]+'\">'+a[1]+'<\u002Fdiv><\u002Fdiv>').join('');\n  }\n\n  // Hapi and productos movements indexed by month\n  function movesForMonth(arr, mi){\n    return (arr||[]).filter(m=>m.fecha&&parseInt(m.fecha.slice(5,7))-1===mi);\n  }\n  function netForMonth(arr, mi){\n    return movesForMonth(arr,mi).reduce((a,m)=>a+(m.tipo==='deposito'?m.monto:-m.monto),0);\n  }\n\n  let rows='';\n  let tots={esp:0,uni:0,ven:0,ing:0,com:0,pas:0,fie:0,spo:0,egr:0,hapi:0,prod:0,bal:0};\n  MESES.forEach((mes,mi)=>{\n    const mt=txs.filter(t=>getTxMonth(t)===mi);\n    const espAll=mt.filter(t=>t.tipo==='ingreso'&&t.cat==='Trabajo España');\n    const esp=espAll.filter(t=>!t.vaAHapi).reduce((a,t)=>a+t.monto,0);\n    const uni=sum(mt,'ingreso','Trabajo La Unión');\n    const ven=sum(mt,'ingreso','Venta de productos');\n    const ing=esp+uni+ven;\n    const com=sum(mt,'egreso','Comidas');\n    const pas=sum(mt,'egreso','Pasajes');\n    const fie=sum(mt,'egreso','Fiestas');\n    const spo=sum(mt,'egreso','Spotify');\n    const egr=mt.filter(t=>t.tipo==='egreso').reduce((a,t)=>a+t.monto,0);\n    const hapi=netForMonth(data.hapi,mi);\n    const prod=netForMonth(data.productos,mi);\n    const b=ing-egr+hapi-prod;\n    tots.esp+=esp;tots.uni+=uni;tots.ven+=ven;tots.ing+=ing;\n    tots.com+=com;tots.pas+=pas;tots.fie+=fie;tots.spo+=spo;tots.egr+=egr;\n    tots.hapi+=hapi;tots.prod+=prod;tots.bal+=b;\n    rows+=`<tr>\n      <td>${mes}<\u002Ftd>\n      <td class=\"g\">${esp?'S/'+f(esp):'-'}<\u002Ftd>\n      <td class=\"g\">${uni?'S/'+f(uni):'-'}<\u002Ftd>\n      <td class=\"p\">${ven?'S/'+f(ven):'-'}<\u002Ftd>\n      <td class=\"g\">${ing?'S/'+f(ing):'-'}<\u002Ftd>\n      <td class=\"r\">${com?'S/'+f(com):'-'}<\u002Ftd>\n      <td class=\"y\">${pas?'S/'+f(pas):'-'}<\u002Ftd>\n      <td class=\"r\">${fie?'S/'+f(fie):'-'}<\u002Ftd>\n      <td style=\"color:#1db954\">${spo?'S/'+f(spo):'-'}<\u002Ftd>\n      <td class=\"r\">${egr?'S/'+f(egr):'-'}<\u002Ftd>\n      <td style=\"color:var(--hapi)\">${hapi?'S/'+f(hapi):'-'}<\u002Ftd>\n      <td class=\"r\">${prod?'S/'+f(prod):'-'}<\u002Ftd>\n      <td class=\"${b>=0?'pos':'neg'}\">${b?'S/'+f(b):'-'}<\u002Ftd>\n    <\u002Ftr>`;\n  });\n  tots.bal=tots.ing-tots.egr+tots.hapi-tots.prod;\n  rows+=`<tr class=\"total-row\">\n    <td>TOTAL<\u002Ftd>\n    <td class=\"g\">S/${f(tots.esp)}<\u002Ftd>\n    <td class=\"g\">S/${f(tots.uni)}<\u002Ftd>\n    <td class=\"p\">S/${f(tots.ven)}<\u002Ftd>\n    <td class=\"g\">S/${f(tots.ing)}<\u002Ftd>\n    <td class=\"r\">S/${f(tots.com)}<\u002Ftd>\n    <td class=\"y\">S/${f(tots.pas)}<\u002Ftd>\n    <td class=\"r\">S/${f(tots.fie)}<\u002Ftd>\n    <td style=\"color:#1db954\">S/${f(tots.spo)}<\u002Ftd>\n    <td class=\"r\">S/${f(tots.egr)}<\u002Ftd>\n    <td style=\"color:var(--hapi)\">S/${f(tots.hapi)}<\u002Ftd>\n    <td class=\"r\">S/${f(tots.prod)}<\u002Ftd>\n    <td class=\"${tots.bal>=0?'pos':'neg'}\">S/${f(tots.bal)}<\u002Ftd>\n  <\u002Ftr>`;\n  document.getElementById('monthTableBody').innerHTML=rows;\n}\n\nfunction renderTx(){\n  buildMonthFilters();\n  const yTxs=data.transactions.filter(t=>getTxYear(t)===activeYear);\n\n  const ingMesEl=document.getElementById('ingMes');\n  const ingCatEl=document.getElementById('ingCat');\n  const ingMes=ingMesEl?ingMesEl.value:'';\n  const ingCat=ingCatEl?ingCatEl.value:'';\n  let ings=yTxs.filter(t=>t.tipo==='ingreso');\n  if(ingMes!=='')ings=ings.filter(t=>getTxMonth(t)===parseInt(ingMes));\n  if(ingCat)ings=ings.filter(t=>t.cat===ingCat);\n  ings.sort((a,b)=>b.fecha.localeCompare(a.fecha));\n  const ingEl=document.getElementById('ingresosList');\n  if(ingEl)ingEl.innerHTML=ings.length?ings.map(txCard).join(''):`<div class=\"empty-tx\">Sin ingresos para este filtro<\u002Fdiv>`;\n\n  const egrMesEl=document.getElementById('egrMes');\n  const egrCatEl=document.getElementById('egrCat');\n  const egrMes=egrMesEl?egrMesEl.value:'';\n  const egrCat=egrCatEl?egrCatEl.value:'';\n  let egrs=yTxs.filter(t=>t.tipo==='egreso');\n  if(egrMes!=='')egrs=egrs.filter(t=>getTxMonth(t)===parseInt(egrMes));\n  if(egrCat)egrs=egrs.filter(t=>t.cat===egrCat);\n  egrs.sort((a,b)=>b.fecha.localeCompare(a.fecha));\n  const egrEl=document.getElementById('egresosList');\n  if(egrEl)egrEl.innerHTML=egrs.length?egrs.map(txCard).join(''):`<div class=\"empty-tx\">Sin egresos para este filtro<\u002Fdiv>`;\n}\n\nfunction buildMonthFilters(){\n  ['ingMes','egrMes','hapiMes','productosMes'].forEach(id=>{\n    const s=document.getElementById(id);\n    if(!s)return;\n    const cur=s.value;\n    s.innerHTML=`<option value=\"\">Todos los meses<\u002Foption>`+MESES.map((m,i)=>`<option value=\"${i}\"${cur===String(i)?' selected':''}>${m}<\u002Foption>`).join('');\n  });\n}\n\nfunction txCard(t){\n  const dot=CAT_DOTS[t.cat]||'#999';\n  const ds=t.fecha?new Date(t.fecha+'T12:00:00').toLocaleDateString('es-PE',{day:'2-digit',month:'short'}):'';\n  const origTag=t.montoOrig?` · $${f(t.montoOrig)} USD`:'';\n  const recTag=t.recurrente?`<svg width=\"10\" height=\"10\" fill=\"none\" stroke=\"var(--yellow)\" stroke-width=\"2\" viewBox=\"0 0 24 24\" style=\"flex-shrink:0;pointer-events:none\"><path d=\"M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8\"/><path d=\"M3 3v5h5\"/><\u002Fsvg>`:'';\n  const hapiTag=t.vaAHapi?`<svg width=\"10\" height=\"10\" fill=\"none\" stroke=\"var(--hapi)\" stroke-width=\"2\" viewBox=\"0 0 24 24\" style=\"flex-shrink:0\" title=\"Va a Hapi\"><path d=\"M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z\"/><path d=\"M12 6v6l4 2\"/><\u002Fsvg>`:'';\n  return `<div class=\"tx-item\" onclick=\"openTxModal('${t.tipo}','${t.id}')\">\n    <div class=\"tx-dot\" style=\"background:${dot}\"><\u002Fdiv>\n    <div class=\"tx-info\"><div class=\"tx-name\" style=\"display:flex;align-items:center;gap:5px\">${recTag}${hapiTag}${t.desc}<\u002Fdiv><div class=\"tx-meta\">${t.cat}${t.vaAHapi?' · → Hapi':''}${ds?' · '+ds:''}${origTag}${t.nota?' · '+t.nota:''}<\u002Fdiv><\u002Fdiv>\n    <div class=\"tx-amount ${t.tipo==='ingreso'?'g':'r'}\">${t.tipo==='ingreso'?'+':'-'} S/${f(t.monto)}<\u002Fdiv>\n  <\u002Fdiv>`;\n}\n\nfunction renderGastosFijos(){\n  const el=document.getElementById('gastosFijosBanner');\n  if(!el)return;\n  const now=new Date();\n  const mi=now.getMonth();\n  const yr=now.getFullYear();\n\n  // Find all unique recurrentes (latest instance of each desc+cat)\n  const recurrentes=[];\n  const seen=new Set();\n  [...data.transactions].reverse().forEach(t=>{\n    if(!t.recurrente)return;\n    const key=t.tipo+'|'+t.desc+'|'+t.cat;\n    if(seen.has(key))return;\n    seen.add(key);\n    recurrentes.push(t);\n  });\n\n  if(!recurrentes.length){el.innerHTML='';return;}\n\n  // Check which are missing this month\n  const pendientes=recurrentes.filter(r=>{\n    return !data.transactions.some(t=>\n      t.desc===r.desc&&t.cat===r.cat&&t.tipo===r.tipo&&\n      t.fecha&&parseInt(t.fecha.slice(5,7))-1===mi&&parseInt(t.fecha.slice(0,4))===yr\n    );\n  });\n\n  if(!pendientes.length){\n    el.innerHTML=`<div style=\"display:flex;align-items:center;gap:7px;background:var(--green-bg);border:1px solid var(--green-dim);border-radius:var(--radius);padding:10px 12px;margin-bottom:10px;font-size:12px;color:var(--green)\">\n      <svg width=\"13\" height=\"13\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><polyline points=\"20 6 9 17 4 12\"/><\u002Fsvg>\n      Todos los gastos fijos registrados este mes\n    <\u002Fdiv>`;\n    return;\n  }\n\n  el.innerHTML=`<div style=\"background:var(--yellow-bg);border:1px solid var(--yellow-dim);border-radius:var(--radius);padding:10px 12px;margin-bottom:10px\">\n    <div style=\"font-size:11px;font-weight:600;color:var(--yellow);display:flex;align-items:center;gap:5px;margin-bottom:8px\">\n      <svg width=\"12\" height=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path d=\"M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8\"/><path d=\"M3 3v5h5\"/><\u002Fsvg>\n      ${pendientes.length} gasto${pendientes.length>1?'s':''} fijo${pendientes.length>1?'s':''} pendiente${pendientes.length>1?'s':''} este mes\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:5px\">\n      ${pendientes.map(r=>`\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px\">\n          <span style=\"font-size:12px;color:var(--text)\">${r.desc} <span style=\"color:var(--text3)\">· ${r.cat}<\u002Fspan><\u002Fspan>\n          <span style=\"font-size:12px;font-weight:600;color:var(--red)\">S/ ${f(r.monto)}<\u002Fspan>\n        <\u002Fdiv>`).join('')}\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n}\n\nfunction setTxType(type){\n  txType=type;\n  document.getElementById('typeIng').className='type-btn'+(type==='ingreso'?' sel-ing':'');\n  document.getElementById('typeEgr').className='type-btn'+(type==='egreso'?' sel-egr':'');\n  document.getElementById('txBtnSave').className=type==='ingreso'?'btn btn-green':'btn btn-red';\n  fillTxCats(type);\n  const d=document.getElementById('txDesc');\n  if(d) d.placeholder=type==='ingreso'?'Ej: Sueldo junio':'Ej: Almuerzo, pasaje, recarga';\n}\n\nfunction openTxModal(tipo,id){\n  editTxId=id||null;txType=tipo||'ingreso';\n  const tx=id?data.transactions.find(t=>t.id===id):null;\n  if(tx)txType=tx.tipo;\n  document.getElementById('txModalTitle').textContent=tx?'Editar movimiento':(txType==='ingreso'?'Nuevo ingreso':'Nuevo egreso');\n  document.getElementById('txBtnDelete').style.display=tx?'':'none';\n  document.getElementById('txTypeField').style.display=tx?'':'none';\n  setTxType(txType);\n  document.getElementById('txDesc').value=tx?tx.desc:'';\n  document.getElementById('txMonto').value=tx?tx.monto:'';\n  document.getElementById('txFecha').value=tx?tx.fecha:new Date().toISOString().slice(0,10);\n  document.getElementById('txNota').value=tx?tx.nota:'';\n  document.getElementById('txRecurrente').checked=tx?!!tx.recurrente:false;\n  document.getElementById('txVaAHapi').checked=tx?!!tx.vaAHapi:false;\n  window._hapiComision=0.0045;\n  setHapiComision(0.0045);\n  const comWrap=document.getElementById('txHapiComisionWrap');\n  if(comWrap) comWrap.style.display=(tx&&tx.vaAHapi)?'flex':'none';\n  // Only show recurrente for egresos\n  const wrap=document.getElementById('txRecurrenteWrap');\n  if(wrap) wrap.style.display=txType==='egreso'?'flex':'none';\n  if(tx)document.getElementById('txCat').value=tx.cat;\n  setTimeout(()=>onCatChange(),50);\n  document.getElementById('txModalBg').classList.add('open');\n  setTimeout(()=>document.getElementById('txDesc').focus(),100);\n}\nfunction closeTxModal(){document.getElementById('txModalBg').classList.remove('open');}\nfunction bgClickTx(e){if(e.target===document.getElementById('txModalBg'))closeTxModal();}\n\nwindow._hapiComision=0.0045;\nfunction setHapiComision(val){\n  window._hapiComision=val;\n  const btns={'0.0045':'comBtn045','0.0099':'comBtn099','0':'comBtnNone'};\n  Object.entries(btns).forEach(([k,id])=>{\n    const el=document.getElementById(id);\n    if(!el)return;\n    const active=parseFloat(k)===val;\n    el.style.background=active?'var(--hapi-bg)':'var(--surface2)';\n    el.style.color=active?'var(--hapi)':'var(--text2)';\n    el.style.borderColor=active?'var(--hapi-dim)':'var(--border2)';\n  });\n}\nfunction onVaAHapiChange(){\n  const checked=document.getElementById('txVaAHapi').checked;\n  const wrap=document.getElementById('txHapiComisionWrap');\n  if(wrap) wrap.style.display=checked?'flex':'none';\n}\nwindow._invComision=0.0045;\nfunction setInvComision(val){\n  window._invComision=val;\n  const btns={0.0045:'invComBtn045',0.009:'invComBtn090',0:'invComBtnNone'};\n  Object.entries(btns).forEach(([k,id])=>{\n    const el=document.getElementById(id);\n    if(!el)return;\n    const active=parseFloat(k)===val;\n    el.style.background=active?'var(--hapi-bg)':'var(--surface2)';\n    el.style.color=active?'var(--hapi)':'var(--text2)';\n    el.style.borderColor=active?'var(--hapi-dim)':'var(--border2)';\n  });\n  updateInvUsdPreview();\n}\nfunction saveTx(){\n  const desc=document.getElementById('txDesc').value.trim();\n  const monto=parseFloat(document.getElementById('txMonto').value);\n  const fecha=document.getElementById('txFecha').value;\n  if(!desc){toast('Agrega una descripción','err');return;}\n  if(!monto||monto<=0){toast('Agrega un monto válido','err');return;}\n  if(!fecha){toast('Selecciona una fecha','err');return;}\n  const cat=document.getElementById('txCat').value;\n  const isEsp=cat==='Trabajo España';\n  const montoFinal=isEsp?parseFloat((monto*getTc()).toFixed(2)):monto;\n  const recurrente=document.getElementById('txRecurrente').checked;\n  const vaAHapi=isEsp&&txType==='ingreso'&&document.getElementById('txVaAHapi').checked;\n  const txId=editTxId||Date.now().toString();\n  const tx={id:txId,tipo:txType,desc,monto:montoFinal,fecha,cat,nota:document.getElementById('txNota').value.trim(),montoOrig:isEsp?monto:null,montoOrigCur:isEsp?'USD':null,recurrente,vaAHapi};\n  if(editTxId){const i=data.transactions.findIndex(t=>t.id===editTxId);data.transactions[i]=tx;}\n  else{data.transactions.push(tx);}\n  // If \"va a Hapi\": auto-create or update the linked Hapi deposit\n  if(vaAHapi){\n    const HAPI_COMISION=window._hapiComision||0;\n    const comisionUsd=monto*HAPI_COMISION;\n    const montoNetoUsd=monto-comisionUsd;\n    const tc=getTc();\n    const hapiMove={\n      id:'hapi_linked_'+txId,\n      tipo:'deposito',\n      desc:'Depósito desde España — '+desc,\n      monto:parseFloat((montoNetoUsd*tc).toFixed(2)),\n      montoUsd:parseFloat(montoNetoUsd.toFixed(4)),\n      montoUsdBruto:monto,\n      comisionUsd:parseFloat(comisionUsd.toFixed(4)),\n      fecha,\n      nota:'Auto desde ingreso España',\n      linkedTxId:txId\n    };\n    // Remove any previously linked move for this tx\n    data.hapi=data.hapi.filter(m=>m.linkedTxId!==txId);\n    if(vaAHapi) data.hapi.push(hapiMove);\n    toast('Ingreso registrado y depósito creado en Hapi (−$'+f(comisionUsd)+' comisión)','ok');\n  } else {\n    // If editing and previously had a linked hapi move, remove it\n    data.hapi=data.hapi.filter(m=>m.linkedTxId!==txId);\n  }\n  saveData();closeTxModal();renderAll();\n}\nfunction deleteTx(){\n  if(!confirm('¿Eliminar este movimiento?'))return;\n  data.transactions=data.transactions.filter(t=>t.id!==editTxId);\n  saveData();closeTxModal();renderAll();\n}\n\n// ── INVERSIONES ───────────────────────────────────────────────────────────────\nfunction calcNet(moves){return moves.reduce((a,m)=>a+(m.tipo==='deposito'?m.monto:-m.monto),0);}\nfunction calcDeposits(moves){return moves.filter(m=>m.tipo==='deposito').reduce((a,m)=>a+m.monto,0);}\nfunction calcRetiros(moves){return moves.filter(m=>m.tipo==='retiro').reduce((a,m)=>a+m.monto,0);}\n\nfunction renderInvSection(src){\n  const moves=data[src]||[];\n  const net=calcNet(moves);\n  const deps=calcDeposits(moves);\n  const rets=calcRetiros(moves);\n  const color=src==='hapi'?'var(--hapi)':'var(--prod)';\n  const colorBg=src==='hapi'?'var(--hapi-bg)':'var(--prod-bg)';\n  const colorDim=src==='hapi'?'var(--hapi-dim)':'var(--prod-dim)';\n\n  const totalEl=document.getElementById(src+'Total');\n  if(totalEl){\n    if(src==='hapi'){\n      const tc=getTc(); const netUsd=net/tc;\n      totalEl.textContent='$ '+f(netUsd)+' · S/ '+f(net);\n    } else {\n      totalEl.textContent='S/ '+f(net);\n    }\n  }\n\n  const movesEl=document.getElementById(src+'Moves');\n  if(!movesEl)return;\n\n  // Apply filters\n  const mesEl=document.getElementById(src+'Mes');\n  const tipoEl=document.getElementById(src+'Tipo');\n  const mesFil=mesEl?mesEl.value:'';\n  const tipoFil=tipoEl?tipoEl.value:'';\n  let filtered=[...moves].sort((a,b)=>b.fecha.localeCompare(a.fecha));\n  if(mesFil!=='') filtered=filtered.filter(m=>{\n    const mo=m.fecha?parseInt(m.fecha.slice(5,7))-1:-1;\n    return mo===parseInt(mesFil);\n  });\n  if(tipoFil) filtered=filtered.filter(m=>m.tipo===tipoFil);\n\n  if(!filtered.length){\n    movesEl.innerHTML=`<div class=\"empty-tx\">Sin movimientos para este filtro.<\u002Fdiv>`;\n    return;\n  }\n  movesEl.innerHTML=filtered.map(m=>{\n    const ds=m.fecha?new Date(m.fecha+'T12:00:00').toLocaleDateString('es-PE',{day:'2-digit',month:'short'}):'';\n    const isIn=m.tipo==='deposito';\n    const dotColor=isIn?color:'var(--red)';\n    const openFn=src==='hapi'?`openInvModal('${src}','${m.id}')`:`openInvModal2('${src}','${m.id}')`;\n    const amtLine=src==='hapi'&&m.montoUsd\n      ? `<div class=\"tx-amount ${isIn?'g':'r'}\">${isIn?'+':'-'} $${f(m.montoUsd)}<\u002Fdiv>\n         <div style=\"font-size:10px;color:var(--text3);text-align:right\">S/ ${f(m.monto)}${isIn&&m.comisionUsd?' · −$'+f(m.comisionUsd)+' com.':''}<\u002Fdiv>`\n      : `<div class=\"tx-amount ${isIn?'g':'r'}\">${isIn?'+':'-'} S/${f(m.monto)}<\u002Fdiv>`;\n    return `<div class=\"tx-item\" onclick=\"${openFn}\" style=\"align-items:flex-start\">\n      <div class=\"tx-dot\" style=\"background:${dotColor};margin-top:5px\"><\u002Fdiv>\n      <div class=\"tx-info\">\n        <div class=\"tx-name\">${m.desc}<\u002Fdiv>\n        <div class=\"tx-meta\">${isIn?'Depósito':'Retiro'}${m.proveedor?' · '+m.proveedor:''}${ds?' · '+ds:''}${m.nota?' · '+m.nota:''}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"text-align:right\">${amtLine}<\u002Fdiv>\n    <\u002Fdiv>`;\n  }).join('');\n}\n\nfunction renderInv(){\n  buildMonthFilters();\n  renderInvSection('hapi');\n  renderProductosSection();\n}\n\nfunction setInvType(type){\n  invType=type;\n  const color=invSrc==='hapi'?'hapi':'prod';\n  document.getElementById('typeDeposito').className='type-btn'+(type==='deposito'?' sel-dep':'');\n  document.getElementById('typeRetiro').className='type-btn'+(type==='retiro'?' sel-ret':'');\n  document.getElementById('invBtnSave').className=type==='deposito'?`btn btn-${color}`:'btn btn-red';\n  updateInvUsdPreview();\n}\n\n// ── VOUCHERS DE PAGO (HAPI) ──────────────────────────────────────────────────\nconst VCH_DESDE='2000-01';\nlet _vchId=null, _vchCarpeta='';\nfunction vchList(){\n  if(!Array.isArray(data.vouchers)) data.vouchers=[];\n  data.vouchers.forEach(v=>{ if(!v.moneda) v.moneda='PEN'; if(typeof v.cat!=='string') v.cat=''; if(!v.tipo) v.tipo=(typeof v.img==='string'&&v.img.startsWith('data:application/pdf'))?'pdf':'img'; });\n  return data.vouchers;\n}\nfunction vchCats(){ if(!Array.isArray(data.vchCats)) data.vchCats=[]; return data.vchCats; }\nfunction vchAllCats(){\n  return [...new Set([...vchCats(), ...vchList().map(v=>v.cat).filter(Boolean)])].sort((a,b)=>a.localeCompare(b));\n}\nfunction vchSym(v){ return (v&&v.moneda==='USD')?'$ ':'S/ '; }\nfunction vchSoles(v){ const m=parseFloat(v.monto)||0; return v.moneda==='USD'?m*getTc():m; }\nfunction nuevaCarpetaVch(){\n  const n=prompt('Nombre de la carpeta:'); if(n===null) return;\n  const nom=n.trim(); if(!nom) return;\n  if(vchAllCats().some(c=>c.toLowerCase()===nom.toLowerCase())){ toast('Esa carpeta ya existe','err'); return; }\n  vchCats().push(nom); _vchCarpeta=nom;\n  saveData(); renderVchFolders(); renderVouchers();\n  toast('Carpeta \"'+nom+'\" creada','ok');\n}\nfunction setVchCarpeta(c){ _vchCarpeta=c; renderVchFolders(); renderVouchers(); }\nfunction renameCarpetaVch(c){\n  const n=prompt('Nuevo nombre de la carpeta:',c); if(n===null) return;\n  const nom=n.trim(); if(!nom||nom===c) return;\n  data.vchCats=vchCats().map(x=>x===c?nom:x);\n  vchList().forEach(v=>{ if(v.cat===c) v.cat=nom; });\n  if(_vchCarpeta===c) _vchCarpeta=nom;\n  saveData(); renderVchFolders(); renderVouchers();\n  toast('Carpeta renombrada','ok');\n}\nfunction delCarpetaVch(c){\n  const n=vchList().filter(v=>v.cat===c).length;\n  if(!confirm('¿Eliminar la carpeta \"'+c+'\"?'+(n?' Sus '+n+' vouchers pasarán a \"Sin carpeta\" (no se borran).':''))) return;\n  data.vchCats=vchCats().filter(x=>x!==c);\n  vchList().forEach(v=>{ if(v.cat===c) v.cat=''; });\n  if(_vchCarpeta===c) _vchCarpeta='';\n  saveData(); renderVchFolders(); renderVouchers();\n  toast('Carpeta eliminada','ok');\n}\nfunction renderVchFolders(){\n  const bar=document.getElementById('vchFolderBar'); if(!bar) return;\n  const all=vchList().filter(v=>(v.fecha||'')>=VCH_DESDE+'-01');\n  const cats=vchAllCats();\n  const sinN=all.filter(v=>!v.cat).length;\n  let html='<div class=\"vch-folder'+(_vchCarpeta===''?' on':'')+'\" onclick=\"setVchCarpeta(\\'\\')\">Todos <span style=\"opacity:.65;font-weight:500\">'+all.length+'<\u002Fspan><\u002Fdiv>';\n  cats.forEach(c=>{\n    const n=all.filter(v=>v.cat===c).length;\n    html+='<div class=\"vch-folder'+(_vchCarpeta===c?' on':'')+'\" onclick=\"setVchCarpeta('+JSON.stringify(c).replace(/\"/g,'&quot;')+')\">'+\n      '<svg width=\"12\" height=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path d=\"M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z\"/><\u002Fsvg>'+\n      escH(c)+' <span style=\"opacity:.65;font-weight:500\">'+n+'<\u002Fspan>'+\n      (_vchCarpeta===c?'<span onclick=\"event.stopPropagation();renameCarpetaVch('+JSON.stringify(c).replace(/\"/g,'&quot;')+')\" title=\"Renombrar\" style=\"margin-left:3px;opacity:.7\">✎<\u002Fspan>'+\n        '<span onclick=\"event.stopPropagation();delCarpetaVch('+JSON.stringify(c).replace(/\"/g,'&quot;')+')\" title=\"Eliminar carpeta\" style=\"margin-left:1px;color:var(--red);opacity:.85\">×<\u002Fspan>':'')+\n    '<\u002Fdiv>';\n  });\n  if(sinN) html+='<div class=\"vch-folder'+(_vchCarpeta==='__sin'?' on':'')+'\" onclick=\"setVchCarpeta(\\'__sin\\')\">Sin carpeta <span style=\"opacity:.65;font-weight:500\">'+sinN+'<\u002Fspan><\u002Fdiv>';\n  html+='<div class=\"vch-folder\" style=\"border-style:dashed\" onclick=\"nuevaCarpetaVch()\">+ Carpeta<\u002Fdiv>';\n  bar.innerHTML=html;\n  const dl=document.getElementById('vchCatsList');\n  if(dl) dl.innerHTML=cats.map(c=>'<option value=\"'+escH(c)+'\"><\u002Foption>').join('');\n}\nfunction updateVchMonedaHint(){\n  const el=document.getElementById('vchMonedaHint'); if(!el) return;\n  const mon=document.getElementById('vchMoneda').value;\n  const m=parseFloat(document.getElementById('vchMonto').value)||0;\n  if(mon==='USD'&&m>0){ el.style.display='block'; el.textContent='= S/ '+f(m*getTc())+' (al tipo de cambio actual)'; }\n  else el.style.display='none';\n}\nfunction nuevoVch(file, dataUrl, tipo){\n  const fecha=file.lastModified?new Date(file.lastModified).toISOString().slice(0,10):new Date().toISOString().slice(0,10);\n  return {\n    id:'vch_'+Date.now().toString()+'_'+Math.round(Math.random()*999),\n    img:dataUrl,\n    tipo:tipo||'img',\n    nombre:tipo==='pdf'?(file.name||'documento.pdf'):'',\n    fecha: fecha.slice(0,7)<VCH_DESDE ? VCH_DESDE+'-01' : fecha,\n    monto:0, nota:'', moneda:'PEN',\n    cat:(_vchCarpeta&&_vchCarpeta!=='__sin')?_vchCarpeta:''\n  };\n}\nfunction onVoucherFiles(inp){\n  const files=[...(inp.files||[])];\n  if(!files.length) return;\n  let hechos=0;\n  const fin=()=>{\n    if(hechos!==files.length) return;\n    saveData(); buildVchMesFilter(); renderVchFolders(); renderVouchers();\n    const dest=(_vchCarpeta&&_vchCarpeta!=='__sin')?' en \"'+_vchCarpeta+'\"':'';\n    toast(hechos+(hechos===1?' archivo guardado':' archivos guardados')+dest,'ok');\n  };\n  files.forEach(file=>{\n    const esPdf = file.type==='application/pdf' || /\\.pdf$/i.test(file.name||'');\n    if(esPdf){\n      const rp=new FileReader();\n      rp.onload=ev=>{\n        if(String(ev.target.result).length>4.2e6){ hechos++; toast('“'+(file.name||'PDF')+'” es muy grande (máx ~3 MB)','err'); fin(); return; }\n        vchList().push(nuevoVch(file, ev.target.result, 'pdf'));\n        hechos++; fin();\n      };\n      rp.onerror=()=>{ hechos++; toast('No se pudo leer el PDF','err'); fin(); };\n      rp.readAsDataURL(file);\n      return;\n    }\n    const r=new FileReader();\n    r.onload=e=>{\n      const img=new Image();\n      img.onload=()=>{\n        const max=1100, s=Math.min(1,max/Math.max(img.width,img.height));\n        const c=document.createElement('canvas');\n        c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);\n        c.getContext('2d').drawImage(img,0,0,c.width,c.height);\n        vchList().push(nuevoVch(file, c.toDataURL('image/jpeg',0.7), 'img'));\n        hechos++; fin();\n      };\n      img.onerror=()=>{ hechos++; toast('No se pudo leer una imagen','err'); fin(); };\n      img.src=e.target.result;\n    };\n    r.readAsDataURL(file);\n  });\n  inp.value='';\n}\nfunction buildVchMesFilter(){\n  const s=document.getElementById('vchMes'); if(!s) return;\n  const cur=s.value;\n  const ms=[...new Set(vchList().map(v=>(v.fecha||'').slice(0,7)).filter(m=>m&&m>=VCH_DESDE))].sort().reverse();\n  s.innerHTML='<option value=\"\">Todos los meses<\u002Foption>'+ms.map(m=>{\n    const p=m.split('-');\n    return '<option value=\"'+m+'\"'+(cur===m?' selected':'')+'>'+MESES[parseInt(p[1])-1]+' '+p[0]+'<\u002Foption>';\n  }).join('');\n}\nfunction renderVouchers(){\n  const el=document.getElementById('vchList'); if(!el) return;\n  const mes=((document.getElementById('vchMes')||{}).value)||'';\n  const all=vchList().filter(v=>(v.fecha||'')>=VCH_DESDE+'-01');\n  const cnt=document.getElementById('vchCount');\n  if(cnt) cnt.textContent=String(all.length);\n  const vs=all.filter(v=>(!mes||(v.fecha||'').slice(0,7)===mes)&&\n                (_vchCarpeta===''||(_vchCarpeta==='__sin'?!v.cat:v.cat===_vchCarpeta)))\n              .slice().sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));\n  if(!vs.length){\n    const d=_vchCarpeta&&_vchCarpeta!=='__sin'?' en “'+escH(_vchCarpeta)+'”':(_vchCarpeta==='__sin'?' sin carpeta':'');\n    el.innerHTML='<div class=\"empty-tx\">Sin vouchers'+d+(mes?' en este mes':'')+'. Toca “Subir vouchers / PDF” (fotos o PDFs, varios a la vez).<\u002Fdiv>'; return;\n  }\n  const groups={};\n  vs.forEach(v=>{ const k=(v.fecha||'').slice(0,7); (groups[k]=groups[k]||[]).push(v); });\n  el.innerHTML=Object.keys(groups).sort().reverse().map(k=>{\n    const g=groups[k], p=k.split('-');\n    const totPen=g.filter(v=>v.moneda!=='USD').reduce((a,v)=>a+(parseFloat(v.monto)||0),0);\n    const totUsd=g.filter(v=>v.moneda==='USD').reduce((a,v)=>a+(parseFloat(v.monto)||0),0);\n    const totTxt=[totPen>0?'S/ '+f(totPen):'',totUsd>0?'$ '+f(totUsd):''].filter(Boolean).join(' + ');\n    return '<div class=\"vch-month\"><div class=\"vch-month-head\">'+\n      '<div class=\"vch-month-label\">'+MESES[parseInt(p[1])-1]+' '+p[0]+'<\u002Fdiv><div class=\"vch-month-line\"><\u002Fdiv>'+\n      '<div class=\"vch-month-sum\">'+g.length+' vouchers'+(totTxt?' · '+totTxt:'')+'<\u002Fdiv><\u002Fdiv>'+\n      '<div class=\"vch-grid\">'+g.map(v=>\n        '<div class=\"vch-card\" onclick=\"openVoucher(\\''+v.id+'\\')\">'+\n        (v.tipo==='pdf'\n          ? '<div style=\"height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;background:var(--surface2);padding:6px;text-align:center\">'+\n              '<svg width=\"26\" height=\"26\" fill=\"none\" stroke=\"var(--red)\" stroke-width=\"1.8\" viewBox=\"0 0 24 24\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"/><polyline points=\"14 2 14 8 20 8\"/><\u002Fsvg>'+\n              '<div style=\"font-size:9px;font-weight:700;color:var(--red);letter-spacing:.06em\">PDF<\u002Fdiv>'+\n              '<div style=\"font-size:8px;color:var(--text3);line-height:1.25;max-height:20px;overflow:hidden;word-break:break-word\">'+escH(v.nombre||'documento.pdf')+'<\u002Fdiv>'+\n            '<\u002Fdiv>'\n          : '<img src=\"'+v.img+'\" alt=\"Voucher '+escH(v.fecha)+'\" loading=\"lazy\">')+\n        '<div class=\"vch-cap\"><span>'+escH((v.fecha||'').slice(8)+'/'+(v.fecha||'').slice(5,7))+'<\u002Fspan>'+((parseFloat(v.monto)||0)>0?'<b'+(v.moneda==='USD'?' style=\"color:var(--yellow)\"':'')+'>'+vchSym(v)+f(v.monto)+'<\u002Fb>':'')+'<\u002Fdiv>'+\n        (_vchCarpeta===''&&v.cat?'<div style=\"padding:0 6px 5px;font-size:9px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">'+escH(v.cat)+'<\u002Fdiv>':'')+\n        '<\u002Fdiv>'\n      ).join('')+'<\u002Fdiv><\u002Fdiv>';\n  }).join('');\n}\nfunction openVoucher(id){\n  const v=vchList().find(x=>x.id===id); if(!v) return;\n  _vchId=id;\n  const im=document.getElementById('vchBigImg'), pw=document.getElementById('vchBigPdf');\n  if(v.tipo==='pdf'){\n    im.style.display='none';\n    im.removeAttribute('src');\n    pw.style.display='flex';\n    document.getElementById('vchPdfFrame').src=v.img;\n    const a=document.getElementById('vchPdfOpen');\n    a.href=v.img;\n    a.setAttribute('download', v.nombre||'voucher.pdf');\n  } else {\n    pw.style.display='none';\n    document.getElementById('vchPdfFrame').removeAttribute('src');\n    im.style.display='';\n    im.src=v.img;\n  }\n  document.getElementById('vchFecha').value=v.fecha||'';\n  document.getElementById('vchMonto').value=(parseFloat(v.monto)||0)||'';\n  document.getElementById('vchMoneda').value=v.moneda==='USD'?'USD':'PEN';\n  document.getElementById('vchCat').value=v.cat||'';\n  updateVchMonedaHint();\n  document.getElementById('vchNota').value=v.nota||'';\n  document.getElementById('vchLightbox').classList.add('open');\n}\nfunction closeVoucher(){\n  document.getElementById('vchLightbox').classList.remove('open');\n  const fr=document.getElementById('vchPdfFrame'); if(fr) fr.removeAttribute('src');\n}\nfunction saveVoucherInfo(){\n  const v=vchList().find(x=>x.id===_vchId); if(!v) return;\n  const fecha=document.getElementById('vchFecha').value;\n  v.fecha=fecha||v.fecha;\n  v.monto=parseFloat(document.getElementById('vchMonto').value)||0;\n  v.moneda=document.getElementById('vchMoneda').value==='USD'?'USD':'PEN';\n  const nc=document.getElementById('vchCat').value.trim();\n  v.cat=nc;\n  if(nc&&!vchAllCats().includes(nc)) vchCats().push(nc);\n  v.nota=document.getElementById('vchNota').value.trim();\n  saveData(); closeVoucher(); buildVchMesFilter(); renderVchFolders(); renderVouchers();\n  toast('Voucher actualizado','ok');\n}\nfunction deleteVoucher(){\n  if(!confirm('¿Eliminar este voucher?')) return;\n  data.vouchers=vchList().filter(x=>x.id!==_vchId);\n  saveData(); closeVoucher(); buildVchMesFilter(); renderVchFolders(); renderVouchers();\n  toast('Voucher eliminado','ok');\n}\n\n// ── CATÁLOGO Y VENTAS DE PRODUCTOS ───────────────────────────────────────────\nlet _prodTab='inversion', _catEditId=null, _catImg='', _ventaCart={}, _catStockPrev=0, _catColores=[];\n\nfunction catList(){\n  if(!Array.isArray(data.catalogo)) data.catalogo=[];\n  data.catalogo.forEach(p=>{\n    if(!Array.isArray(p.colores)){\n      p.colores = p.color ? [{color:p.color, stock:Math.max(0,parseInt(p.stock)||0)}] : [];\n    }\n    if(p.colores.length) p.stock=sumColores(p.colores);\n  });\n  let cambio=false;\n  if(!data.codigosV2){\n    data.codigosV2=true; cambio=true;\n    const auto=data.catalogo.filter(p=>!p.codigo||/^P-\\d{3}$/.test(p.codigo));\n    auto.forEach(p=>{ p.codigo=''; (p.colores||[]).forEach(c=>{ if(!c.man) c.codigo=''; }); });\n    auto.sort((a,b)=>(a.cat||'').localeCompare(b.cat||'')||(a.nombre||'').localeCompare(b.nombre||''))\n      .forEach(p=>{ p.codigo=nextProdCode(p.cat); });\n  }\n  data.catalogo.forEach(p=>{\n    if(!p.codigo){ p.codigo=nextProdCode(p.cat); cambio=true; }\n    const usados=[];\n    (p.colores||[]).forEach(c=>{\n      if(!c.codigo){ c.codigo=autoColorCode(p.codigo,c.color,usados); c.man=false; cambio=true; }\n      usados.push(c.codigo);\n    });\n  });\n  if(cambio) saveData();\n  return data.catalogo;\n}\nfunction normCod(s){ return String(s||'').trim().toUpperCase().replace(/\\s+/g,'-'); }\nfunction colorAbbr(color){\n  const s=String(color||'').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9 ]/g,'').trim();\n  if(!s) return 'COL';\n  const w=s.split(/\\s+/);\n  return w.length>1 ? (w[0].slice(0,3)+w[1].slice(0,1)) : w[0].slice(0,3);\n}\nfunction autoColorCode(base,color,usados){\n  const b=normCod(base)||'P';\n  let c=b+'-'+colorAbbr(color), n=2;\n  while((usados||[]).includes(c)) c=b+'-'+colorAbbr(color)+n++;\n  return c;\n}\nfunction catPrefix(cat){\n  const s=String(cat||'').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toUpperCase().replace(/[^A-Z]/g,'');\n  return s.charAt(0)||'P';\n}\nfunction nextProdCode(cat,exceptId){\n  const pre=catPrefix(cat);\n  const re=new RegExp('^'+pre+'-(\\\\d+)$');\n  let max=0;\n  (data.catalogo||[]).forEach(p=>{ if(p.id===exceptId) return; const m=re.exec(p.codigo||''); if(m) max=Math.max(max,parseInt(m[1])); });\n  return pre+'-'+String(max+1).padStart(3,'0');\n}\nfunction cmpCod(a,b){ return String(a.codigo||'').localeCompare(String(b.codigo||''),'es',{numeric:true})||(a.nombre||'').localeCompare(b.nombre||''); }\nlet _catCodMan=false;\nfunction onCatCategoria(v){\n  if(_catCodMan) return;\n  document.getElementById('catCodigo').value=nextProdCode(v,_catEditId);\n  refreshColorCodes();\n}\nfunction codigosTxt(p){ return [p.codigo||''].concat((p.colores||[]).map(c=>c.codigo||'')).join(' '); }\nfunction sumColores(cols){ return (cols||[]).reduce((a,c)=>a+Math.max(0,parseInt(c.stock)||0),0); }\nfunction tieneColores(p){ return Array.isArray(p.colores)&&p.colores.length>0; }\nfunction coloresTxt(p){ return tieneColores(p)?p.colores.map(c=>c.color).join(', '):(p.color||''); }\nfunction cartKey(id,color){ return color?id+'|'+color:id; }\nfunction parseKey(k){ const i=String(k).indexOf('|'); return i<0?{id:String(k),color:''}:{id:String(k).slice(0,i),color:String(k).slice(i+1)}; }\nfunction varCodigo(p,color){\n  if(color){ const v=(p.colores||[]).find(c=>c.color===color); if(v&&v.codigo) return v.codigo; }\n  return p.codigo||'';\n}\nfunction varStock(p,color){\n  if(!color) return Math.max(0,parseInt(p.stock)||0);\n  const v=(p.colores||[]).find(c=>c.color===color);\n  return v?Math.max(0,parseInt(v.stock)||0):0;\n}\nfunction addVarStock(p,color,d){\n  if(color&&tieneColores(p)){\n    const v=(p.colores||[]).find(c=>c.color===color);\n    if(v){ v.stock=Math.max(0,(parseInt(v.stock)||0)+d); p.stock=sumColores(p.colores); return; }\n  }\n  p.stock=Math.max(0,(parseInt(p.stock)||0)+d);\n}\nfunction ventasList(){ if(!Array.isArray(data.ventasProd)) data.ventasProd=[]; return data.ventasProd; }\nfunction escH(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/<\u002Fg,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;'); }\n\nfunction switchProdTab(){ renderCatalogo(); buildVentaMesFilter(); renderVentasProd(); }\n\nfunction vendidosMap(){\n  const m={};\n  ventasList().forEach(v=>(v.items||[]).forEach(i=>{m[i.id]=(m[i.id]||0)+i.qty;}));\n  return m;\n}\n\nfunction renderCatalogo(){\n  const grid=document.getElementById('catGrid'); if(!grid) return;\n  const list=catList();\n  const cats=[...new Set(list.map(p=>p.cat).filter(Boolean))].sort();\n  const sel=document.getElementById('catFiltro');\n  const cur=sel?sel.value:'';\n  if(sel) sel.innerHTML='<option value=\"\">Todas las categorías<\u002Foption>'+cats.map(c=>'<option'+(c===cur?' selected':'')+'>'+escH(c)+'<\u002Foption>').join('');\n  const dl=document.getElementById('catCatsList');\n  if(dl) dl.innerHTML=cats.map(c=>'<option value=\"'+escH(c)+'\"><\u002Foption>').join('');\n  const dlc=document.getElementById('catColoresList');\n  if(dlc){\n    const cols=[...new Set(list.flatMap(p=>(p.colores||[]).map(c=>c.color)).filter(Boolean))].sort();\n    dlc.innerHTML=cols.map(c=>'<option value=\"'+escH(c)+'\"><\u002Foption>').join('');\n  }\n  const cc=document.getElementById('catCount'); if(cc) cc.textContent=list.length+' prod.';\n  const res=document.getElementById('catResumen');\n  if(res){\n    const invNet=(data.productos||[]).reduce((a,m)=>a+(m.tipo==='deposito'?(parseFloat(m.monto)||0):-(parseFloat(m.monto)||0)),0);\n    const vend2=ventasList().reduce((a,v)=>a+(parseFloat(v.total)||0),0);\n    const ganTot=ventasList().reduce((a,v)=>a+(v.items||[]).reduce((x,i)=>x+((parseFloat(i.precio)||0)-(parseFloat(i.costo)||0))*i.qty,0),0);\n    const stockCosto=list.reduce((a,p)=>a+(parseFloat(p.costo)||0)*(parseInt(p.stock)||0),0);\n    res.innerHTML=[\n      ['Invertido','S/ '+f(invNet),'var(--prod)','var(--prod-bg)','var(--prod-dim)'],\n      ['Vendido','S/ '+f(vend2),'var(--green)','var(--green-bg)','var(--green-dim)'],\n      ['Ganancia','S/ '+f(ganTot),ganTot>=0?'var(--green)':'var(--red)',ganTot>=0?'var(--green-bg)':'var(--red-bg)',ganTot>=0?'var(--green-dim)':'var(--red-dim)'],\n      ['Stock a costo','S/ '+f(stockCosto),'var(--yellow)','var(--yellow-bg)','var(--yellow-dim)']\n    ].map((a,ix)=>'<div class=\"inv-sum-card\" style=\"background:'+a[3]+';border:1px solid '+a[4]+';position:relative\">'+\n        '<div class=\"inv-sum-label\" style=\"color:'+a[2]+'\">'+a[0]+'<\u002Fdiv><div class=\"inv-sum-val\" style=\"color:'+a[2]+'\">'+a[1]+'<\u002Fdiv><\u002Fdiv>').join('');\n  }\n  const al=document.getElementById('stockAlerta');\n  if(al){\n    const sin=list.filter(p=>(parseInt(p.stock)||0)===0 && vendidosMap()[p.id]);\n    const bajo=list.filter(p=>{const s=parseInt(p.stock)||0; return s>0&&s<=3;});\n    let a='';\n    if(sin.length) a+='<div class=\"alerta-banner\" style=\"background:var(--red-bg);border-color:var(--red-dim);color:var(--red)\">Sin stock: '+sin.map(p=>escH(p.nombre)).join(', ')+'<\u002Fdiv>';\n    if(bajo.length) a+='<div class=\"alerta-banner\">Stock bajo (1-3): '+bajo.map(p=>escH(p.nombre)+' ('+p.stock+')').join(', ')+'<\u002Fdiv>';\n    const colSin=[];\n    list.slice().sort((x,y)=>(x.nombre||'').localeCompare(y.nombre||'')).forEach(p=>{\n      const cols=(p.colores||[]).filter(c=>(parseInt(c.stock)||0)===0).map(c=>c.color).sort((m,n)=>String(m).localeCompare(String(n)));\n      if(cols.length) colSin.push('<div style=\"display:flex;gap:6px;padding:3px 0\"><b style=\"flex:0 0 auto;font-weight:600\">'+escH(p.nombre)+':<\u002Fb><span style=\"opacity:.9\">'+cols.map(escH).join(' · ')+'<\u002Fspan><\u002Fdiv>');\n    });\n    if(colSin.length) a+='<div class=\"alerta-banner\" style=\"background:var(--red-bg);border-color:var(--red-dim);color:var(--red);display:block\"><div style=\"font-weight:700;margin-bottom:4px\">Colores agotados ('+colSin.length+' productos)<\u002Fdiv><div style=\"display:flex;flex-direction:column\">'+colSin.join('')+'<\u002Fdiv><\u002Fdiv>';\n    al.innerHTML=a;\n  }\n  const q=((document.getElementById('catSearch')||{}).value||'').toLowerCase().trim();\n  let vis=list.filter(p=>(!cur||p.cat===cur)&&(!q||(p.nombre||'').toLowerCase().includes(q)||(p.cat||'').toLowerCase().includes(q)||coloresTxt(p).toLowerCase().includes(q)||codigosTxt(p).toLowerCase().includes(q)));\n  const vend=vendidosMap();\n  vis.sort(cmpCod);\n  if(!vis.length){\n    grid.innerHTML='<div class=\"empty-inv\" style=\"grid-column:1/-1\">'+(list.length?'Sin resultados.':'Aún no tienes productos. Toca “Agregar producto” para registrar el primero con su foto.')+'<\u002Fdiv>';\n    return;\n  }\n  grid.innerHTML=vis.map(p=>{\n    const st=parseInt(p.stock)||0;\n    const v=vend[p.id]||0;\n    const cst=parseFloat(p.costo)||0;\n    const gan=(parseFloat(p.precio)||0)-cst;\n    return '<div class=\"cat-card\">'+\n      '<div class=\"cat-photo\">'+(p.img?'<img src=\"'+p.img+'\" alt=\"'+escH(p.nombre)+'\">':'Sin foto')+'<\u002Fdiv>'+\n      '<div class=\"cat-body\">'+\n        (p.cat?'<span class=\"cat-chip\">'+escH(p.cat)+'<\u002Fspan>':'')+\n        '<div class=\"cat-name\">'+escH(p.nombre)+'<\u002Fdiv>'+\n        (p.codigo?'<div style=\"font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--text2);letter-spacing:.03em\">'+escH(p.codigo)+'<\u002Fdiv>':'')+\n        (tieneColores(p)?'<div style=\"display:flex;flex-wrap:wrap;gap:3px;margin:3px 0 1px\">'+p.colores.map(c=>{\n          const s=Math.max(0,parseInt(c.stock)||0);\n          const col=s===0?'var(--red)':(s<=3?'var(--yellow)':'var(--prod)');\n          const bg=s===0?'var(--red-bg)':(s<=3?'var(--yellow-bg)':'var(--prod-bg)');\n          const bd=s===0?'var(--red-dim)':(s<=3?'var(--yellow-dim)':'var(--prod-dim)');\n          return '<span class=\"cat-chip\" style=\"background:'+bg+';border-color:'+bd+';color:'+col+'\" title=\"'+escH(c.codigo||'')+'\">'+escH(c.color)+(c.codigo?' <span style=\"font-family:ui-monospace,Menlo,monospace;opacity:.75\">'+escH(c.codigo)+'<\u002Fspan>':'')+': '+s+'<\u002Fspan>';\n        }).join('')+'<\u002Fdiv>':'')+\n        '<div class=\"cat-price\">S/ '+f(parseFloat(p.precio)||0)+'<\u002Fdiv>'+\n        '<div class=\"cat-stock\">'+(cst>0?'Costo S/ '+f(cst)+' · gan. <b style=\"color:'+(gan>=0?'var(--green)':'var(--red)')+'\">S/ '+f(gan)+'<\u002Fb>':'<span style=\"color:var(--green)\">Sin costo · 100% ganancia<\u002Fspan>')+'<\u002Fdiv>'+\n        '<div class=\"cat-stock'+(st>0&&st<=3?' low':'')+'\"'+(st>0?'':' style=\"color:var(--red)\"')+'>'+(st>0?'Stock: '+st:'Sin stock')+(v?' · '+v+' vendidos':'')+'<\u002Fdiv>'+\n        '<div class=\"cat-actions\">'+\n          '<button class=\"btn btn-prod btn-sm\" onclick=\"ventaRapida(\\''+p.id+'\\')\">Vender<\u002Fbutton>'+\n          '<button class=\"btn btn-sm\" onclick=\"openStockCat(\\''+p.id+'\\')\">+ Stock<\u002Fbutton>'+\n          '<button class=\"btn btn-sm\" onclick=\"openProdModal(\\''+p.id+'\\')\">Editar<\u002Fbutton>'+\n        '<\u002Fdiv>'+\n      '<\u002Fdiv><\u002Fdiv>';\n  }).join('');\n}\n\nfunction openProdModal(id){\n  _catEditId=id||null;\n  const p=id?catList().find(x=>x.id===id):null;\n  document.getElementById('prodModalTitle').textContent=p?'Editar producto':'Nuevo producto';\n  document.getElementById('catBtnDelete').style.display=p?'':'none';\n  document.getElementById('catNombre').value=p?(p.nombre||''):'';\n  document.getElementById('catCodigo').value=p?(p.codigo||''):nextProdCode('');\n  _catCodMan=!!p;\n  document.getElementById('catCategoria').value=p?(p.cat||''):'';\n  _catColores=p&&Array.isArray(p.colores)?p.colores.map(c=>({color:c.color||'',codigo:c.codigo||'',man:!!c.man,stock:Math.max(0,parseInt(c.stock)||0)})):[];\n  renderCatColores();\n  document.getElementById('catPrecio').value=p?(p.precio||''):'';\n  document.getElementById('catCosto').value=p?(p.costo||''):'';\n  document.getElementById('catStock').value=p?(p.stock||0):'';\n  document.getElementById('catNota').value=p?(p.nota||''):'';\n  fillProveedores('catProveedor', p?(p.proveedor||''):'');\n  _catImg=p?(p.img||''):'';\n  document.getElementById('catFotoInput').value='';\n  _catStockPrev=p?(parseInt(p.stock)||0):0;\n  document.getElementById('catInvCheck').checked=true;\n  paintCatFoto();\n  updateCatGanancia();\n  document.getElementById('prodModalBg').classList.add('open');\n}\nfunction closeProdModal(){ document.getElementById('prodModalBg').classList.remove('open'); }\nfunction renderCatColores(){\n  const box=document.getElementById('catColoresBox'); if(!box) return;\n  box.innerHTML=_catColores.map((c,i)=>\n    '<div style=\"display:flex;gap:6px;align-items:center\">'+\n      '<input type=\"text\" list=\"catColoresList\" value=\"'+escH(c.color)+'\" placeholder=\"Color\" style=\"flex:1;min-width:0\" oninput=\"setCatColor('+i+',this.value)\">'+\n      '<input type=\"text\" id=\"catColCod'+i+'\" value=\"'+escH(c.codigo||'')+'\" placeholder=\"Código\" style=\"width:112px;font-family:ui-monospace,Menlo,monospace;font-size:12px;text-transform:uppercase\" oninput=\"setCatColorCode('+i+',this.value)\" title=\"Código de este color\">'+\n      '<input type=\"number\" min=\"0\" step=\"1\" value=\"'+(c.stock||0)+'\" placeholder=\"Stock\" style=\"width:84px\" oninput=\"setCatColorStock('+i+',this.value)\" title=\"Stock de este color\">'+\n      '<button class=\"btn btn-red btn-sm\" style=\"padding:0 10px\" onclick=\"delCatColor('+i+')\" title=\"Quitar color\">×<\u002Fbutton>'+\n    '<\u002Fdiv>').join('')||'<div style=\"font-size:12px;color:var(--text3)\">Sin colores — se usa el stock general.<\u002Fdiv>';\n  syncCatStockField();\n}\nfunction addCatColor(){ _catColores.push({color:'',codigo:'',man:false,stock:0}); renderCatColores(); }\nfunction delCatColor(i){ _catColores.splice(i,1); renderCatColores(); }\nfunction setCatColor(i,v){ if(_catColores[i]){ _catColores[i].color=v; if(!_catColores[i].man) refreshColorCodes(); } syncCatStockField(); }\nfunction setCatColorCode(i,v){ if(_catColores[i]){ _catColores[i].codigo=normCod(v); _catColores[i].man=!!normCod(v); if(!_catColores[i].man) refreshColorCodes(); } }\nfunction onCatCodigo(){ refreshColorCodes(); }\nfunction refreshColorCodes(){\n  const base=normCod(document.getElementById('catCodigo').value);\n  const usados=_catColores.filter(c=>c.man).map(c=>c.codigo);\n  _catColores.forEach((c,i)=>{\n    if(c.man) return;\n    c.codigo=c.color.trim()?autoColorCode(base,c.color,usados):'';\n    usados.push(c.codigo);\n    const el=document.getElementById('catColCod'+i); if(el) el.value=c.codigo;\n  });\n}\nfunction setCatColorStock(i,v){ if(_catColores[i]) _catColores[i].stock=Math.max(0,parseInt(v)||0); syncCatStockField(); }\nfunction syncCatStockField(){\n  const inp=document.getElementById('catStock'), lab=document.getElementById('catStockLabel');\n  if(!inp) return;\n  if(_catColores.length){\n    inp.value=sumColores(_catColores);\n    inp.readOnly=true; inp.style.opacity='.6';\n    if(lab) lab.textContent='Stock total (suma de colores)';\n  } else {\n    inp.readOnly=false; inp.style.opacity='1';\n    if(lab) lab.textContent='Stock (0 = sin control)';\n  }\n  updateCatGanancia();\n}\nfunction paintCatFoto(){\n  const w=document.getElementById('catFotoWrap');\n  if(_catImg){ document.getElementById('catFotoPreview').src=_catImg; w.style.display='flex'; }\n  else w.style.display='none';\n}\nfunction quitarCatFoto(){ _catImg=''; document.getElementById('catFotoInput').value=''; paintCatFoto(); }\nfunction onCatFoto(inp){\n  const file=inp.files&&inp.files[0]; if(!file) return;\n  const r=new FileReader();\n  r.onload=e=>{\n    const img=new Image();\n    img.onload=()=>{\n      const max=560, s=Math.min(1,max/Math.max(img.width,img.height));\n      const c=document.createElement('canvas');\n      c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);\n      c.getContext('2d').drawImage(img,0,0,c.width,c.height);\n      _catImg=c.toDataURL('image/jpeg',0.72);\n      paintCatFoto();\n    };\n    img.onerror=()=>toast('No se pudo leer la imagen','err');\n    img.src=e.target.result;\n  };\n  r.readAsDataURL(file);\n}\nfunction revertirInversionEstimado(prodId, quitadas, costoRef){\n  if(!Array.isArray(data.productos)) return 0;\n  const compras=data.productos\n    .filter(t=>t.catalogoId===prodId && t.tipo==='deposito' && (parseFloat(t.monto)||0)>0)\n    .sort((a,b)=>String(b.fecha||'').localeCompare(String(a.fecha||''))||String(b.id||'').localeCompare(String(a.id||'')));\n  let falta=quitadas, tot=0;\n  for(const t of compras){\n    if(falta<=0) break;\n    const unit=(parseFloat(t.unitCosto)||0) || costoRef || 0;\n    const unds=Math.max(1, parseInt(t.unds)||(unit>0?Math.round((parseFloat(t.monto)||0)/unit):1));\n    if(unds<=falta){ tot+=parseFloat(t.monto)||0; falta-=unds; }\n    else { tot+=unit*falta; falta=0; }\n  }\n  return parseFloat(tot.toFixed(2));\n}\nfunction revertirInversion(prodId, quitadas, costoRef){\n  if(!Array.isArray(data.productos)) return 0;\n  const compras=data.productos\n    .filter(t=>t.catalogoId===prodId && t.tipo==='deposito' && (parseFloat(t.monto)||0)>0)\n    .sort((a,b)=>String(b.fecha||'').localeCompare(String(a.fecha||''))||String(b.id||'').localeCompare(String(a.id||'')));\n  if(!compras.length) return 0;\n  let falta=quitadas, devuelto=0;\n  const borrar=[];\n  for(const t of compras){\n    if(falta<=0) break;\n    const unit=(parseFloat(t.unitCosto)||0) || costoRef || 0;\n    const unds=Math.max(1, parseInt(t.unds)||(unit>0?Math.round((parseFloat(t.monto)||0)/unit):1));\n    if(unds<=falta){\n      devuelto+=parseFloat(t.monto)||0; falta-=unds; borrar.push(t.id);\n    } else {\n      const quitar=parseFloat((unit*falta).toFixed(2));\n      t.unds=unds-falta;\n      t.monto=parseFloat(Math.max(0,(parseFloat(t.monto)||0)-quitar).toFixed(2));\n      t.desc='Compra: '+t.unds+'× '+String(t.desc||'').replace(/^Compra: \\d+× /,'');\n      devuelto+=quitar; falta=0;\n    }\n  }\n  if(borrar.length) data.productos=data.productos.filter(t=>!borrar.includes(t.id));\n  return parseFloat(devuelto.toFixed(2));\n}\nfunction openLimpiarInv(){\n  renderLimpiarInv();\n  document.getElementById('limpiarInvBg').classList.add('open');\n}\nfunction closeLimpiarInv(){ document.getElementById('limpiarInvBg').classList.remove('open'); }\nfunction renderLimpiarInv(){\n  const el=document.getElementById('limpiarInvList'); if(!el) return;\n  const movs=(data.productos||[]).slice().sort((a,b)=>String(b.fecha||'').localeCompare(String(a.fecha||'')));\n  if(!movs.length){ el.innerHTML='<div class=\"empty-tx\">No hay movimientos de inversión.<\u002Fdiv>'; return; }\n  el.innerHTML=movs.map(m=>{\n    const dep=m.tipo==='deposito';\n    const prod=(data.catalogo||[]).find(p=>p.id===m.catalogoId);\n    const huerf=m.catalogoId&&!prod;\n    return '<div style=\"display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid '+(huerf?'var(--red-dim)':'var(--border2)')+';border-radius:var(--radius-sm);background:var(--surface2)\">'+\n      '<div style=\"flex:1;min-width:0\">'+\n        '<div style=\"font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">'+escH(m.desc||'(sin descripción)')+'<\u002Fdiv>'+\n        '<div style=\"font-size:10px;color:var(--text3)\">'+escH(m.fecha||'')+(m.proveedor?' · '+escH(m.proveedor):'')+(huerf?' · <span style=\"color:var(--red)\">producto eliminado<\u002Fspan>':'')+'<\u002Fdiv>'+\n      '<\u002Fdiv>'+\n      '<div style=\"font-size:12px;font-weight:700;color:'+(dep?'var(--prod)':'var(--green)')+';white-space:nowrap\">'+(dep?'+':'−')+'S/ '+f(parseFloat(m.monto)||0)+'<\u002Fdiv>'+\n      '<button class=\"btn btn-red btn-sm\" style=\"padding:0 9px\" onclick=\"delMovInv('+JSON.stringify(String(m.id)).replace(/\"/g,'&quot;')+')\" title=\"Borrar movimiento\">✕<\u002Fbutton>'+\n    '<\u002Fdiv>';\n  }).join('');\n}\nfunction delMovInv(id){\n  const m=(data.productos||[]).find(x=>String(x.id)===String(id)); if(!m) return;\n  if(!confirm('¿Borrar “'+(m.desc||'movimiento')+'” de S/ '+f(parseFloat(m.monto)||0)+'?\\n\\nNo cambia el stock del producto.')) return;\n  data.productos=(data.productos||[]).filter(x=>String(x.id)!==String(id));\n  saveData(); renderLimpiarInv(); renderCatalogo();\n  if(typeof renderProductosSection==='function') renderProductosSection();\n  if(typeof renderResumen==='function') renderResumen();\n  toast('Movimiento borrado','ok');\n}\nfunction catCompraPendiente(){\n  const costo=parseFloat(document.getElementById('catCosto').value)||0;\n  const stock=Math.max(0,parseInt(document.getElementById('catStock').value)||0);\n  const nuevas=Math.max(0,stock-_catStockPrev);\n  return {costo, nuevas, monto:parseFloat((costo*nuevas).toFixed(2))};\n}\nfunction updateCatGanancia(){\n  const costo=parseFloat(document.getElementById('catCosto').value)||0;\n  const precio=parseFloat(document.getElementById('catPrecio').value)||0;\n  const box=document.getElementById('catGananciaBox');\n  if(box){\n    if(precio<=0){ box.innerHTML='<span style=\"color:var(--text3)\">Pon el precio de venta para ver la ganancia.<\u002Fspan>'; }\n    else if(costo<=0){ box.innerHTML='<b style=\"color:var(--green)\">Ganancia por unidad: S/ '+f(precio)+'<\u002Fb> — sin costo registrado, todo es ganancia.'; }\n    else {\n      const g=precio-costo, m=precio?g/precio*100:0;\n      box.innerHTML='Ganancia por unidad: <b style=\"color:'+(g>=0?'var(--green)':'var(--red)')+'\">S/ '+f(g)+'<\u002Fb> · Margen: <b style=\"color:'+(g>=0?'var(--green)':'var(--red)')+'\">'+m.toFixed(0)+'%<\u002Fb>';\n    }\n  }\n  const c=catCompraPendiente();\n  const wrap=document.getElementById('catInvWrap');\n  if(wrap){\n    if(c.monto>0){\n      wrap.style.display='flex';\n      document.getElementById('catInvLabel').textContent='Registrar en Inversión la compra de '+c.nuevas+' und. × S/ '+f(c.costo)+' = S/ '+f(c.monto);\n    } else wrap.style.display='none';\n  }\n}\nfunction saveCat(){\n  const nombre=document.getElementById('catNombre').value.trim();\n  const precio=parseFloat(document.getElementById('catPrecio').value)||0;\n  const costo=parseFloat(document.getElementById('catCosto').value)||0;\n  if(!nombre){ toast('Ponle un nombre al producto','err'); return; }\n  refreshColorCodes();\n  const codigo=normCod(document.getElementById('catCodigo').value);\n  if(!codigo){ toast('Ponle un código al producto','err'); return; }\n  const otros=catList().filter(x=>x.id!==_catEditId);\n  const usadosOtros=new Set(otros.flatMap(x=>[x.codigo].concat((x.colores||[]).map(c=>c.codigo))).filter(Boolean));\n  if(usadosOtros.has(codigo)){ toast('El código '+codigo+' ya lo usa otro producto','err'); return; }\n  const colCods=_catColores.filter(c=>(c.color||'').trim()).map(c=>c.codigo);\n  const dupCol=colCods.find((c,ix)=>c&&(usadosOtros.has(c)||colCods.indexOf(c)!==ix||c===codigo));\n  if(dupCol){ toast('El código de color '+dupCol+' está repetido','err'); return; }\n  if(precio<=0){ toast('Agrega el precio de venta','err'); return; }\n  const compra=catCompraPendiente();\n  const regInv=compra.monto>0 && document.getElementById('catInvCheck').checked;\n  const p={\n    id:_catEditId||('cat_'+Date.now().toString()),\n    codigo, nombre, cat:document.getElementById('catCategoria').value.trim(),\n    colores:_catColores.map(c=>({color:(c.color||'').trim(),codigo:c.codigo||'',man:!!c.man,stock:Math.max(0,parseInt(c.stock)||0)})).filter(c=>c.color),\n    color:'',\n    precio, costo, stock:0,\n    proveedor:(document.getElementById('catProveedor').value==='__new__'?'':document.getElementById('catProveedor').value),\n    nota:document.getElementById('catNota').value.trim(), img:_catImg\n  };\n  p.stock = p.colores.length ? sumColores(p.colores) : Math.max(0,parseInt(document.getElementById('catStock').value)||0);\n  const list=catList();\n  const i=list.findIndex(x=>x.id===p.id);\n  const era=!!_catEditId;\n  if(i>=0) list[i]=p; else list.push(p);\n  let devuelto=0;\n  const quitadas=Math.max(0,_catStockPrev-p.stock);\n  if(era && quitadas>0){\n    const est=revertirInversionEstimado(p.id, quitadas, parseFloat(p.costo)||0);\n    if(est>0 && confirm('Quitaste '+quitadas+' und. de stock.\\n\\n¿Descontar también S/ '+f(est)+' de la Inversión (compras de este producto)?\\n\\nAceptar = sí, descontar.  Cancelar = dejar la inversión igual.')){\n      devuelto=revertirInversion(p.id, quitadas, parseFloat(p.costo)||0);\n    }\n  }\n  if(regInv){\n    if(!Array.isArray(data.productos)) data.productos=[];\n    data.productos.push({\n      id:'compra_'+p.id+'_'+Date.now().toString(),\n      tipo:'deposito',\n      desc:'Compra: '+compra.nuevas+'× '+nombre,\n      monto:compra.monto,\n      unds:compra.nuevas, unitCosto:compra.costo,\n      fecha:new Date().toISOString().slice(0,10),\n      proveedor:p.proveedor||'',\n      nota:'Desde Catálogo · S/ '+f(compra.costo)+' c/u',\n      catalogoId:p.id\n    });\n  }\n  saveData(); closeProdModal(); renderCatalogo();\n  if(typeof renderProductosSection==='function') renderProductosSection();\n  if(typeof renderResumen==='function') renderResumen();\n  toast(regInv ? 'Guardado · S/ '+f(compra.monto)+' a Inversión'\n       : (devuelto>0 ? 'Guardado · −S/ '+f(devuelto)+' de Inversión'\n       : (era?'Producto actualizado':'Producto agregado')),'ok');\n}\nfunction deleteCat(){\n  if(!confirm('¿Eliminar este producto del catálogo? Las ventas ya registradas se mantienen.')) return;\n  const id=_catEditId;\n  const inv=Array.isArray(data.productos)?data.productos.filter(t=>t.catalogoId===id&&t.tipo==='deposito'):[];\n  const totInv=inv.reduce((a,t)=>a+(parseFloat(t.monto)||0),0);\n  let quit=0;\n  if(totInv>0 && confirm('Este producto tiene S/ '+f(totInv)+' registrados en Inversión.\\n\\n¿Eliminar también esos movimientos?\\n\\nAceptar = sí.  Cancelar = mantenerlos.')){\n    data.productos=data.productos.filter(t=>!(t.catalogoId===id&&t.tipo==='deposito'));\n    quit=totInv;\n  }\n  data.catalogo=catList().filter(x=>x.id!==id);\n  saveData(); closeProdModal(); renderCatalogo();\n  if(typeof renderProductosSection==='function') renderProductosSection();\n  if(typeof renderResumen==='function') renderResumen();\n  toast('Producto eliminado'+(quit>0?' · −S/ '+f(quit)+' de Inversión':''),'ok');\n}\n\nconst PROVEEDORES_BASE=['Sumbex','Temu','Ala','Roma','Red Car'];\nfunction provList(){\n  if(!Array.isArray(data.proveedores)||!data.proveedores.length) data.proveedores=PROVEEDORES_BASE.slice();\n  return data.proveedores;\n}\nfunction fillProveedores(selId, valor){\n  const s=document.getElementById(selId); if(!s) return;\n  const usados=[...new Set((data.productos||[]).map(m=>m.proveedor).filter(Boolean))];\n  const list=[...new Set(provList().concat(usados))].sort((a,b)=>a.localeCompare(b));\n  data.proveedores=[...new Set(provList().concat(usados))];\n  s.innerHTML='<option value=\"\">Sin proveedor<\u002Foption>'+\n    list.map(p=>'<option'+(p===valor?' selected':'')+'>'+escH(p)+'<\u002Foption>').join('')+\n    '<option value=\"__new__\">＋ Agregar proveedor...<\u002Foption>';\n  s.value=valor&&list.includes(valor)?valor:'';\n}\nfunction onProveedorChange(sel){\n  if(sel.value!=='__new__') return;\n  const nombre=(prompt('Nombre del nuevo proveedor:')||'').trim();\n  if(!nombre){ sel.value=''; return; }\n  const list=provList();\n  const ya=list.find(p=>p.toLowerCase()===nombre.toLowerCase());\n  if(!ya) list.push(nombre);\n  saveData();\n  fillProveedores(sel.id, ya||nombre);\n  toast(ya?'Ese proveedor ya existía':'Proveedor \"'+nombre+'\" agregado','ok');\n}\n\nfunction openCierreDia(){\n  document.getElementById('cierreFecha').value=new Date().toISOString().slice(0,10);\n  renderCierreDia();\n  document.getElementById('cierreModalBg').classList.add('open');\n}\nfunction closeCierreDia(){ document.getElementById('cierreModalBg').classList.remove('open'); }\nfunction renderCierreDia(){\n  const d=document.getElementById('cierreFecha').value;\n  const el=document.getElementById('cierreContent'); if(!el) return;\n  const vs=ventasList().filter(v=>v.fecha===d);\n  const total=vs.reduce((a,v)=>a+(parseFloat(v.total)||0),0);\n  const gan=vs.reduce((a,v)=>a+(v.items||[]).reduce((x,i)=>x+((parseFloat(i.precio)||0)-(parseFloat(i.costo)||0))*i.qty,0),0);\n  const uds=vs.reduce((a,v)=>a+(v.items||[]).reduce((x,i)=>x+i.qty,0),0);\n  const txD=(data.transactions||[]).filter(t=>t.fecha===d);\n  const ingD=txD.filter(t=>t.tipo==='ingreso'&&!t.vaAHapi).reduce((a,t)=>a+(parseFloat(t.monto)||0),0);\n  const egrD=txD.filter(t=>t.tipo==='egreso').reduce((a,t)=>a+(parseFloat(t.monto)||0),0);\n  const pagos={}; vs.forEach(v=>{ const k=v.pago||'Efectivo'; pagos[k]=(pagos[k]||0)+(parseFloat(v.total)||0); });\n  const prods={}; vs.forEach(v=>(v.items||[]).forEach(i=>{ prods[i.nombre]=(prods[i.nombre]||0)+i.qty; }));\n  const top=Object.entries(prods).sort((a,b)=>b[1]-a[1])[0];\n  const card=(l,v,c,bg,bd)=>'<div class=\"inv-sum-card\" style=\"background:'+bg+';border:1px solid '+bd+'\"><div class=\"inv-sum-label\" style=\"color:'+c+'\">'+l+'<\u002Fdiv><div class=\"inv-sum-val\" style=\"color:'+c+'\">'+v+'<\u002Fdiv><\u002Fdiv>';\n  const fila=(l,v,c)=>'<div style=\"display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid var(--border)\"><span style=\"color:var(--text2)\">'+l+'<\u002Fspan><span style=\"font-weight:600'+(c?';color:'+c:'')+'\">'+v+'<\u002Fspan><\u002Fdiv>';\n  let html='<div style=\"text-align:center;padding:6px 0 12px\"><div style=\"font-size:32px;font-weight:700;color:var(--green);line-height:1.1\">S/ '+f(total)+'<\u002Fdiv><div style=\"font-size:12px;color:var(--text2)\">vendido en productos<\u002Fdiv><\u002Fdiv>';\n  html+='<div class=\"inv-summary\" style=\"grid-template-columns:repeat(3,1fr);margin-bottom:12px\">'+\n    card('Ganancia','S/ '+f(gan),gan>=0?'var(--green)':'var(--red)',gan>=0?'var(--green-bg)':'var(--red-bg)',gan>=0?'var(--green-dim)':'var(--red-dim)')+\n    card('Ventas',String(vs.length),'var(--prod)','var(--prod-bg)','var(--prod-dim)')+\n    card('Unidades',String(uds),'var(--yellow)','var(--yellow-bg)','var(--yellow-dim)')+'<\u002Fdiv>';\n  if(top) html+=fila('⭐ Producto estrella',escH(top[0])+' ('+top[1]+' und.)');\n  if(Object.keys(pagos).length){\n    html+='<div style=\"font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);margin:12px 0 4px\">Por método de pago<\u002Fdiv>';\n    html+=Object.entries(pagos).sort((a,b)=>b[1]-a[1]).map(p=>fila(escH(p[0]),'S/ '+f(p[1]),'var(--green)')).join('');\n  }\n  html+='<div style=\"font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);margin:12px 0 4px\">Movimientos del día<\u002Fdiv>';\n  html+=fila('Ingresos','S/ '+f(ingD),'var(--green)')+fila('Egresos','S/ '+f(egrD),'var(--red)')+\n        fila('Neto del día','S/ '+f(ingD-egrD),(ingD-egrD)>=0?'var(--green)':'var(--red)');\n  if(!vs.length&&!txD.length) html='<div class=\"empty-tx\">Sin movimientos registrados este día.<\u002Fdiv>';\n  el.innerHTML=html;\n}\n\nlet _stockId=null, _stockUlt=0;\nfunction openStockCat(id){\n  const p=catList().find(x=>x.id===id); if(!p) return;\n  _stockId=id;\n  _stockUlt=parseFloat(p.costo)||0;\n  document.getElementById('stockProdName').textContent=p.nombre+(p.cat?' · '+p.cat:'')+' — ahora '+(parseInt(p.stock)||0)+' und.';\n  const cw=document.getElementById('stockColorWrap'), cs=document.getElementById('stockColor');\n  if(tieneColores(p)){\n    cs.innerHTML=p.colores.map(c=>'<option value=\"'+escH(c.color)+'\">'+escH(c.color)+' (ahora '+(parseInt(c.stock)||0)+')<\u002Foption>').join('');\n    cw.style.display='';\n  } else { cs.innerHTML=''; cw.style.display='none'; }\n  document.getElementById('stockQty').value=1;\n  document.getElementById('stockCosto').value=_stockUlt||'';\n  document.getElementById('stockFecha').value=new Date().toISOString().slice(0,10);\n  fillProveedores('stockProveedor', p.proveedor||'');\n  const b=document.getElementById('stockUltCosto');\n  if(_stockUlt>0){ b.style.display='inline-flex'; b.textContent='Mismo costo de antes (S/ '+f(_stockUlt)+')'; } else b.style.display='none';\n  updateStockPreviewCat();\n  document.getElementById('stockModalBg').classList.add('open');\n}\nfunction closeStockCat(){ document.getElementById('stockModalBg').classList.remove('open'); }\nfunction setStockCosto(v){ document.getElementById('stockCosto').value=v; updateStockPreviewCat(); }\nfunction updateStockPreviewCat(){\n  const p=catList().find(x=>x.id===_stockId); if(!p) return;\n  const qty=Math.max(0,parseInt(document.getElementById('stockQty').value)||0);\n  const unit=Math.max(0,parseFloat(document.getElementById('stockCosto').value)||0);\n  const colSel=tieneColores(p)?document.getElementById('stockColor').value:'';\n  const stAnt=parseInt(p.stock)||0, cAnt=parseFloat(p.costo)||0;\n  const stNue=stAnt+qty;\n  const cNue=stNue?((stAnt*cAnt)+(qty*unit))/stNue:unit;\n  const precio=parseFloat(p.precio)||0;\n  const gan=precio-cNue;\n  document.getElementById('stockPreview').innerHTML=\n    (colSel?'Color <b style=\"color:var(--prod)\">'+escH(colSel)+'<\u002Fb>: '+varStock(p,colSel)+' → <b style=\"color:var(--prod)\">'+(varStock(p,colSel)+qty)+' und.<\u002Fb><br>':'')+\n    'Stock total: <b style=\"color:var(--text)\">'+stAnt+'<\u002Fb> → <b style=\"color:var(--prod)\">'+stNue+' und.<\u002Fb><br>'+\n    'Costo promedio: S/ '+f(cAnt)+' → <b style=\"color:var(--text)\">S/ '+f(cNue)+'<\u002Fb><br>'+\n    (unit>0?'Inversión de esta compra: <b style=\"color:var(--prod)\">S/ '+f(qty*unit)+'<\u002Fb>':'<span style=\"color:var(--green)\">Sin costo — todo lo que vendas es ganancia<\u002Fspan>')+\n    (precio>0?'<br>Ganancia por unidad: <b style=\"color:'+(gan>=0?'var(--green)':'var(--red)')+'\">S/ '+f(gan)+'<\u002Fb>':'');\n}\nfunction saveStockCat(){\n  const p=catList().find(x=>x.id===_stockId); if(!p) return;\n  const qty=Math.max(0,parseInt(document.getElementById('stockQty').value)||0);\n  const unit=Math.max(0,parseFloat(document.getElementById('stockCosto').value)||0);\n  const fecha=document.getElementById('stockFecha').value||new Date().toISOString().slice(0,10);\n  if(!qty){ toast('Indica cuántas unidades entran','err'); return; }\n  const colSel=tieneColores(p)?document.getElementById('stockColor').value:'';\n  if(tieneColores(p)&&!colSel){ toast('Elige el color que entra','err'); return; }\n  const stAnt=parseInt(p.stock)||0, cAnt=parseFloat(p.costo)||0;\n  const stNue=stAnt+qty;\n  p.costo=parseFloat((stNue?((stAnt*cAnt)+(qty*unit))/stNue:unit).toFixed(2));\n  if(colSel) addVarStock(p,colSel,qty); else p.stock=stNue;\n  if(unit>0){\n    if(!Array.isArray(data.productos)) data.productos=[];\n    data.productos.push({\n      id:'compra_'+p.id+'_'+Date.now().toString(),\n      tipo:'deposito',\n      desc:'Compra: '+qty+'× '+p.nombre+(colSel?' ('+colSel+')':''),\n      monto:parseFloat((qty*unit).toFixed(2)),\n      unds:qty, unitCosto:unit,\n      fecha,\n      proveedor:(document.getElementById('stockProveedor').value==='__new__'?'':document.getElementById('stockProveedor').value),\n      nota:'Desde Catálogo · S/ '+f(unit)+' c/u',\n      catalogoId:p.id\n    });\n  }\n  saveData(); closeStockCat(); renderCatalogo();\n  if(typeof renderProductosSection==='function') renderProductosSection();\n  if(typeof renderResumen==='function') renderResumen();\n  toast((unit>0?'+'+qty+' und. · S/ '+f(qty*unit)+' de inversión':'+'+qty+' und. sin costo')+(colSel?' · '+colSel:''),'ok');\n}\n\nfunction nuevaVentaDesdeFab(){\n  if(!catList().length){ toast('Primero agrega productos en el Catálogo','err'); switchTab('productos'); return; }\n  switchTab('productos');\n  openVentaModal();\n}\n\nfunction ventaRapida(id){\n  openVentaModal();\n  const p=catList().find(x=>x.id===id);\n  if(p&&tieneColores(p)){\n    if(p.colores.length===1) ventaQty(cartKey(id,p.colores[0].color),1);\n    else { document.getElementById('ventaBuscar').value=p.nombre; renderVentaPicker(); toast('Elige el color a vender','ok'); }\n    return;\n  }\n  ventaQty(id,1);\n}\nfunction openVentaModal(){\n  if(!catList().length){ toast('Primero agrega productos al catálogo','err'); return; }\n  _ventaCart={};\n  document.getElementById('ventaFecha').value=new Date().toISOString().slice(0,10);\n  document.getElementById('ventaPago').value='Efectivo';\n  document.getElementById('ventaNota').value='';\n  document.getElementById('ventaBuscar').value='';\n  document.getElementById('ventaIngreso').checked=true;\n  renderVentaPicker(); updateVentaTotal();\n  document.getElementById('ventaModalBg').classList.add('open');\n}\nfunction closeVentaModal(){ document.getElementById('ventaModalBg').classList.remove('open'); }\n\nfunction ventaQty(key,d){\n  const k=parseKey(key);\n  const p=catList().find(x=>x.id===k.id); if(!p) return;\n  const cur=_ventaCart[key]?_ventaCart[key].qty:0;\n  const max=varStock(p,k.color);\n  let next=cur+d;\n  if(next<0) next=0;\n  if(max>0&&next>max){ next=max; toast('Solo hay '+max+' en stock'+(k.color?' de '+k.color:''),'err'); }\n  if(next===0) delete _ventaCart[key];\n  else _ventaCart[key]={qty:next, precio:_ventaCart[key]?_ventaCart[key].precio:(parseFloat(p.precio)||0)};\n  renderVentaPicker(); updateVentaTotal();\n}\nfunction setVentaPrecio(id,val){\n  if(!_ventaCart[id]) return;\n  _ventaCart[id].precio=parseFloat(val)||0;\n  updateVentaTotal();\n}\nfunction renderVentaPicker(){\n  const el=document.getElementById('ventaPicker'); if(!el) return;\n  const q=((document.getElementById('ventaBuscar')||{}).value||'').toLowerCase().trim();\n  let list=catList().filter(p=>!q||(p.nombre||'').toLowerCase().includes(q)||(p.cat||'').toLowerCase().includes(q)||coloresTxt(p).toLowerCase().includes(q)||codigosTxt(p).toLowerCase().includes(q));\n  list=list.slice().sort(cmpCod);\n  if(!list.length){ el.innerHTML='<div class=\"empty-inv\">Sin resultados en el catálogo.<\u002Fdiv>'; return; }\n  const rows=[];\n  list.slice(0,80).forEach(p=>{\n    const vars = tieneColores(p) ? p.colores.map(c=>c.color) : [''];\n    vars.forEach(color=>{\n      const key=cartKey(p.id,color);\n      const c=_ventaCart[key];\n      const qty=c?c.qty:0;\n      const st=varStock(p,color);\n      rows.push({inCart:qty>0, html:'<div class=\"pick-row\">'+\n        '<div class=\"pick-thumb\">'+(p.img?'<img src=\"'+p.img+'\" alt=\"\">':'—')+'<\u002Fdiv>'+\n        '<div class=\"pick-info\"><div class=\"pick-name\">'+escH(p.nombre)+(color?' <span style=\"color:var(--prod);font-weight:500\">· '+escH(color)+'<\u002Fspan>':'')+' <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--text3);font-weight:400\">'+escH(varCodigo(p,color))+'<\u002Fspan><\u002Fdiv><div class=\"pick-meta\">S/ '+f(parseFloat(p.precio)||0)+((parseFloat(p.costo)||0)>0?' · gan. S/ '+f((parseFloat(p.precio)||0)-(parseFloat(p.costo)||0)):'')+(color?(st>0?' · stock '+st:' · <span style=\"color:var(--red)\">agotado<\u002Fspan>'):(st>0?' · stock '+st:''))+'<\u002Fdiv><\u002Fdiv>'+\n        '<div class=\"qty-ctrl\"><button class=\"qty-btn\" onclick=\"ventaQty(\\''+key+'\\',-1)\">−<\u002Fbutton><span class=\"qty-val\">'+qty+'<\u002Fspan><button class=\"qty-btn\" onclick=\"ventaQty(\\''+key+'\\',1)\">+<\u002Fbutton><\u002Fdiv>'+\n        (qty>0?'<input class=\"pick-precio\" type=\"number\" min=\"0\" step=\"0.5\" value=\"'+c.precio+'\" oninput=\"setVentaPrecio(\\''+key+'\\',this.value)\" title=\"Precio de venta unitario\">':'')+\n      '<\u002Fdiv>'});\n    });\n  });\n  el.innerHTML=rows.sort((a,b)=>(b.inCart?1:0)-(a.inCart?1:0)).map(r=>r.html).join('');\n}\nfunction ventaTotalCalc(){\n  return Object.values(_ventaCart).reduce((a,c)=>a+(parseFloat(c.precio)||0)*c.qty,0);\n}\nfunction updateVentaTotal(){\n  const el=document.getElementById('ventaTotal');\n  if(el) el.textContent='S/ '+f(ventaTotalCalc());\n}\nfunction saveVenta(){\n  const fecha=document.getElementById('ventaFecha').value;\n  if(!fecha){ toast('Selecciona una fecha','err'); return; }\n  const items=Object.entries(_ventaCart).filter(([,c])=>c.qty>0).map(([key,c])=>{\n    const k=parseKey(key);\n    const p=catList().find(x=>x.id===k.id)||{};\n    const st=varStock(p,k.color);\n    return {id:k.id, codigo:varCodigo(p,k.color), nombre:p.nombre||'Producto', cat:p.cat||'', color:k.color||'', precio:parseFloat(c.precio)||0, costo:parseFloat(p.costo)||0, qty:c.qty, stockAplicado:st>0};\n  });\n  if(!items.length){ toast('Agrega al menos un producto','err'); return; }\n  const total=items.reduce((a,i)=>a+i.precio*i.qty,0);\n  if(total<=0){ toast('El total no puede ser 0','err'); return; }\n  const vId='vp_'+Date.now().toString();\n  const nota=document.getElementById('ventaNota').value.trim();\n  const venta={id:vId, fecha, items, total:parseFloat(total.toFixed(2)), pago:document.getElementById('ventaPago').value, nota, txId:null};\n  items.forEach(i=>{\n    if(!i.stockAplicado) return;\n    const p=catList().find(x=>x.id===i.id);\n    if(p) addVarStock(p,i.color,-i.qty);\n  });\n  if(document.getElementById('ventaIngreso').checked){\n    const txId='venta_'+vId;\n    data.transactions.push({\n      id:txId, tipo:'ingreso', cat:'Venta de productos',\n      desc:('Venta: '+items.map(i=>i.qty+'× '+i.nombre+(i.color?' ('+i.color+')':'')).join(', ')).slice(0,90),\n      monto:parseFloat(total.toFixed(2)), fecha,\n      nota:nota||'Registrada desde Catálogo', recurrente:false, vaAHapi:false\n    });\n    venta.txId=txId;\n  }\n  ventasList().push(venta);\n  reponerList();\n  items.forEach((i,n)=>data.reponer.push({id:'rp_'+vId+'_'+n, ventaId:vId, prodId:i.id, nombre:i.nombre, color:i.color||'', codigo:i.codigo||'', qty:i.qty, fecha}));\n  saveData(); closeVentaModal();\n  buildVentaMesFilter(); renderVentasProd(); renderCatalogo(); renderResumen(); renderReponer();\n  toast('Venta registrada — S/ '+f(total),'ok');\n}\nfunction reponerList(){ if(!Array.isArray(data.reponer)) data.reponer=[]; return data.reponer; }\nfunction renderReponer(){\n  const el=document.getElementById('reponerBox'); if(!el) return;\n  const l=reponerList().slice().sort((a,b)=>String(b.fecha||'').localeCompare(String(a.fecha||'')));\n  if(!l.length){ el.innerHTML=''; return; }\n  const und=l.reduce((a,r)=>a+(parseInt(r.qty)||0),0);\n  el.innerHTML='<div style=\"margin-bottom:18px;padding:12px 14px;border-radius:var(--radius-sm);background:var(--yellow-bg);border:1px solid var(--yellow-dim)\">'+\n    '<div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px\">'+\n      '<div style=\"font-size:13px;font-weight:700;color:var(--yellow)\">Reponer en exhibición<\u002Fdiv>'+\n      '<span style=\"font-size:11px;font-weight:600;color:var(--yellow)\">'+und+' und. pendientes<\u002Fspan>'+\n    '<\u002Fdiv>'+\n    '<div style=\"font-size:11px;color:var(--text2);margin-bottom:8px\">Marca la casilla cuando lo vuelvas a poner en la tienda.<\u002Fdiv>'+\n    '<div style=\"display:flex;flex-direction:column;gap:6px\">'+\n    l.map(r=>'<label id=\"rpi_'+r.id+'\" style=\"display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--border);cursor:pointer;transition:opacity .3s,transform .3s\">'+\n      '<input type=\"checkbox\" onchange=\"marcarRepuesto(\\''+r.id+'\\')\" style=\"width:20px;height:20px;flex-shrink:0;accent-color:var(--green);cursor:pointer\">'+\n      '<div style=\"flex:1;min-width:0\">'+\n        '<div style=\"font-size:13px;font-weight:600\">Reponer: '+escH(r.nombre)+(r.color?' <span style=\"color:var(--prod);font-weight:500\">· '+escH(r.color)+'<\u002Fspan>':'')+'<\u002Fdiv>'+\n        '<div style=\"font-size:10px;color:var(--text3)\">'+(r.codigo?escH(r.codigo)+' · ':'')+'vendido '+escH(r.fecha||'')+'<\u002Fdiv>'+\n      '<\u002Fdiv>'+\n      '<span style=\"font-size:13px;font-weight:700;color:var(--yellow)\">×'+r.qty+'<\u002Fspan>'+\n    '<\u002Flabel>').join('')+\n    '<\u002Fdiv><\u002Fdiv>';\n}\nfunction marcarRepuesto(id){\n  const row=document.getElementById('rpi_'+id);\n  if(row){ row.style.opacity='0'; row.style.transform='translateX(12px)'; }\n  setTimeout(()=>{\n    data.reponer=reponerList().filter(r=>r.id!==id);\n    saveData(); renderReponer();\n    toast('Repuesto en exhibición','ok');\n  },300);\n}\nfunction deleteVenta(id){\n  if(!confirm('¿Anular esta venta? Se devuelve el stock y se quita el ingreso ligado.')) return;\n  const v=ventasList().find(x=>x.id===id); if(!v) return;\n  (v.items||[]).forEach(i=>{\n    if(i.stockAplicado===false) return;\n    const p=catList().find(x=>x.id===i.id);\n    if(p) addVarStock(p,i.color,i.qty);\n  });\n  if(v.txId) data.transactions=data.transactions.filter(t=>t.id!==v.txId);\n  data.ventasProd=ventasList().filter(x=>x.id!==id);\n  data.reponer=reponerList().filter(r=>r.ventaId!==id);\n  saveData(); buildVentaMesFilter(); renderVentasProd(); renderCatalogo(); renderResumen(); renderReponer();\n  toast('Venta anulada','ok');\n}\nfunction buildVentaMesFilter(){\n  const s=document.getElementById('ventasMes'); if(!s) return;\n  const cur=s.value;\n  const ms=[...new Set(ventasList().map(v=>(v.fecha||'').slice(0,7)).filter(Boolean))].sort().reverse();\n  s.innerHTML='<option value=\"\">Todos los meses<\u002Foption>'+ms.map(m=>{\n    const p=m.split('-');\n    return '<option value=\"'+m+'\"'+(cur===m?' selected':'')+'>'+MESES[parseInt(p[1])-1]+' '+p[0]+'<\u002Foption>';\n  }).join('');\n}\nfunction renderVentasProd(){\n  const el=document.getElementById('ventasList'); if(!el) return;\n  const mes=((document.getElementById('ventasMes')||{}).value)||'';\n  let vs=ventasList().filter(v=>!mes||(v.fecha||'').slice(0,7)===mes);\n  vs=vs.slice().sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||'')||String(b.id).localeCompare(String(a.id)));\n  const total=vs.reduce((a,v)=>a+(parseFloat(v.total)||0),0);\n  const uds=vs.reduce((a,v)=>a+(v.items||[]).reduce((x,i)=>x+i.qty,0),0);\n  const gan=vs.reduce((a,v)=>a+(v.items||[]).reduce((x,i)=>x+((parseFloat(i.precio)||0)-(parseFloat(i.costo)||0))*i.qty,0),0);\n  const badge=document.getElementById('ventasTotalBadge');\n  if(badge) badge.textContent='S/ '+f(total);\n  const stats=document.getElementById('ventasStats');\n  if(stats) stats.innerHTML=[\n    ['Vendido','S/ '+f(total),'var(--green)','var(--green-bg)','var(--green-dim)'],\n    ['Ganancia','S/ '+f(gan),gan>=0?'var(--green)':'var(--red)',gan>=0?'var(--green-bg)':'var(--red-bg)',gan>=0?'var(--green-dim)':'var(--red-dim)'],\n    ['Unidades',String(uds),'var(--prod)','var(--prod-bg)','var(--prod-dim)'],\n    ['Ticket prom.','S/ '+f(vs.length?total/vs.length:0),'var(--yellow)','var(--yellow-bg)','var(--yellow-dim)']\n  ].map(a=>'<div class=\"inv-sum-card\" style=\"background:'+a[3]+';border:1px solid '+a[4]+'\"><div class=\"inv-sum-label\" style=\"color:'+a[2]+'\">'+a[0]+'<\u002Fdiv><div class=\"inv-sum-val\" style=\"color:'+a[2]+'\">'+a[1]+'<\u002Fdiv><\u002Fdiv>').join('');\n  if(!vs.length){ el.innerHTML='<div class=\"empty-tx\">Sin ventas registradas'+(mes?' en este mes':' aún')+'. Toca “Registrar venta”.<\u002Fdiv>'; return; }\n  const groups={};\n  vs.forEach(v=>{ const k=v.fecha||'—'; (groups[k]=groups[k]||[]).push(v); });\n  el.innerHTML=Object.keys(groups).sort().reverse().map(k=>{\n    const g=groups[k];\n    const dt=k!=='—'?new Date(k+'T12:00:00'):null;\n    const lbl=dt?dt.toLocaleDateString('es-PE',{weekday:'short',day:'2-digit',month:'short'}):'Sin fecha';\n    const dayTot=g.reduce((a,v)=>a+(parseFloat(v.total)||0),0);\n    const dayGan=g.reduce((a,v)=>a+(v.items||[]).reduce((x,i)=>x+((parseFloat(i.precio)||0)-(parseFloat(i.costo)||0))*i.qty,0),0);\n    const rows=g.map(v=>{\n      const items=(v.items||[]).map(i=>i.qty+'× '+escH(i.nombre)+(i.color?' ('+escH(i.color)+')':'')).join(', ');\n      return '<div class=\"tx-item\" style=\"cursor:default\">'+\n        '<div class=\"tx-dot\" style=\"background:var(--prod)\"><\u002Fdiv>'+\n        '<div class=\"tx-info\"><div class=\"tx-name\">'+items+'<\u002Fdiv>'+\n        '<div class=\"tx-meta\">'+escH(v.pago||'Efectivo')+(v.txId?' · en Ingresos':' · sin ingreso')+(v.nota?' · '+escH(v.nota):'')+'<\u002Fdiv><\u002Fdiv>'+\n        '<div style=\"text-align:right\"><div class=\"tx-amount g\">S/ '+f(parseFloat(v.total)||0)+'<\u002Fdiv><div style=\"font-size:10px;color:var(--text3)\">gan. S/ '+f((v.items||[]).reduce((x,i)=>x+((parseFloat(i.precio)||0)-(parseFloat(i.costo)||0))*i.qty,0))+'<\u002Fdiv><\u002Fdiv>'+\n        '<button class=\"btn\" style=\"width:28px;height:28px;padding:0;justify-content:center\" onclick=\"deleteVenta(\\''+v.id+'\\')\" title=\"Anular venta\">'+\n        '<svg width=\"13\" height=\"13\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path d=\"M18 6L6 18M6 6l12 12\"/><\u002Fsvg><\u002Fbutton>'+\n      '<\u002Fdiv>';\n    }).join('');\n    return '<div class=\"venta-day\"><div class=\"venta-day-head\"><div class=\"venta-day-label\">'+lbl+'<\u002Fdiv><div class=\"venta-day-line\"><\u002Fdiv><div class=\"venta-day-total\">S/ '+f(dayTot)+' · gan. S/ '+f(dayGan)+'<\u002Fdiv><\u002Fdiv><div class=\"tx-list\">'+rows+'<\u002Fdiv><\u002Fdiv>';\n  }).join('');\n}\n\n// ── PRODUCTOS INVERSIÓN (modal independiente) ────────────────────────────────\nlet _inv2EditId = null;\nlet _inv2Type = 'deposito';\
