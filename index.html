  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0f0f0f; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #0f0f0f; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.
    </div>
  </noscript>
</head>
<body>
  <div id="__bundler_thumbnail"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="100" fill="#0f0f0f"></rect><circle cx="50" cy="50" r="20" fill="#22c55e"></circle></svg></div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html lang=\"es\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Finanzas Personales<\u002Ftitle>\n<meta name=\"description\" content=\"App de finanzas personales\">\n<meta name=\"theme-color\" content=\"#1a1a1a\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black\">\n<meta name=\"apple-mobile-web-app-title\" content=\"Finanzas\">\n\n<style>\n  :root {\n    --bg:#0f0f0f;--surface:#1a1a1a;--surface2:#222;--border:#2e2e2e;--border2:#3a3a3a;\n    --text:#f0f0f0;--text2:#999;--text3:#555;\n    --green:#22c55e;--green-bg:#0d2e1c;--green-dim:#166534;\n    --red:#ef4444;--red-bg:#2e0d0d;--red-dim:#991b1b;\n    --blue:#60a5fa;--blue-bg:#0d1e38;\n    --yellow:#fbbf24;--yellow-bg:#2e1f0a;--yellow-dim:#b45309;\n    --purple:#c084fc;--purple-bg:#1e0d38;\n    --hapi:#f472b6;--hapi-bg:#2d0a1e;--hapi-dim:#9d174d;\n    --prod:#34d399;--prod-bg:#0d2e1e;--prod-dim:#065f46;\n    --radius:10px;--radius-sm:6px;\n  }\n  body.light {\n    --bg:#f8f9fa;--surface:#ffffff;--surface2:#f1f3f5;--border:#e0e0e0;--border2:#cccccc;\n    --text:#111111;--text2:#555555;--text3:#aaaaaa;\n    --green:#16a34a;--green-bg:#dcfce7;--green-dim:#86efac;\n    --red:#dc2626;--red-bg:#fee2e2;--red-dim:#fca5a5;\n    --blue:#2563eb;--blue-bg:#dbeafe;\n    --yellow:#d97706;--yellow-bg:#fef3c7;--yellow-dim:#fcd34d;\n    --purple:#7c3aed;--purple-bg:#ede9fe;\n    --hapi:#db2777;--hapi-bg:#fce7f3;--hapi-dim:#f9a8d4;\n    --prod:#059669;--prod-bg:#d1fae5;--prod-dim:#6ee7b7;\n  }\n  /* FAB */\n  .fab{position:fixed;bottom:24px;right:20px;z-index:50;width:52px;height:52px;border-radius:50%;background:var(--green);border:none;color:#fff;font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,.4);transition:transform .15s;}\n  .fab:hover{transform:scale(1.08);}\n  .fab-menu{position:fixed;bottom:86px;right:20px;z-index:50;display:none;flex-direction:column;gap:8px;align-items:flex-end;}\n  .fab-menu.open{display:flex;}\n  .fab-item{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border2);border-radius:20px;padding:7px 14px 7px 10px;font-size:13px;cursor:pointer;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.3);}\n  .fab-item:hover{border-color:var(--green);}\n  /* NOTAS */\n  .nota-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:8px;cursor:pointer;}\n  .nota-item:hover{border-color:var(--border2);}\n  .nota-text{font-size:13px;color:var(--text);white-space:pre-wrap;word-break:break-word;}\n  .nota-date{font-size:10px;color:var(--text3);margin-top:6px;}\n  /* RACHA */\n  .racha-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:14px;display:flex;align-items:center;gap:12px;}\n  /* BARRAS MENSUALES */\n  .barras-wrap{margin-bottom:16px;overflow-x:auto;}\n  .barras-inner{display:flex;gap:6px;min-width:320px;align-items:flex-end;height:80px;padding:0 2px;}\n  .barra-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:18px;}\n  .barra-pair{width:100%;display:flex;gap:2px;align-items:flex-end;height:64px;}\n  .barra-ing{flex:1;border-radius:3px 3px 0 0;background:var(--green);min-height:2px;transition:height .3s;}\n  .barra-egr{flex:1;border-radius:3px 3px 0 0;background:var(--red);min-height:2px;transition:height .3s;}\n  .barra-label{font-size:9px;color:var(--text3);}\n  /* CAT CUSTOM */\n  .cat-tag{display:inline-flex;align-items:center;gap:4px;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:3px 8px;font-size:11px;color:var(--text2);margin:2px;}\n  .cat-tag button{background:none;border:none;color:var(--text3);cursor:pointer;font-size:13px;padding:0;line-height:1;}\n  *{box-sizing:border-box;margin:0;padding:0;}\n  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;}\n\n  header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:54px;position:sticky;top:0;z-index:20;gap:10px;}\n  .logo{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--text);}\n  .logo svg{color:var(--green);}\n  .header-right{display:flex;gap:6px;}\n\n  .backup-panel{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 16px;display:none;gap:8px;flex-wrap:wrap;align-items:center;}\n  .backup-panel.open{display:flex;}\n  .backup-panel span{font-size:12px;color:var(--text2);flex:1;min-width:160px;}\n\n  .year-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:8px 16px;display:flex;align-items:center;gap:10px;}\n  .year-bar label{font-size:12px;color:var(--text2);}\n  .year-bar select{background:var(--surface2);border:1px solid var(--border2);color:var(--text);border-radius:var(--radius-sm);padding:4px 10px;font-size:13px;font-weight:600;}\n  .year-bar select option{background:#1a1a1a;}\n\n  .tabs{display:flex;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:54px;z-index:19;}\n  .tab{flex:1;padding:8px 2px;font-size:11px;font-weight:500;color:var(--text2);cursor:pointer;text-align:center;border-bottom:2px solid transparent;}\n  .tab:hover{color:var(--text);}\n  .tab.active{color:var(--text);border-bottom-color:var(--green);}\n  .tab-icon{display:flex;align-items:center;justify-content:center;margin-bottom:3px;}\n\n  .section{display:none;padding:14px 16px;}\n  .section.active{display:block;}\n\n  /* SUMMARY */\n  .summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px;}\n  @media(min-width:480px){.summary-grid{grid-template-columns:repeat(3,1fr);}}\n  @media(min-width:700px){.summary-grid{grid-template-columns:repeat(5,1fr);}}\n  .sum-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;}\n  .sum-label{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}\n  .sum-value{font-size:19px;font-weight:700;}\n  .sum-value.green{color:var(--green);}\n  .sum-value.red{color:var(--red);}\n  .sum-value.yellow{color:var(--yellow);}\n\n  .month-table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border);}\n  table{width:100%;border-collapse:collapse;font-size:12px;min-width:580px;}\n  thead th{background:var(--surface2);color:var(--text2);font-size:10px;text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap;}\n  thead th:first-child{text-align:left;}\n  tbody tr{border-bottom:1px solid var(--border);}\n  tbody tr:last-child{border-bottom:none;}\n  tbody tr:hover{background:var(--surface2);}\n  tbody tr.total-row{background:var(--surface2);font-weight:700;}\n  td{padding:8px 10px;text-align:right;color:var(--text);}\n  td:first-child{text-align:left;color:var(--text2);font-weight:500;}\n  td.g{color:var(--green);}td.r{color:var(--red);}td.p{color:var(--purple);}td.y{color:var(--yellow);}\n  td.pos{color:var(--green);font-weight:700;}td.neg{color:var(--red);font-weight:700;}\n\n  /* TX */\n  .sec-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px;}\n  .sec-header h3{font-size:15px;font-weight:600;}\n  .tx-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}\n  .tx-filter select,.tx-filter input{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-sm);padding:0 10px;height:32px;font-size:12px;}\n  .tx-filter input{flex:1;min-width:120px;}\n  .tx-filter select option{background:#1a1a1a;}\n  .tx-list{display:flex;flex-direction:column;gap:6px;}\n  .tx-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;display:flex;align-items:center;gap:10px;cursor:pointer;}\n  .tx-item:hover{border-color:var(--border2);}\n  .tx-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}\n  .tx-info{flex:1;min-width:0;}\n  .tx-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}\n  .tx-meta{font-size:11px;color:var(--text3);margin-top:1px;}\n  .tx-amount{font-size:14px;font-weight:700;white-space:nowrap;}\n  .tx-amount.g{color:var(--green);}\n  .tx-amount.r{color:var(--red);}\n  .empty-tx{text-align:center;padding:2rem;color:var(--text3);font-size:13px;}\n\n  /* INVERSIONES */\n  .inv-section{margin-bottom:20px;}\n  .inv-section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px;}\n  .inv-section-title{display:flex;align-items:center;gap:10px;}\n  .inv-section-title h3{font-size:15px;font-weight:700;}\n  .inv-badge-total{font-size:13px;font-weight:700;padding:4px 12px;border-radius:20px;}\n  .inv-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px;}\n  @media(max-width:400px){.inv-summary{grid-template-columns:repeat(3,1fr);}}\n  .inv-sum-card{border-radius:var(--radius-sm);padding:10px 12px;text-align:center;}\n  .inv-sum-label{font-size:10px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;}\n  .inv-sum-val{font-size:16px;font-weight:700;}\n  .inv-moves{display:flex;flex-direction:column;gap:5px;}\n  .inv-move{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 12px;display:flex;align-items:center;gap:10px;cursor:pointer;}\n  .inv-move:hover{border-color:var(--border2);}\n  .inv-move-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}\n  .inv-move-info{flex:1;min-width:0;}\n  .inv-move-desc{font-size:13px;font-weight:500;}\n  .inv-move-meta{font-size:11px;color:var(--text3);}\n  .inv-move-amt{font-size:13px;font-weight:700;white-space:nowrap;}\n  .inv-divider{border:none;border-top:1px solid var(--border);margin:16px 0;}\n  .empty-inv{text-align:center;padding:1.5rem;color:var(--text3);font-size:13px;background:var(--surface);border-radius:var(--radius-sm);border:1px dashed var(--border2);}\n\n  /* BUTTONS */\n  .btn{background:var(--surface2);border:1px solid var(--border2);color:var(--text);border-radius:var(--radius-sm);padding:0 13px;height:34px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}\n  .btn:hover{background:#2a2a2a;}\n  .btn-green{background:var(--green-bg);border-color:var(--green-dim);color:var(--green);font-weight:600;}\n  .btn-red{background:var(--red-bg);border-color:var(--red-dim);color:var(--red);}\n  .btn-hapi{background:var(--hapi-bg);border-color:var(--hapi-dim);color:var(--hapi);font-weight:600;}\n  .btn-prod{background:var(--prod-bg);border-color:var(--prod-dim);color:var(--prod);font-weight:600;}\n  .btn-backup{background:var(--surface2);border:1px solid var(--border2);color:var(--text);border-radius:var(--radius-sm);padding:0 12px;height:32px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;}\n  .btn-backup:hover{border-color:var(--green);color:var(--green);}\n  .btn-backup.hi{border-color:var(--green-dim);color:var(--green);}\n  .btn-icon-hd{background:var(--surface2);border:1px solid var(--border2);color:var(--text2);border-radius:var(--radius-sm);width:34px;height:34px;cursor:pointer;display:flex;align-items:center;justify-content:center;}\n  .btn-icon-hd:hover{color:var(--text);}\n  .btn-sm{height:28px;font-size:12px;padding:0 10px;}\n\n  /* MODAL */\n  .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;align-items:flex-end;justify-content:center;}\n  .modal-bg.open{display:flex;}\n  @media(min-width:560px){.modal-bg{align-items:center;}}\n  .modal{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius) var(--radius) 0 0;width:100%;max-width:440px;max-height:92vh;overflow-y:auto;display:flex;flex-direction:column;}\n  @media(min-width:560px){.modal{border-radius:var(--radius);}}\n  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:1;}\n  .modal-head h3{font-size:15px;font-weight:600;}\n  .modal-body{padding:14px 16px;display:flex;flex-direction:column;gap:11px;flex:1;}\n  .modal-foot{padding:11px 16px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:var(--surface);}\n  .field{display:flex;flex-direction:column;gap:4px;}\n  .field label{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;}\n  .field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--border2);color:var(--text);border-radius:var(--radius-sm);padding:7px 10px;font-size:13px;}\n  .field input:focus,.field select:focus{outline:none;border-color:var(--green);}\n  .field select option{background:#1a1a1a;}\n  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}\n  .type-toggle{display:grid;grid-template-columns:1fr 1fr;gap:6px;}\n  .type-btn{padding:8px;border-radius:var(--radius-sm);border:1px solid var(--border2);cursor:pointer;text-align:center;font-size:13px;font-weight:600;background:var(--surface2);color:var(--text2);}\n  .type-btn.sel-ing{background:var(--green-bg);border-color:var(--green-dim);color:var(--green);}\n  .type-btn.sel-egr{background:var(--red-bg);border-color:var(--red-dim);color:var(--red);}\n  .type-btn.sel-dep{background:var(--hapi-bg);border-color:var(--hapi-dim);color:var(--hapi);}\n  .type-btn.sel-ret{background:var(--red-bg);border-color:var(--red-dim);color:var(--red);}\n\n  /* PROGRESS BAR */\n  .prog-wrap{margin-bottom:14px;}\n  .prog-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}\n  .prog-label{font-size:11px;color:var(--text2);width:60px;flex-shrink:0;}\n  .prog-bar-bg{flex:1;height:7px;background:var(--surface2);border-radius:4px;overflow:hidden;}\n  .prog-bar-fill{height:100%;border-radius:4px;transition:width .4s ease;}\n  .prog-val{font-size:11px;font-weight:600;width:70px;text-align:right;flex-shrink:0;}\n\n  /* MES ACTUAL BANNER */\n  .mes-banner{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap;}\n  .mes-banner-item{flex:1;min-width:80px;}\n  .mes-banner-label{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;}\n  .mes-banner-val{font-size:17px;font-weight:700;}\n\n  /* ALERTA */\n  .alerta-banner{background:var(--yellow-bg);border:1px solid var(--yellow-dim);border-radius:var(--radius);padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--yellow);}\n\n  /* META */\n  .meta-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:14px;}\n  .meta-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:8px;flex-wrap:wrap;}\n  .meta-title{font-size:12px;font-weight:600;color:var(--text2);display:flex;align-items:center;gap:6px;}\n  .meta-bar-bg{height:10px;background:var(--surface2);border-radius:5px;overflow:hidden;margin-bottom:6px;}\n  .meta-bar-fill{height:100%;border-radius:5px;background:var(--green);transition:width .4s ease;}\n  .meta-footer{display:flex;justify-content:space-between;font-size:11px;color:var(--text3);}\n\n  .toast.show{transform:translateX(-50%) translateY(0);}\n  .toast.ok{border-color:var(--green-dim);color:var(--green);}\n  .toast.err{border-color:var(--red-dim);color:var(--red);}\n  /* CATÁLOGO Y VENTAS DE PRODUCTOS */\n  .prod-subtabs{display:flex;gap:6px;margin-bottom:14px;}\n  .prod-subtab{flex:1;text-align:center;padding:7px 4px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;}\n  .prod-subtab.active{background:var(--prod-bg);border-color:var(--prod-dim);color:var(--prod);}\n  .cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;}\n  .cat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}\n  .cat-photo{width:100%;height:112px;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:11px;}\n  .cat-photo img{width:100%;height:100%;object-fit:cover;display:block;}\n  .cat-body{padding:9px 10px;display:flex;flex-direction:column;gap:5px;}\n  .cat-name{font-size:13px;font-weight:600;line-height:1.25;}\n  .cat-chip{align-self:flex-start;font-size:9px;padding:2px 7px;border-radius:10px;background:var(--prod-bg);color:var(--prod);border:1px solid var(--prod-dim);text-transform:uppercase;letter-spacing:.05em;}\n  .cat-price{font-size:14px;font-weight:700;color:var(--green);}\n  .cat-stock{font-size:11px;color:var(--text2);}\n  .cat-stock.low{color:var(--red);font-weight:700;}\n  .cat-actions{display:flex;gap:5px;flex-wrap:wrap;}\n  .pick-list{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow-y:auto;}\n  .pick-row{display:flex;align-items:center;gap:9px;padding:7px 9px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);flex-wrap:wrap;}\n  .pick-thumb{width:36px;height:36px;border-radius:var(--radius-sm);background:var(--surface2);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:10px;}\n  .pick-thumb img{width:100%;height:100%;object-fit:cover;}\n  .pick-info{flex:1;min-width:90px;}\n  .pick-name{font-size:12px;font-weight:600;}\n  .pick-meta{font-size:10px;color:var(--text3);}\n  .qty-ctrl{display:flex;align-items:center;gap:5px;}\n  .qty-btn{width:26px;height:26px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--surface2);color:var(--text);font-size:15px;line-height:1;cursor:pointer;}\n  .qty-val{min-width:20px;text-align:center;font-size:13px;font-weight:700;}\n  .pick-precio{width:76px;background:var(--surface2);border:1px solid var(--prod-dim);color:var(--prod);border-radius:var(--radius-sm);padding:5px 7px;font-size:12px;font-weight:600;}\n  .venta-day{margin-bottom:14px;}\n  .venta-day-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;}\n  .venta-day-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--prod);}\n  .venta-day-line{flex:1;height:1px;background:var(--border);}\n  .venta-day-total{font-size:11px;color:var(--text3);}\n  .foto-box{border:1px dashed var(--border2);border-radius:var(--radius-sm);padding:14px;text-align:center;font-size:12px;color:var(--text3);cursor:pointer;background:var(--surface2);}\n  .foto-box:hover{border-color:var(--prod);color:var(--prod);}\n  /* VOUCHERS */\n  .vch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;}\n  .vch-card{position:relative;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface2);cursor:pointer;}\n  .vch-card img{width:100%;height:110px;object-fit:cover;display:block;}\n  .vch-cap{padding:4px 6px;font-size:10px;color:var(--text2);display:flex;justify-content:space-between;gap:4px;}\n  .vch-cap b{color:var(--hapi);}\n  .vch-folder{display:flex;align-items:center;gap:5px;padding:5px 11px;border-radius:20px;border:1px solid var(--border2);background:var(--surface2);color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}\n  .vch-folder:hover{border-color:var(--hapi-dim);color:var(--hapi);}\n  .vch-folder.on{background:var(--hapi-bg);border-color:var(--hapi-dim);color:var(--hapi);}\n  .vch-folder-bar{display:flex;flex-wrap: ep=\"0.01\" placeholder=\"0.00\"><\u002Fdiv>\n        <div class=\"field\"><label>Notas<\u002Flabel><input type=\"text\" id=\"inv2Nota\" placeholder=\"Opcional...\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"modal-foot\">\n      <button class=\"btn btn-red\" id=\"inv2BtnDelete\" onclick=\"deleteInv2()\" style=\"display:none;margin-right:auto\">\n        <svg width=\"13\" height=\"13\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path d=\"M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6\"><\u002Fpath><\u002Fsvg>\n        Eliminar\n      <\u002Fbutton>\n      <button class=\"btn\" onclick=\"closeInvModal2()\">Cancelar<\u002Fbutton>\n      <button class=\"btn btn-hapi\" id=\"inv2BtnSave\" onclick=\"saveInv2()\">Guardar<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- MODAL PRODUCTO (CATÁLOGO) -->\n<div class=\"modal-bg\" id=\"prodModalBg\" onclick=\"if(event.target===this)closeProdModal()\">\n  <div class=\"modal\">\n    <div class=\"modal-head\">\n      <h3 id=\"prodModalTitle\">Nuevo producto<\u002Fh3>\n      <button class=\"btn\" style=\"width:32px;height:32px;padding:0;justify-content:center\" onclick=\"closeProdModal()\">\n        <svg width=\"15\" height=\"15\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path d=\"M18 6L6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg>\n      <\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"modal-body\">\n      <div class=\"field\">\n        <label>Foto del producto<\u002Flabel>\n        <div class=\"foto-box\" onclick=\"document.getElementById('catFotoInput').click()\">Toca para subir una foto<\u002Fdiv>\n        <input type=\"file\" id=\"catFotoInput\" accept=\"image/*\" style=\"display:none\" onchange=\"onCatFoto(this)\">\n        <div id=\"catFotoWrap\" style=\"display:none;align-items:center;gap:10px;margin-top:6px\">\n          <img id=\"catFotoPreview\" alt=\"\" style=\"width:74px;height:74px;object-fit:cover;border-radius:var(--radius-sm);border:1px solid var(--border2)\">\n          <button class=\"btn btn-red btn-sm\" onclick=\"quitarCatFoto()\">Quitar foto<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"row2\">\n        <div class=\"field\"><label>Código *<\u002Flabel><input type=\"text\" id=\"catCodigo\" placeholder=\"Se arma con la categoría\" style=\"text-transform:uppercase\" oninput=\"_catCodMan=!!this.value.trim();onCatCodigo(this.value)\"><\u002Fdiv>\n        <div class=\"field\"><label>Nombre *<\u002Flabel><input type=\"text\" id=\"catNombre\" placeholder=\"Ej: Llavero gato negro\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"field\">\n        <label>Colores <span style=\"color:var(--text3);font-weight:400\">(opcional)<\u002Fspan><\u002Flabel>\n        <div style=\"font-size:11px;color:var(--text3);margin:-2px 0 6px\">Si el producto varía de color, agrega cada color con su código y su propio stock. El código del color se arma solo (código-COLOR), pero puedes cambiarlo. Si no varía, déjalo vacío y usa el stock general.<\u002Fdiv>\n        <div id=\"catColoresBox\" style=\"display:flex;flex-direction:column;gap:6px\"><\u002Fdiv>\n        <datalist id=\"catColoresList\"><\u002Fdatalist>\n        <button class=\"btn btn-sm\" style=\"margin-top:7px\" onclick=\"addCatColor()\">+ Agregar color<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"row2\">\n        <div class=\"field\"><label>Categoría<\u002Flabel><input type=\"text\" id=\"catCategoria\" list=\"catCatsList\" placeholder=\"Ej: Lentes\" oninput=\"onCatCategoria(this.value)\"><datalist id=\"catCatsList\"><\u002Fdatalist><\u002Fdiv>\n        <div class=\"field\"><label id=\"catStockLabel\">Stock (0 = sin control)<\u002Flabel><input type=\"number\" id=\"catStock\" min=\"0\" step=\"1\" placeholder=\"0\" oninput=\"updateCatGanancia()\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"row2\">\n        <div class=\"field\"><label>Precio de costo (S/)<\u002Flabel><input type=\"number\" id=\"catCosto\" mi lay:flex;gap:6px;flex-wrap:wrap\">\n        <button class=\"btn btn-sm\" onclick=\"setStockCosto(0)\">No me costó (0)<\u002Fbutton>\n        <button class=\"btn btn-sm\" id=\"stockUltCosto\" style=\"display:none\" onclick=\"setStockCosto(_stockUlt)\"><\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"row2\">\n        <div class=\"field\"><label>Fecha de la compra<\u002Flabel><input type=\"date\" id=\"stockFecha\"><\u002Fdiv>\n        <div class=\"field\"><label>Proveedor<\u002Flabel>\n          <select id=\"stockProveedor\" onchange=\"onProveedorChange(this)\">\n            <option value=\"\">Sin proveedor<\u002Foption>\n          <\u002Fselect>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div id=\"stockPreview\" style=\"padding:10px 12px;border-radius:var(--radius-sm);background:var(--surface2);border:1px solid var(--border);font-size:12px;color:var(--text2);line-height:1.8\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"modal-foot\">\n      <button class=\"btn\" onclick=\"closeStockCat()\">Cancelar<\u002Fbutton>\n      <button class=\"btn btn-prod\" onclick=\"saveStockCat()\">Guardar entrada<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- MODAL VENTA -->\n<div class=\"modal-bg\" id=\"ventaModalBg\" onclick=\"if(event.target===this)closeVentaModal()\">\n  <div class=\"modal\">\n    <div class=\"modal-head\">\n      <h3>Registrar venta<\u002Fh3>\n      <button class=\"btn\" style=\"width:32px;height:32px;padding:0;justify-content:center\" onclick=\"closeVentaModal()\">\n        <svg width=\"15\" height=\"15\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path d=\"M18 6L6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg>\n      <\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"modal-body\">\n      <div class=\"row2\">\n        <div class=\"field\"><label>Fecha *<\u002Flabel><input type=\"date\" id=\"ventaFecha\"><\u002Fdiv>\n        <div class=\"field\"><label>Método de pago<\u002Flabel>\n          <select id=\"ventaPa o','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];\nconst ING_CATS=['Trabajo España','Trabajo La Unión'];\nconst EGR_CATS=['Comidas','Pasajes','Fiestas','Spotify'];\nconst CAT_DOTS={'Trabajo España':'#60a5fa','Trabajo La Unión':'#22c55e','Venta de productos':'#c084fc','Comidas':'#f87171','Pasajes':'#fbbf24','Fiestas':'#fb923c','Spotify':'#1db954','Otros':'#999'};\n\nlet data={years:[],transactions:[],hapi:[],productos:[]};\nlet activeYear=new Date().getFullYear();\nlet editTxId=null;\nlet editInvId=null;\nlet editInvSrc=null;\nlet txType='ingreso';\nlet invType='deposito';\nlet invSrc='hapi';\n\nfunction renderProdChart(){\n  const el=document.getElementById('prodChart'); if(!el) return;\n  const vs=(data.ventasProd||[]).filter(v=>(v.fecha||'').slice(0,4)===String(activeYear));\n  if(!vs.length){ el.innerHTML='<div class=\"empty-tx\" style=\"padding:1.2rem\">Sin ventas registradas en '+activeYear+'.<\u002Fdiv>'; return; }\n  const meses=MESES.map((m,i)=>{\n    const mv=vs.filter(v=>parseInt((v.fecha||'').slice(5,7))-1===i);\n    const tot=mv.reduce((a,v)=>a+(parseFloat(v.total)||0),0);\n    const gan=mv.reduce((a,v)=>a+(v.items||[]).reduce((x,i2)=>x+((parseFloat(i2.precio)||0)-(parseFloat(i2.costo)||0))*i2.qty,0),0);\n    return {m:m.slice(0,3), tot, gan};\n  });\n  const max=Math.max(1,...meses.map(x=>x.tot));\n  const totY=meses.reduce((a,x)=>a+x.tot,0), ganY=meses.reduce((a,x)=>a+x.gan,0);\n  el.innerHTML=\n    '<div class=\"cmp-legend\" style=\"display:flex;gap:14px;font-size:11px;color:var(--text2);margin-bottom:8px\">'+\n      '<span><span style=\"display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--prod);margin-right:5px\"><\u002Fspan>Vendido<\u002Fspan>'+\n      '<span><span style=\"display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--green);margin-right:5px\"><\u002Fspan>Ganancia<\u002Fspan>'+\n    '<\u002Fdiv>'+\n    meses.filter(x=>x.tot>0).map(x=>\n      '<div style=\"display:flex;align-items:center;gap:8px;margin-bottom:7px\">'+\n        '<div style=\"width:34px;font-size:11px;color:var(--text2)\">'+x.m+'<\u002Fdiv>'+\n        '<div style=\"flex:1;display:flex;flex-direction:column;gap:3px\">'+\n          '<div style=\"height:8px;border-radius:4px;background:var(--prod);width:'+(x.tot/max*100).toFixed(1)+'%;min-width:2px\"><\u002Fdiv>'+\n          '<div style=\"height:8px;border-radius:4px;background:var(--green);width:'+(Math.max(0,x.gan)/max*100).toFixed(1)+'%;min-width:2px\"><\u002Fdiv>'+\n        '<\u002Fdiv>'+\n        '<div style=\"width:96px;text-align:right;font-size:11px\"><div style=\"color:var(--prod);font-weight:600\">S/ '+f(x.tot)+'<\u002Fdiv><div style=\"color:var(--green)\">S/ '+f(x.gan)+'<\u002Fdiv><\u002Fdiv>'+\n      '<\u002Fdiv>'\n    ).join('')+\n    '<div style=\"display:flex;justify-content:space-between;margin-top:10px;padding-top:9px;border-top:1px solid var(--border);font-size:12px\">'+\n      '<span style=\"color:var(--text2)\">Total '+activeYear+'<\u002Fspan>'+\n      '<span><b style=\"color:var(--prod)\">S/ '+f(totY)+'<\u002Fb> · ganancia <b style=\"color:var(--green)\">S/ '+f(ganY)+'<\u002Fb><\u002Fspan>'+\n    '<\u002Fdiv>';\n}\n\nfunction renderGrafico(){\n  const txs=data.transactions.filter(t=>getTxYear(t)===activeYear);\n  const hapiNet=calcNet(data.hapi||[]);\n  const prodNet=(data.productos||[]).reduce((a,m)=>a+(m.tipo==='deposito'?m.monto:-m.monto),0);\n\n  const esp=txs.filter(t=>t.tipo==='ingreso'&&t.cat==='Trabajo España').reduce((a,t)=>a+t.monto,0);\n  const uni=txs.filter(t=>t.tipo==='ingreso'&&t.cat==='Trabajo La Unión').reduce((a,t)=>a+t.monto,0);\n  const ven=txs.filter(t=>t.tipo==='ingreso'&&t.cat==='Venta de productos').reduce((a,t)=>a+t.monto,0);\n  const com=txs.filter(t=>t.tipo==='egreso'&&t.cat==='Comidas').reduce((a,t)=>a+t.monto,0);\n  const pas=txs.filter(t=>t.tipo==='egreso'&&t.cat==='Pasajes').reduce((a,t)=>a+t.monto,0);\n  const fie=txs.filter(t=>t.tipo==='egreso'&&t.cat==='Fiestas').reduce((a,t)=>a+t.monto,0);\n  const spo=txs.filter(t=>t.tipo==='egreso'&&t.cat==='Spotify').reduce((a,t)=>a+t.monto,0);\n  const otr=txs.filter(t=>t.tipo==='egreso'&&t.cat==='Otros').reduce((a,t)=>a+t.monto,0);\n\n  const slices=[\n    {label:'Trabajo España',   val:esp,  color:'#60a5fa'},\n    {label:'Trabajo La Unión', val:uni,  color:'#22c55e'},\n    {label:'Venta productos',  val:ven,  color:'#c084fc'},\n    {label:'En Hapi',          val:hapiNet>0?hapiNet:0, color:'#f472b6'},\n    {label:'Comidas',          val:com,  color:'#f87171'},\n    {label:'Pasajes',          val:pas,  color:'#fbbf24'},\n    {label:'Fiestas',          val:fie,  color:'#fb923c'},\n    {label:'Spotify',          val:spo,  color:'#1db954'},\n    {label:'Otros egresos',    val:otr,  color:'#888'},\n    {label:'Inv. Productos',   val:prodNet>0?prodNet:0, color:'#34d399'},\n  ].filter(s=>s.val>0);\n\n  const total=slices.reduce((a,s)=>a+s.val,0);\n  document.getElementById('grafYear').textContent=activeYear;\n  document.getElementById('donutValue').textContent='S/ '+f(total);\n  document.getElementById('donutLabel').textContent='Total';\n\n  const canvas=document.getElementById('donutCanvas');\n  if(!canvas)return;\n  const ctx=canvas.getContext('2d');\n  const W=260,H=260,cx=W/2,cy=H/2,R=110,r=62;\n  ctx.clearRect(0,0,W,H);\n\n  if(!slices.length){\n    ctx.fillStyle='#333';\n    ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.fill();\n    ctx.fillStyle='#0f0f0f';\n    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();\n    return;\n  }\n\n  let angle=-Math.PI/2;\n  const gap=0.018;\n  slices.forEach(s=>{\n    const sweep=(s.val/total)*Math.PI*2-gap;\n    ctx.beginPath();\n    ctx.moveTo(cx,cy);\n    ctx.arc(cx,cy,R,angle,angle+sweep);\n    ctx.closePath();\n    ctx.fillStyle=s.color;\n    ctx.fill();\n    angle+=sweep+gap;\n  });\n\n  // Hole\n  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);\n  ctx.fillStyle='#0f0f0f';ctx.fill();\n\n  // Hover interaction\n  canvas.onmousemove=function(e){\n    const rect=canvas.getBoundingClientRect();\n    const mx=e.clientX-rect.left-cx;\n    const my=e.clientY-rect.top-cy;\n    const dist=Math.sqrt(mx*mx+my*my);\n    if(dist<r||dist>R){\n      document.getElementById('donutLabel').textContent='Total';\n      document.getElementById('donutValue').textContent='S/ '+f(total);\n      return;\n    }\n    let a=Math.atan2(my,mx)+Math.PI/2;\n    if(a<0)a+=Math.PI*2;\n    let ang=-Math.PI/2+Math.PI/2; // start = -PI/2, normalized\n    let cumAngle=0;\n    for(const s of slices){\n      const sweep=(s.val/total)*Math.PI*2-gap;\n      if(a>=cumAngle&&a<=cumAngle+sweep){\n        document.getElementById('donutLabel').textContent=s.label;\n        document.getElementById('donutValue').textContent='S/ '+f(s.val);\n        return;\n      }\n      cumAngle+=sweep+gap;\n    }\n    document.getElementById('donutLabel').textContent='Total';\n    document.getElementById('donutValue').textContent='S/ '+f(total);\n  };\n  canvas.onmouseleave=function(){\n    document.getElementById('donutLabel').textContent='Total';\n    document.getElementById('donutValue').textContent='S/ '+f(total);\n  };\n\n  // Legend\n  const leg=document.getElementById('donutLegend');\n  if(!leg)return;\n  leg.innerHTML=slices.map(s=>{\n    const pct=total>0?((s.val/total)*100).toFixed(1):'0';\n    return `<div style=\"display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 12px\">\n      <div style=\"width:12px;height:12px;border-radius:3px;background:${s.color};flex-shrink:0\"><\u002Fdiv>\n      <span style=\"flex:1;font-size:13px;color:var(--text)\">${s.label}<\u002Fspan>\n      <span style=\"font-size:12px;color:var(--text2)\">${pct}%<\u002Fspan>\n      <span style=\"font-size:13px;font-weight:700;color:${s.color}\">S/ ${f(s.val)}<\u002Fspan>\n    <\u002Fdiv>`;\n  }).join('');\n}\n\nfunction getTc(){\n  const v=parseFloat(document.getElementById('tcInput')&&document.getElementById('tcInput').value)||3.70;\n  return v;\n}\nfunction saveTc(){\n  const v=getTc();\n  localStorage.setItem('fin_tc',v);\n  updateUsdPreview();\n  loadCapitalHapi();\n  renderAll();\n}\nfunction loadTc(){\n  const saved=localStorage.getItem('fin_tc');\n  const el=document.getElementById('tcInput');\n  if(el&&saved) el.value=parseFloat(saved);\n}\nfunction onCatChange(){\n  const cat=document.getElementById('txCat').value;\n  const isUsd=cat==='Trabajo España';\n  const label=document.getElementById('txMontoLabel');\n  const preview=document.getElementById('usdPreview');\n  if(label) label.textContent=isUsd?'Monto (USD) *':'Monto (S/) *';\n  if(preview) preview.style.display=isUsd?'block':'none';\n  // Show \"va a Hapi\" checkbox only for España ingreso\n  const hapiWrap=document.getElementById('txVaAHapiWrap');\n  if(hapiWrap) hapiWrap.style.display=(isUsd&&txType==='ingreso')?'flex':'none';\n  updateUsdPreview();\n}\nfunction onRecurrenteChange(){\n  const checked=document.getElementById('txRecurrente').checked;\n  if(checked && txType==='egreso'){\n    const cat=document.getElementById('txCat');\n    if(cat) cat.value='Spotify';\n    onCatChange();\n  }\n}\nfunction updateUsdPreview(){\n  const cat=document.getElementById('txCat')?document.getElementById('txCat').value:'';\n  const preview=document.getElementById('usdPreview');\n  if(!preview) return;\n  if(cat!=='Trabajo España'){preview.style.display='none';return;}\n  const usd=parseFloat(document.getElementById('txMonto').value)||0;\n  const soles=usd*getTc();\n  preview.style.display='block';\n  preview.textContent=usd>0?'= S/ '+f(soles)+' (al tipo de cambio actual)':'Ingresa el monto en USD';\n}\n\nfunction getCapitalInicialYear(year){\n  // Multi-year: use capitalesIniciales object; fallback to legacy data.capitalInicial for first year\n  if(!data.capitalesIniciales) data.capitalesIniciales={};\n  const firstYear=Math.min(...data.years);\n  if(year===firstYear){\n    // First year: use stored value or legacy capitalInicial\n    return data.capitalesIniciales[year]!=null ? data.capitalesIniciales[year] : (data.capitalInicial||0);\n  }\n  // Subsequent years: auto-calculate from previous year\n  const prevYear=year-1;\n  if(!data.years.includes(prevYear)){\n    // If prev year not in list, use stored value or 0\n    return data.capitalesIniciales[year]||0;\n  }\n  const prevCap=getCapitalInicialYear(prevYear);\n  const prevTxs=data.transactions.filter(t=>getTxYear(t)===prevYear);\n  const prevIng=prevTxs.filter(t=>t.tipo==='ingreso').reduce((a,t)=>a+t.monto,0);\n  const prevEgr=prevTxs.filter(t=>t.tipo==='egreso').reduce((a,t)=>a+t.monto,0);\n  return parseFloat((prevCap+(prevIng-prevEgr)).toFixed(2));\n}\nfunction saveCapitalInicial(){\n  if(!data.capitalesIniciales) data.capitalesIniciales={};\n  const firstYear=Math.min(...data.years);\n  if(activeYear!==firstYear) return; // only editable for first year\n  const v=parseFloat(document.getElementById('capitalInicialInput').value)||0;\n  data.capitalesIniciales[activeYear]=v;\n  data.capitalInicial=v; // keep legacy in sync\n  saveData();\n  renderResumen();\n}\nfunction loadCapitalInicial(){\n  const el=document.getElementById('capitalInicialInput');\n  const hint=document.getElementById('capitalInicialHint');\n  if(!el) return;\n  const firstYear=Math.min(...data.years);\n  const val=getCapitalInicialYear(activeYear);\n  el.value=val>0?val:'';\n  if(activeYear===firstYear){\n    el.readOnly=false;\n    el.style.opacity='';\n    el.style.cursor='';\n    if(hint) hint.textContent='Con cuánto empezaste este año';\n  } else {\n    el.readOnly=true;\n    el.style.opacity='0.7';\n    el.style.cursor='not-allowed';\n    const prevYear=activeYear-1;\n    if(hint) hint.textContent=`Calculado automáticamente del ${prevYear}`;\n  }\n}\nfunction getCapitalHapiYear(year){\n  // For the first year: use stored capitalHapiUsd (manually entered)\n  // For subsequent years: use \"monto actual\" of the last recorded month of prevYear\n  // monto actual = balance inicio de mes + depositos/retiros netos de ese mes\n  const firstYear=Math.min(...data.years);\n  if(year===firstYear){\n    return data.capitalHapiUsd||data.capitalHapi||0;\n  }\n  const prevYear=year-1;\n  const balances=data.hapiBalances||{};\n  // Build depsByMonth for prevYear (net USD movements)\n  const depsByMonth={};\n  (data.hapi||[]).forEach(m=>{\n    if(!m.fecha) return;\n    const ym=m.fecha.slice(0,7);\n    if(parseInt(m.fecha.slice(0,4))!==prevYear) return;\n    const val=(m.montoUsd||0)*(m.tipo==='deposito'?1:-1);\n    depsByMonth[ym]=(depsByMonth[ym]||0)+val;\n  });\n  // Find the last month of prevYear that has a balance inicio recorded\n  for(let mo=12;mo>=1;mo--){\n    const ym=prevYear+'-'+String(mo).padStart(2,'0');\n    if(balances[ym]!=null){\n      const montoActual=balances[ym]+(depsByMonth[ym]||0);\n      return parseFloat(montoActual.toFixed(2));\n    }\n  }\n  // Fallback\n  return data.capitalHapiUsd||data.capitalHapi||0;\n}\nfunction saveCapitalHapi(){\n  const firstYear=Math.min(...data.years);\n  if(activeYear!==firstYear) return; // only editable for first year\n  const v=parseFloat(document.getElementById('capitalHapiInput').value)||0;\n  data.capitalHapiUsd=v;\n  saveData();\n  const tc=getTc();\n  const prev=document.getElementById('capitalHapiPreview');\n  if(prev) prev.textContent=v>0?'= S/ '+f(v*tc):'';\n  renderResumen();\n}\nfunction loadCapitalHapi(){\n  const el=document.getElementById('capitalHapiInput');\n  const hint=document.getElementById('capitalHapiHint');\n  if(!el) return;\n  const firstYear=Math.min(...data.years);\n  const usd=getCapitalHapiYear(activeYear);\n  if(el) el.value=usd>0?usd:'';\n  const tc=getTc();\n  const prev=document.getElementById('capitalHapiPreview');\n  if(prev) prev.textContent=usd>0?'= S/ '+f(usd*tc):'';\n  if(activeYear===firstYear){\n    el.readOnly=false;\n    el.style.opacity='';\n    el.style.cursor='';\n    if(hint) hint.textContent='Lo que ya tenías en Hapi (USD)';\n  } else {\n    el.readOnly=true;\n    el.style.opacity='0.7';\n    el.style.cursor='not-allowed';\n    const prevYear=activeYear-1;\n    if(hint) hint.textContent='Último balance registrado en '+prevYear;\n  }\n}\nfunction updateInvUsdPreview(){\n  const usd=parseFloat(document.getElementById('invMonto').value)||0;\n  const tc=getTc();\n  const prev=document.getElementById('invUsdPreview');\n  if(!prev) return;\n  if(usd>0){\n    prev.style.display='block';\n    const isHapiDeposit = _currentInvSrc==='hapi' && invType==='deposito';\n    if(isHapiDeposit){\n      const comision=usd*(window._invComision||0);\n      const neto=usd-comision;\n      if(comision>0){\n        prev.textContent=`−$${f(comision)} comisión → neto $${f(neto)} = S/ ${f(neto*tc)}`;\n      } else {\n        prev.textContent=`Sin comisión → $${f(neto)} = S/ ${f(neto*tc)}`;\n      }\n    } else {\n      prev.textContent='= S/ '+f(usd*tc)+' (al tipo de cambio actual)';\n    }\n  } else {\n    prev.style.display='none';\n  }\n}\n\nfunction loadData(){\n  try{\n    const d=localStorage.getItem('fin_personal_v1');\n    if(d){\n      const parsed=JSON.parse(d);\n      // Validate structure — if corrupted, reset\n      if(parsed && typeof parsed==='object'){\n        data=parsed;\n      }\n    }\n  }catch(e){data={years:[],transactions:[],hapi:[],productos:[]};}\n  if(!data.years||!Array.isArray(data.years)||!data.years.length)data.years=[new Date().getFullYear()];\n  if(!Array.isArray(data.transactions))data.transactions=[];\n  if(!Array.isArray(data.hapi))data.hapi=[];\n  if(!Array.isArray(data.productos))data.productos=[];\n  if(!Array.isArray(data.catalogo))data.catalogo=[];\n  if(!Array.isArray(data.ventasProd))data.ventasProd=[];\n  data.catalogo=data.catalogo.map(p=>({...p,costo:parseFloat(p.costo)||0}));\n  if(!Array.isArray(data.ingCatsCustom))data.ingCatsCustom=[];\n  if(!Array.isArray(data.vouchers))data.vouchers=[];\n  data.vouchers=data.vouchers.filter(v=>v&&v.img);\n  data.vouchers.forEach(v=>{ if(!v.moneda) v.moneda='PEN'; if(typeof v.cat!=='string') v.cat=''; if(!v.tipo) v.tipo=(typeof v.img==='string'&&v.img.startsWith('data:application/pdf'))?'pdf':'img'; });\n  if(!Array.isArray(data.vchCats)) data.vchCats=[];\n  if(!Array.isArray(data.proveedores)||!data.proveedores.length)data.proveedores=['Sumbex','Temu','Ala','Roma','Red Car'];\n  data.proveedores=[...new Set(data.proveedores.filter(p=>typeof p==='string'&&p.trim()).map(p=>p.trim()))];\n  if(!Array.isArray(data.hapiSnaps))data.hapiSnaps=[];\n  if(!data.hapiBalances||typeof data.hapiBalances!=='object')data.hapiBalances={};\n  if(typeof data.metaAhorro!=='number')data.metaAhorro=0;\n  if(typeof data.capitalInicial !== 'number') data.capitalInicial = 0;\n  if(typeof data.capitalHapi !== 'number') data.capitalHapi = 0;\n  if(!data.capitalesIniciales||typeof data.capitalesIniciales!=='object') data.capitalesIniciales={};\n  // Migrate legacy capitalInicial to per-year if not done yet\n  const firstYear=Math.min(...data.years);\n  if(data.capitalInicial>0 && data.capitalesIniciales[firstYear]==null){\n    data.capitalesIniciales[firstYear]=data.capitalInicial;\n  }\n  if(!Array.isArray(data.notas))data.notas=[];\n  if(!Array.isArray(data.catsCustom))data.catsCustom=[];\n  // Sanitize: remove nulls but keep valid entries, normalize monto to number\n  data.hapi=data.hapi.filter(m=>m&&typeof m==='object'&&m.id).map(m=>({...m,monto:parseFloat(m.monto)||0}));\n  data.productos=data.productos.filter(m=>m&&typeof m==='object'&&m.id).map(m=>({...m,monto:parseFloat(m.monto)||0}));\n  data.transactions=data.transactions.filter(m=>m&&typeof m==='object'&&m.id).map(m=>({...m,monto:parseFloat(m.monto)||0}));\n  activeYear=data.years[data.years.length-1];\n  buildYearSel();updateLastBackupLabel();loadTc();loadCapitalInicial();loadCapitalHapi();loadMeta();updateEgrCats();updateIngCatsFilter();renderAll();\n}\nfunction saveData(){\n  data._ts=Date.now();\n  try{ localStorage.setItem('fin_personal_v1',JSON.stringify(data)); updateStorageLabel(); }\n  catch(e){ toast('Sin espacio para guardar — exporta un respaldo y borra fotos que no uses','err'); }\n  scheduleCloudPush();\n}\n// ── SINCRONIZACIÓN GOOGLE SHEETS ─────────────────────────────────────────────\nlet _cloudTimer=null, _cloudBusy=false;\nfunction cloudUrl(){ return (localStorage.getItem('fin_cloud_url')||'').trim(); }\nfunction cloudStatus(t,c){ const el=document.getElementById('cloudStatus'); if(el){ el.textContent=t; el.style.color=c||'var(--text3)'; } }\nfunction setCloudUrl(v){\n  v=(v||'').trim();\n  if(v && !/^https:\\/\\/script\\.google\\.com\\/.+\\/exec/.test(v)){ toast('La URL debe terminar en /exec','err'); return; }\n  localStorage.setItem('fin_cloud_url',v);\n  if(v){ cloudStatus('Conectando…'); cloudPull(false,true); } else cloudStatus('Sin conectar');\n}\nfunction scheduleCloudPush(){\n  if(!cloudUrl()) return;\n  clearTimeout(_cloudTimer);\n  cloudStatus('Cambios sin subir…','var(--yellow)');\n  _cloudTimer=setTimeout(()=>cloudPush(false),2000);\n}\nasync function cloudPush(manual){\n  const url=cloudUrl(); if(!url){ if(manual) toast('Primero pega la URL del Apps Script','err'); return; }\n  if(_cloudBusy){ scheduleCloudPush(); return; }\n  _cloudBusy=true; cloudStatus('Subiendo…');\n  try{\n    const r=await fetch(url,{method:'POST',redirect:'follow',body:JSON.stringify({action:'save',data})});\n    const txt=await r.text(); let j;\n    try{ j=JSON.parse(txt); }catch(_){ throw new Error(/<html/i.test(txt)?'Google pidió iniciar sesión: el acceso debe ser \"Cualquier persona\"':'Respuesta inválida ('+r.status+')'); }\n    if(!j.ok) throw new Error(j.error||'Error');\n    localStorage.setItem('fin_cloud_last',new Date().toLocaleString('es-PE'));\n    cloudStatus('Guardado en la hoja · '+new Date().toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'}),'var(--green)');\n    if(manual) toast('Datos subidos a Google Sheets','ok');\n  }catch(e){ console.error('cloudPush',e); cloudStatus('No se pudo subir: '+(e.message||e),'var(--red)'); if(manual) toast('No se pudo subir: '+(e.message||e),'err'); }\n  _cloudBusy=false;\n}\nasync function cloudPull(manual,first){\n  const url=cloudUrl(); if(!url){ if(manual) toast('Primero pega la URL del Apps Script','err'); return; }\n  cloudStatus('Revisando la hoja…');\n  try{\n    const r=await fetch(url+(url.includes('?')?'&':'?')+'action=get&t='+Date.now());\n    const j=await r.json();\n    if(!j.ok) throw new Error(j.error||'Error');\n    const remote=j.data;\n    if(!remote){ cloudStatus('Hoja vacía — subiendo tus datos…'); await cloudPush(manual); return; }\n    const lt=data._ts||0, rt=remote._ts||0;\n    if(manual){\n      if(!confirm('¿Reemplazar los datos de este dispositivo por los de la hoja?')) { cloudStatus(''); return; }\n    } else if(rt<=lt){\n      if(rt<lt) await cloudPush(false); else cloudStatus('Al día con la hoja','var(--green)');\n      return;\n    }\n    localStorage.setItem('fin_personal_v1',JSON.stringify(remote));\n    loadData(); if(typeof renderReponer==='function') renderReponer();\n    cloudStatus('Datos traídos de la hoja','var(--green)');\n    toast(first?'Conectado — datos cargados desde Google Sheets':'Datos actualizados desde la hoja','ok');\n  }catch(e){ cloudStatus('No se pudo conectar con la hoja','var(--red)'); if(manual||first) toast('No se pudo conectar. Revisa la URL y que el acceso sea \"Cualquier persona\"','err'); }\n}\nfunction initCloud(){\n  const u=cloudUrl(), el=document.getElementById('cloudUrl');\n  if(el) el.value=u;\n  if(u) cloudPull(false); else cloudStatus('Sin conectar');\n}\n\nfunction buildYearSel(){\n  const s=document.getElementById('yearSel');\n  s.innerHTML=data.years.map(y=>`<option value=\"${y}\"${y===activeYear?' selected':''}>${y}<\u002Foption>`).join('');\n}\nfunction changeYear(){activeYear=parseInt(document.getElementById('yearSel').value);loadCapitalInicial();loadCapitalHapi();renderAll();}\nfunction addYear(){\n  const ny=Math.max(...data.years)+1;\n  data.years.push(ny);activeYear=ny;\n  saveData();buildYearSel();document.getElementById('yearSel').value=ny;\n  loadCapitalInicial();loadCapitalHapi();\n  renderAll();toast('Año '+ny+' agregado — capital inicial calculado automáticamente','ok');\n}\n\nfunction switchTab(tab){\n  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',['resumen','ingresos','egresos','hapi','productos','grafico','notas'][i]===tab));\n  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));\n  document.getElementById('sec-'+tab).classList.add('active');\n  if(tab==='ingresos'){updateIngCatsFilter();}\n  if(tab==='ingresos'||tab==='egresos'){renderTx();if(tab==='egresos')renderGastosFijos();}\n  if(tab==='hapi'){buildMonthFilters();renderInvSection('hapi');renderHapiRent();buildVchMesFilter();renderVchFolders();renderVouchers();}\n  if(tab==='productos'){renderReponer();buildMonthFilters();renderProductosSection();renderCatalogo();buildVentaMesFilter();renderVentasProd();}\n  if(tab==='grafico'){renderGrafico();renderProdChart();setTimeout(renderLineChart,50);}\n  if(tab==='notas')renderNotas();\n}\n\nfunction renderAll(){\n  renderResumen();renderTx();renderInv();renderHapiRent();\n  renderMesBanner();renderProgreso();renderMeta();checkAlerta();renderGastosFijos();\n  renderRacha();renderBarrasMensuales();\n  if(document.getElementById('sec-grafico')&&document.getElementById('sec-grafico').classList.contains('active'))renderGrafico();\n}\n\n// ── META DE AHORRO ─────────────────────────────────────────────────────────────\nfunction saveMeta(){\n  const v=parseFloat(document.getElementById('metaInput').value)||0;\n  data.metaAhorro=v; saveData(); renderMeta();\n}\nfunction loadMeta(){\n  const el=document.getElementById('metaInput');\n  if(el&&data.metaAhorro>0) el.value=data.metaAhorro;\n}\nfunction renderMeta(){\n  const meta=data.metaAhorro||0;\n  const txs=data.transactions.filter(t=>getTxYear(t)===activeYear);\n  const ing=txs.filter(t=>t.tipo==='ingreso').reduce((a,t)=>a+t.monto,0);\n  const egr=txs.filter(t=>t.tipo==='egreso').reduce((a,t)=>a+t.monto,0);\n  const tc=getTc();\n  // Capital en Hapi del año activo + movimientos registrados en Hapi\n  const capitalHapiUsd=getCapitalHapiYear(activeYear);\n  const hapiNet=calcNet(data.hapi||[]);\n  const hapiTotal=capitalHapiUsd*tc+hapiNet;\n  const ahorrado=ing-egr+hapiTotal;\n  const pct=meta>0?Math.min(100,(ahorrado/meta)*100):0;\n  const fill=document.getElementById('metaBarFill');\n  const actual=document.getElementById('metaActual');\n  const pctEl=document.getElementById('metaPct');\n  if(fill) fill.style.width=Math.max(0,pct)+'%';\n  if(fill) fill.style.background=pct>=100?'var(--green)':pct>60?'var(--yellow)':'var(--green)';\n  if(actual) actual.textContent='S/ '+f(ahorrado)+' ahorrado (incl. Hapi)';\n  if(pctEl) pctEl.textContent=meta>0?pct.toFixed(1)+'%':'—';\n}\n\n// ── BANNER MES ACTUAL ──────────────────────────────────────────────────────────\nfunction renderMesBanner(){\n  const el=document.getElementById('mesBanner');\n  if(!el)return;\n  const now=new Date();\n  const mi=now.getMonth();\n  const yr=now.getFullYear();\n  const mesNombre=now.toLocaleDateString('es-PE',{month:'long',year:'numeric'});\n  const txs=data.transactions.filter(t=>{\n    if(getTxYear(t)!==yr)return false;\n    return getTxMonth(t)===mi;\n  });\n  const ing=txs.filter(t=>t.tipo==='ingreso').reduce((a,t)=>a+t.monto,0);\n  const egr=txs.filter(t=>t.tipo==='egreso').reduce((a,t)=>a+t.monto,0);\n  const bal=ing-egr;\n  const cap=data.capitalInicial||0;\n  el.innerHTML=`\n    <div style=\"width:100%;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:4px\">\n      <span style=\"font-size:12px;font-weight:600;color:var(--text2);text-transform:capitalize\">${mesNombre}<\u002Fspan>\n      <span style=\"font-size:10px;color:var(--text3)\">Mes en curso<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"mes-banner-item\">\n      <div class=\"mes-banner-label\">Ingresos<\u002Fdiv>\n      <div class=\"mes-banner-val\" style=\"color:var(--green)\">S/ ${f(ing)}<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"mes-banner-item\">\n      <div class=\"mes-banner-label\">Egresos<\u002Fdiv>\n      <div class=\"mes-banner-val\" style=\"color:var(--red)\">S/ ${f(egr)}<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"mes-banner-item\">\n      <div class=\"mes-banner-label\">Balance<\u002Fdiv>\n      <div class=\"mes-banner-val\" style=\"color:${bal>=0?'var(--green)':'var(--red)'}\">S/ ${f(bal)}<\u002Fdiv>\n    <\u002Fdiv>`;\n}\n\n// ── BARRAS DE PROGRESO ─────────────────────────────────────────────────────────\nfunction renderProgreso(){\n  const el=document.getElementById('progWrap');\n  if(!el)return;\n  const txs=data.transactions.filter(t=>getTxYear(t)===activeYear);\n  const ing=txs.filter(t=>t.tipo==='ingreso').reduce((a,t)=>a+t.monto,0);\n  const egr=txs.filter(t=>t.tipo==='egreso').reduce((a,t)=>a+t.monto,0);\n  const max=Math.max(ing,egr,1);\n  el.innerHTML=`\n    <div class=\"prog-row\">\n      <span class=\"prog-label\" style=\"color:var(--green)\">Ingresos<\u002Fspan>\n      <div class=\"prog-bar-bg\"><div class=\"prog-bar-fill\" style=\"width:${(ing/max*100).toFixed(1)}%;background:var(--green)\"><\u002Fdiv><\u002Fdiv>\n      <span class=\"prog-val\" style=\"color:var(--green)\">S/ ${f(ing)}<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"prog-row\">\n      <span class=\"prog-label\" style=\"color:var(--red)\">Egresos<\u002Fspan>\n      <div class=\"prog-bar-bg\"><div class=\"prog-bar-fill\" style=\"width:${(egr/max*100).toFixed(1)}%;background:var(--red)\"><\u002Fdiv><\u002Fdiv>\n      <span class=\"prog-val\" style=\"color:var(--red)\">S/ ${f(egr)}<\u002Fspan>\n    <\u002Fdiv>`;\n}\n\n// ── ALERTA INACTIVIDAD ─────────────────────────────────────────────────────────\nfunction checkAlerta(){\n  const el=document.getElementById('alertaBanner');\n  const msg=document.getElementById('alertaMsg');\n  if(!el)return;\n  const txs=data.transactions;\n  if(!txs.length){ el.style.display='none'; return; }\n  const last=txs.reduce((a,t)=>t.fecha>a?t.fecha:a,'');\n  if(!last){ el.style.display='none'; return; }\n  const dias=Math.floor((Date.now()-new Date(last+'T12:00:00'))/(1000*60*60*24));\n  if(dias>=5){\n    el.style.display='flex';\n    msg.textContent=`Llevas ${dias} días sin registrar movimientos.`;\n  } else {\n    el.style.display='none';\n  }\n}\n\n// ── GRÁFICO DE LÍNEA HAPI ─────────────────────────────────────────────────────\nfunction renderLineChart(){\n  const canvas=document.getElementById('lineCanvas');\n  const emptyEl=document.getElementById('lineEmpty');\n  if(!canvas)return;\n  const balances=data.hapiBalances||{};\n  const months=Array.from({length:12},(_,i)=>activeYear+'-'+String(i+1).padStart(2,'0'));\n  const points=months.map(ym=>balances[ym]!=null?balances[ym]:null);\n  const hasData=points.some(p=>p!=null);\n  if(!hasData){\n    canvas.style.display='none';\n    if(emptyEl)emptyEl.style.display='block';\n    return;\n  }\n  canvas.style.display='block';\n  if(emptyEl)emptyEl.style.display='none';\n\n  const W=canvas.offsetWidth||320;\n  const H=160;\n  canvas.width=W; canvas.height=H;\n  const ctx=canvas.getContext('2d');\n  ctx.clearRect(0,0,W,H);\n\n  const vals=points.filter(p=>p!=null);\n  const minV=Math.min(...vals)*0.97;\n  const maxV=Math.max(...vals)*1.03;\n  const range=maxV-minV||1;\n  const pad={l:10,r:10,t:16,b:24};\n  const cw=W-pad.l-pad.r;\n  const ch=H-pad.t-pad.b;\n\n  // Grid lines\n  ctx.strokeStyle='#2e2e2e'; ctx.lineWidth=1;\n  [0,.5,1].forEach(frac=>{\n    const y=pad.t+ch*(1-frac);\n    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();\n    ctx.fillStyle='#555';ctx.font='9px sans-serif';ctx.textAlign='left';\n    ctx.fillText('$'+f(minV+range*frac),pad.l,y-3);\n  });\n\n  // Month labels\n  const MLAB=['E','F','M','A','M','J','J','A','S','O','N','D'];\n  ctx.fillStyle='#555';ctx.font='9px sans-serif';ctx.textAlign='center';\n  months.forEach((_,i)=>{\n    const x=pad.l+(i/(11))*cw;\n    ctx.fillText(MLAB[i],x,H-6);\n  });\n\n  // Line + fill\n  const coords=months.map((ym,i)=>{\n    const v=balances[ym];\n    if(v==null)return null;\n    return {x:pad.l+(i/11)*cw, y:pad.t+ch*(1-(v-minV)/range)};\n  });\n  const filled=coords.filter(Boolean);\n  if(filled.length<1)return;\n\n  // Gradient fill\n  const grad=ctx.createLinearGradient(0,pad.t,0,pad.t+ch);\n  grad.addColorStop(0,'rgba(244,114,182,0.3)');\n  grad.addColorStop(1,'rgba(244,114,182,0)');\n  ctx.beginPath();\n  let started=false;\n  coords.forEach((c,i)=>{\n    if(!c)return;\n    if(!started){ctx.moveTo(c.x,c.y);started=true;}\n    else ctx.lineTo(c.x,c.y);\n  });\n  // close fill path\n  const lastC=filled[filled.length-1];\n  const firstC=filled[0];\n  ctx.lineTo(lastC.x,pad.t+ch);\n  ctx.lineTo(firstC.x,pad.t+ch);\n  ctx.closePath();\n  ctx.fillStyle=grad;ctx.fill();\n\n  // Line\n  ctx.beginPath();started=false;\n  coords.forEach(c=>{\n    if(!c)return;\n    if(!started){ctx.moveTo(c.x,c.y);started=true;}\n    else ctx.lineTo(c.x,c.y);\n  });\n  ctx.strokeStyle='#f472b6';ctx.lineWidth=2;ctx.stroke();\n\n  // Dots\n  coords.forEach(c=>{\n    if(!c)return;\n    ctx.beginPath();ctx.arc(c.x,c.y,3.5,0,Math.PI*2);\n    ctx.fillStyle='#f472b6';ctx.fill();\n    ctx.strokeStyle='#0f0f0f';ctx.lineWidth=1.5;ctx.stroke();\n  });\n}\n\n\nfunction f(n){return Math.abs(n).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});}\nfunction getTxYear(t){return t.fecha?parseInt(t.fecha.slice(0,4)):null;}\nfunction getTxMonth(t){return t.fecha?parseInt(t.fecha.slice(5,7))-1:null;}\nfunction sum(arr,tipo,cat){return arr.filter(t=>t.tipo===tipo&&t.cat===cat).reduce((a,t)=>a+t.monto,0);}\n\nfunction renderResumen(){\n  const txs=data.transactions.filter(t=>getTxYear(t)===activeYear);\n  const totalIng=txs.filter(t=>t.tipo==='ingreso'&&!t.vaAHapi).reduce((a,t)=>a+t.monto,0);\n  const totalEgr=txs.filter(t=>t.tipo==='egreso').reduce((a,t)=>a+t.monto,0);\n  const hapiNet=calcNet(data.hapi);\n  const prodNet=(data.productos||[]).reduce((a,m)=>a+(m.tipo==='deposito'?m.monto:-m.monto),0);\n  const capital=getCapitalInicialYear(activeYear);\n  const tc=getTc();\n  const capitalHapiUsd=getCapitalHapiYear(activeYear);\n  const capitalHapiSoles=capitalHapiUsd*tc;\n  const hapiTotal=capitalHapiSoles+hapiNet;\n  const hapiTotalUsd=hapiTotal/tc;\n  // Balance real: capital inicial + ingresos - egresos + hapi total - productos\n  const bal=capital+(totalIng-totalEgr)+hapiTotal-prodNet;\n\n  // Update hapi card in resumen\n  const hapiVal=document.getElementById('hapiResumenVal');\n  if(hapiVal) hapiVal.textContent='S/ '+f(hapiTotal);\n  const hapiUsdEl=document.getElementById('hapiResumenUsd');\n  if(hapiUsdEl) hapiUsdEl.textContent='$ '+f(hapiTotalUsd);\n\n  const cap=getCapitalInicialYear(activeYear);\n  document.getElementById('annualCards').innerHTML=[\n    ['Capital inicial','S/ '+f(cap),''],\n    ['Total ingresos','S/ '+f(totalIng),'green'],\n    ['Total egresos','S/ '+f(totalEgr),'red'],\n    ['En Hapi','S/ '+f(hapiTotal),'yellow'],\n    ['Balance real','S/ '+f(bal),bal>=0?'green':'red'],\n  ].map(([l,v,c])=>`<div class=\"sum-card\"><div class=\"sum-label\">${l}<\u002Fdiv><div class=\"sum-value ${c}\">${v}<\u002Fdiv><\u002Fdiv>`).join('');\n\n  // Tarjetas de productos (catálogo + ventas del año activo)\n  const pc=document.getElementById('prodCards');\n  if(pc){\n    const vsY=(data.ventasProd||[]).filter(v=>(v.fecha||'').slice(0,4)===String(activeYear));\n    const vend=vsY.reduce((a,v)=>a+(parseFloat(v.total)||0),0);\n    const ganP=vsY.reduce((a,v)=>a+(v.items||[]).reduce((x,i)=>x+((parseFloat(i.precio)||0)-(parseFloat(i.costo)||0))*i.qty,0),0);\n    const invY=(data.productos||[]).filter(m=>(m.fecha||'').slice(0,4)===String(activeYear))\n      .reduce((a,m)=>a+(m.tipo==='deposito'?(parseFloat(m.monto)||0):-(parseFloat(m.monto)||0)),0);\n    const
